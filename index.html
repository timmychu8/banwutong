/* ===== AI 功能：拍照辨識名冊、訊息潤飾 =====
   實際的 Gemini 呼叫在伺服器端：Supabase Edge Function「ai」（原始碼 supabase/functions/ai/index.ts；改放別處時只要改 AI_URL），金鑰不會出現在網頁裡。
   這裡只負責：取登入憑證、送出請求、把錯誤翻成看得懂的中文。 */
const AI={busy:false};
const POL={};                       // 潤飾前的原文：textarea id → 原文，給「復原原文」用
function aiErr(code,msg){const e=new Error(msg||code);e.code=code;return e}
const AI_MSG={
  offline:'目前沒有網路，無法使用 AI',
  auth:'請先登入再使用 AI',
  unauthorized:'登入已過期，請重新登入後再試',
  forbidden:'這個帳號沒有使用 AI 的權限',
  no_key:'AI 還沒啟用：要先到 Supabase → Edge Functions → Secrets 新增 Gemini 金鑰（名稱 GEMINI_API_KEY）',
  nofn:'AI 服務還沒設定好：要先在 Supabase 建立名為 ai 的 Edge Function。其他功能不受影響',
  gw_jwt:'AI 服務沒有接受登入憑證。請先登出再登入一次後再試；若一直這樣，需要調整 ai 函式的 JWT 驗證設定',
  bad_key:'Gemini 金鑰無效，請檢查 Supabase Secrets 裡的 GEMINI_API_KEY',
  quota:'AI 額度暫時用完了，請過一會兒再試',
  rate_limited:'使用太頻繁，請等幾分鐘再試',
  too_large:'照片或內容太大，請改拍小一點、或分成幾張',
  blocked:'AI 無法處理這份內容',
  timeout:'AI 回應太久，請再試一次',
  net:'網路連線失敗，請檢查網路後再試',
  cors:'連得到 Supabase，但 AI 函式沒有正常回應（不是你的網路問題）。多半是還沒建立名為 ai 的函式（要小寫，並按過 Deploy function）；也可能只是剛好斷線，再試一次',
  empty:'AI 沒有看出內容，請換一張更清楚的照片再試',
  auth_unavailable:'暫時無法確認登入狀態，請稍後再試',
  bad_request:'送出的資料有問題，請再試一次',
  upstream:'AI 暫時無法使用，請稍後再試'
};
const aiText=e=>AI_MSG[e&&e.code]||AI_MSG.upstream;
const AI_URL=SB_URL.replace(/\/+$/,'')+'/functions/v1/ai';   // Supabase Edge Function「ai」
/* 送出請求失敗時：伺服器有沒有回應？用 no-cors 的 GET 探測（連回應缺少許可標頭、內容讀不到也算「有回應」）。
   函式還沒建立時，Supabase 閘道的 404 沒有 CORS 標頭，瀏覽器會把它當成連線失敗，這裡才能分辨出來 */
async function aiReachable(){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),6000);
  try{await fetch(AI_URL,{method:'GET',mode:'no-cors',cache:'no-store',signal:c.signal});return true}
  catch(e){return false}
  finally{clearTimeout(t)}
}
/* 呼叫 AI_URL；失敗時丟出帶 code 的錯誤 */
async function aiCall(action,payload,ms){
  if(!navigator.onLine)throw aiErr('offline');
  if(!sync.client||AUTH.state!=='in')throw aiErr('auth');
  let tok='';
  try{const r=await sync.client.auth.getSession();tok=(r&&r.data&&r.data.session&&r.data.session.access_token)||''}catch(e){}
  if(!tok)throw aiErr('auth');
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),ms||60000);
  let res;
  try{
    res=await fetch(AI_URL,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok,apikey:SB_KEY},body:JSON.stringify(Object.assign({action:action},payload)),signal:ctl.signal});
  }catch(e){
    clearTimeout(tm);
    if(e&&e.name==='AbortError')throw aiErr('timeout');
    throw aiErr(await aiReachable()?'cors':'net');   // 瀏覽器只會說「連線失敗」，所以再探測一次，分辨真的沒網路還是函式有問題
  }
  clearTimeout(tm);
  let j=null;
  try{j=await res.json()}catch(e){}
  if(res.ok&&j&&!j.error)return j;
  /* 沒有 error.code 的回應是 Supabase 閘道（不是我們的函式）回的：404＝函式還沒建立；401＝閘道不接受登入憑證 */
  const code=(j&&j.error&&j.error.code)||(res.status===404?'nofn':res.status===401?'gw_jwt':res.status===413?'too_large':'upstream');
  throw aiErr(code,j&&j.error&&j.error.message);
}

/* ----- 訊息潤飾 ----- */
const numsOf=t=>(String(t).match(/\d+(?:[.,]\d+)*/g)||[]).map(x=>x.replace(/,/g,'').replace(/^0+(?=\d)/,''));
/* 原文裡的數字（金額、分數、日期…）有哪些沒出現在潤飾後的文字裡（整個數字比對，4800 不會被當成含有 80） */
function numsLost(src,out){
  const have={},seen={},lost=[];
  numsOf(out).forEach(n=>{have[n]=1});
  numsOf(src).forEach(n=>{if(!seen[n]){seen[n]=1;if(!have[n])lost.push(n)}});
  return lost;
}

/* ----- 拍照辨識名冊 ----- */
const blobB64=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=()=>no(r.error);r.readAsDataURL(b)});
/* 縮到長邊 2000px 以內的 JPEG（太大就再縮小），避免超過函式 6 MB 的上限 */
async function ocrPrep(f){
  let blob=null;
  try{
    const bm=await createImageBitmap(f);
    for(const mx of [2000,1500,1100]){
      const k=Math.min(1,mx/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(bm.width*k));c.height=Math.max(1,Math.round(bm.height*k));
      const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(bm,0,0,c.width,c.height);
      blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
      if(blob&&blob.size<=3.2*1024*1024)break;
    }
  }catch(e){blob=null}
  if(!blob){
    if(f.size>3.2*1024*1024||!/^image\//.test(f.type))throw aiErr('too_large');
    blob=f;
  }
  return {b64:await blobB64(blob),mime:/^image\/(jpeg|png|webp)$/.test(blob.type)?blob.type:'image/jpeg'};
}
const ocrClean=s=>String(s==null?'':s).replace(/[\t\r\n]+/g,' ').replace(/\s+/g,' ').trim();
/* 「仁愛國中 二年級」「明華110」→ 年級＋學校 */
function ocrSchool(s){
  s=ocrClean(s);
  if(!s)return {grade:'',school:''};
  let grade='';const rest=[];
  s.split(/[\s,，、/]+/).filter(Boolean).forEach(t=>{
    const g=!grade&&bulkGrade(t);
    if(g)grade=g;else rest.push(t);
  });
  let school=rest.join(' ');
  if(!grade){
    /* 「仁愛國中二年級」連在一起 */
    const m=school.match(/^(.*?)(國中|國小|高中|高職)([一二三四五六七八九1-9])年級?$/);
    if(m){grade=bulkGrade(m[2]+m[3]+'年級');if(grade)school=m[1]+m[2]}
  }
  if(!grade){
    /* 學校和年級分開寫：「仁愛國中」「二年級」 */
    const toks=school.split(' '),i=toks.findIndex(t=>/^[一二三四五六七八九1-9]年級?$/.test(t));
    if(i>=0){
      const sc=toks.filter((t,k)=>k!==i).join(' '),kind=/國中$/.test(sc)?'國中':/國小$/.test(sc)?'國小':/高(中|職)$/.test(sc)?'高中':'';
      const g=kind?bulkGrade(kind+toks[i].replace(/年級?$/,'')+'年級'):'';
      if(g){grade=g;school=sc}
    }
  }
  return {grade:grade,school:school};
}
/* AI 回傳的一位學生 → 匯入用的列 */
function ocrRow(st){
  let name=ocrClean(st&&st.name);
  if(/^[一-鿿\s·]+$/.test(name))name=name.replace(/\s+/g,'');
  const sg=ocrSchool(st&&st.school),o=parseInt(st&&st.order,10);
  return {raw:'',seat:o>0&&o<1000?o:null,name:name,gender:'',grade:sg.grade,school:sg.school,parent:'',phone:bulkPhone(st&&st.phone)||ocrClean(st&&st.phone).replace(/\s/g,''),note:ocrClean(st&&st.note)};
}
/* 把列轉回「貼上匯入」的標題列＋Tab 分隔文字（姓名放第一欄，才不會被前後空白吃掉） */
function bulkSerialize(rows){
  const cols=[['name','姓名'],['seat','座號'],['gender','性別'],['grade','年級'],['school','學校'],['parent','家長'],['phone','電話'],['note','備註']];
  const has=k=>k==='name'||k==='seat'||rows.some(r=>r[k]!=null&&r[k]!=='');
  const use=cols.filter(c=>has(c[0]));
  const cell=(r,k)=>{
    let v=k==='name'?(r.name||r.raw||''):r[k];
    if(k==='gender')v=v==='M'?'男':v==='F'?'女':'';
    return v==null?'':ocrClean(v);
  };
  return use.map(c=>c[1]).join('\t')+'\n'+rows.map(r=>use.map(c=>cell(r,c[0])).join('\t')).join('\n');
}
/* 貼上匯入視窗裡的「拍照辨識」區塊（辨識中顯示進度） */
function ocrBox(){
  const busy=BULK&&BULK.busy;
  return '<div class="ocrbox">'+(busy
    ?'<div class="note ocrst" role="status" aria-live="polite"><i class="spin" aria-hidden="true"></i><span id="st-ocr">'+esc(busy)+'</span></div>'
    :'<button class="btn ocrbtn" data-a="ocrPick">'+ic('cam',18)+'拍照辨識名冊（AI）</button><p class="tiny faint">拍下或選取紙本名冊，AI 會把姓名、座號、學校、電話填進下面的文字框，你檢查、修改後再解析匯入。照片只會傳給 Google 的 Gemini 辨識，不會存進班務通。</p>')+'</div>';
}
ACT.ocrPick=()=>{
  if(!BULK||BULK.busy)return;
  if(!navigator.onLine){toast(AI_MSG.offline);return}
  if(!AUTH.uid){toast(AI_MSG.auth);return}
  BULK.text=val('b-text');
  const e=$('#ocr-img');if(e)e.click();
};
IN.ocrIn=async el=>{
  const files=Array.from(el.files||[]);el.value='';
  const me=BULK;
  if(!files.length||!me||me.busy)return;
  me.text=$('#b-text')?val('b-text'):me.text;
  const say=m=>{me.busy=m;const s=$('#st-ocr');if(s)s.textContent=m};
  me.busy='正在整理照片…';bulkSheet();
  let got=[],bad=null,done=0;
  for(let i=0;i<files.length;i++){
    const tag=files.length>1?'（第 '+(i+1)+'／'+files.length+' 張）':'';
    say('正在整理照片'+tag+'…');
    try{
      const img=await ocrPrep(files[i]);
      say('AI 辨識中'+tag+'，約需 10–30 秒…');
      const j=await aiCall('ocr',{image:img.b64,mime:img.mime},70000);
      got=got.concat((j.students||[]).map(ocrRow).filter(r=>r.name));
      done++;
    }catch(e){
      bad=e;
      if(['no_key','nofn','cors','gw_jwt','bad_key','unauthorized','forbidden','auth','offline','quota','rate_limited'].indexOf(e.code)>=0)break;
    }
  }
  me.busy='';
  if(BULK!==me){toast(got.length?'已取消，辨識結果未加入':aiText(bad),3000);return}
  if(got.length){
    const old=me.text.trim()?bulkRows(me.text):[];
    me.text=bulkSerialize(old.concat(got));
  }
  me.rows=null;
  const sh=$('#layer .sheet');
  if(!sh||sh.getAttribute('aria-label')==='貼上匯入學生')bulkSheet();   // 不蓋掉使用者中途開啟的其他視窗
  if(got.length){
    const unsure=got.filter(r=>/字跡不清|請核對/.test(r.note)).length;
    toast('辨識出 '+got.length+' 位學生'+(unsure?'，其中 '+unsure+' 位字跡不清':'')+'。請檢查後按「解析預覽」'+(bad?'（有照片失敗：'+aiText(bad)+'）':''),5200);
  }else if(bad)toast(aiText(bad),4800);
  else toast('這張照片裡沒有辨識到學生名單，請換更清楚、更正面的照片',4200);
};

const COLLAB={list:null,err:'',email:'',busy:false};
function collabMsg(e){
  const m=String((e&&e.message)||'');
  if(/no_user/.test(m))return '找不到這個信箱的帳號。請先到 Supabase 後台 → Authentication → Users → Add user 建立帳號（勾選 Auto Confirm User），再回來加入。';
  if(/\bself\b/.test(m))return '這是你自己的信箱，不用加入。';
  if(/already_member/.test(m))return '這個帳號已經加入某個共用空間了，請對方先到「多人共編」按「離開共編」。';
  if(/is_owner/.test(m))return '這個帳號自己也有共編成員，不能再加入別人的空間。';
  if(/is_member/.test(m))return '你目前是共編成員，只有管理者可以加入新成員。';
  if(/not_logged_in|JWT/.test(m))return '登入已過期，請重新登入';
  if(isNet(e))return '網路連線失敗，請稍後再試';
  return '操作失敗，請稍後再試';
}
const onCollabPage=()=>{const t=NAV.stack[NAV.stack.length-1];return !!t&&t.name==='collab'};

};

/* ===== 匯入備份（JSON）：把「匯出備份」產生的檔案還原回來 ===== */
const BK_LBL={classes:'班級',students:'學生',att:'點名紀錄',exams:'小考',school:'段考成績',makeups:'補課',scans:'檔案',tuition:'學費',meta:'設定'};
const BK_MODE=[
  ['add','補回缺少的資料','只加入現在沒有的文件，現有資料完全不動（最安全）。'],
  ['over','以備份為準','備份裡有的文件，用備份的內容蓋掉現有的；現有但備份沒有的會保留。'],
  ['all','完全還原成備份','備份裡有的蓋掉現有的，而且現有但備份沒有的會被刪除。']
];
let BK=null,BK_UNDO=null;
/* 去掉會污染物件原型的鍵，並限制單一文件大小 */
function bkClean(v,depth){
  if(depth>24)return null;
  if(Array.isArray(v))return v.map(x=>bkClean(x,depth+1));
  if(v&&typeof v==='object'){
    const o={};
    Object.keys(v).forEach(k=>{if(k==='__proto__'||k==='constructor'||k==='prototype')return;o[k]=bkClean(v[k],depth+1)});
    return o;
  }
  return v;
}
function bkParse(txt){
  let j;
  try{j=JSON.parse(txt)}catch(e){return {error:'這不是有效的備份檔，讀不出內容'}}
  if(!j||typeof j!=='object'||Array.isArray(j))return {error:'這不是班務通的備份檔'};
  const has=COLS.filter(c=>j[c]&&typeof j[c]==='object'&&!Array.isArray(j[c]));
  if(!has.length||(j.app&&j.app!=='班務通'))return {error:'這不是班務通的備份檔'};
  const docs={},present={};let total=0,skipped=0;
  COLS.forEach(c=>{
    docs[c]={};
    if(has.indexOf(c)<0)return;
    present[c]=true;
    Object.keys(j[c]).forEach(id=>{
      const d=j[c][id];
      if(!id||id.length>120||!d||typeof d!=='object'||Array.isArray(d)||JSON.stringify(d).length>900000){skipped++;return}
      docs[c][id]=bkClean(d,0);total++;
    });
  });
  if(!total)return {error:'備份檔裡沒有可以匯入的資料'};
  return {docs,present,total,skipped,exportedAt:typeof j.exportedAt==='string'?j.exportedAt:''};
}
/* 依模式算出會新增／覆蓋／刪除哪些文件 */
function bkPlan(mode){
  const add=[],over=[],del=[];let same=0,keep=0;
  COLS.forEach(c=>{
    Object.keys(BK.docs[c]).forEach(id=>{
      const cur=S[c][id],nw=BK.docs[c][id];
      if(!cur)add.push([c,id]);
      else if(JSON.stringify(cur)===JSON.stringify(nw))same++;
      else if(mode==='add')keep++;
      else over.push([c,id]);
    });
    if(mode==='all'&&BK.present[c])Object.keys(S[c]).forEach(id=>{if(!BK.docs[c][id])del.push([c,id])});
  });
  return {add,over,del,same,keep,n:add.length+over.length+del.length};
}
const bkCounts=m=>COLS.filter(c=>Object.keys(m[c]||{}).length).map(c=>BK_LBL[c]+' '+Object.keys(m[c]).length).join('、')||'無';
function bkSheet(re){
  if(!BK){closeSheet();return}
  const old=$('#layer .sb'),top=old?old.scrollTop:0,pl=bkPlan(BK.mode);
  let b='<div class="card pad"><p class="small"><b>'+esc(BK.name||'備份檔')+'</b></p><p class="small muted" style="margin-top:4px">'+(BK.exportedAt?'備份時間：'+esc(fmtFull(BK.exportedAt.slice(0,10)))+' '+esc(BK.exportedAt.slice(11,16))+'。':'')+'共 '+BK.total+' 份文件：'+esc(bkCounts(BK.docs))+'。</p>'+(BK.skipped?'<p class="small muted" style="margin-top:4px">另有 '+BK.skipped+' 筆格式不正確，已略過。</p>':'')+'</div>';
  b+='<div class="field" style="margin-top:12px"><span class="lab">還原方式</span><div class="seg bkmode">'+BK_MODE.map(m=>'<button type="button" class="'+(BK.mode===m[0]?'on':'')+'" data-a="bkMode" data-v="'+m[0]+'">'+m[1].replace('完全還原成備份','完全還原')+'</button>').join('')+'</div><span class="small faint">'+esc(BK_MODE.find(m=>m[0]===BK.mode)[2])+'</span></div>';
  b+='<div class="stats" style="margin-top:12px"><div class="stat"><b>'+pl.add.length+'</b><span>新增</span></div><div class="stat"><b>'+pl.over.length+'</b><span>覆蓋</span></div><div class="stat"><b'+(pl.del.length?' class="red"':'')+'>'+pl.del.length+'</b><span>刪除</span></div></div>';
  b+='<p class="tiny faint" style="margin:8px 2px 0">'+(pl.same?'有 '+pl.same+' 份文件和現有的一樣，不需要處理。':'')+(pl.keep?' 有 '+pl.keep+' 份現有文件和備份不同，這個方式會保留現有的。':'')+'</p>';
  if(BK.mode==='all'&&pl.del.length)b+='<div class="note red" style="margin-top:12px">會刪除 '+pl.del.length+' 份備份裡沒有的文件（'+esc(bkCounts(pl.del.reduce((m,x)=>{(m[x[0]]=m[x[0]]||{})[x[1]]=1;return m},{})))+'）。</div>';
  b+='<p class="tiny faint" style="margin-top:10px">備份檔不含照片本身；檔案分類只還原資料，照片仍在雲端。匯入後可在完成畫面按「復原這次匯入」。</p>';
  sheet('匯入備份',b,'<button class="btn grow" data-a="bkCancel">取消</button><button class="btn pri grow'+(BK.mode==='all'&&pl.del.length?' danger':'')+'" data-a="bkGo"'+(pl.n?'':' disabled')+'>'+(pl.n?(BK.mode==='all'&&pl.del.length?'完全還原':'匯入')+' '+pl.n+' 份':'沒有要處理的')+'</button>');
  const sc=$('#layer .scrim'),sh=$('#layer .sheet');
  if(re&&old&&sc&&sh){sc.style.animation='none';sh.style.animation='none'}
  const nb=$('#layer .sb');if(nb&&top)nb.scrollTop=top;
}
ACT.importBk=()=>{
  if(!AUTH.uid){toast('請先登入');return}
  const e=$('#bk-file');if(e)e.click();
};
IN.bkIn=async el=>{
  const f=el.files&&el.files[0];el.value='';
  if(!f)return;
  if(!AUTH.uid){toast('請先登入');return}
  if(f.size>40*1024*1024){toast('備份檔太大（超過 40 MB），無法匯入',4200);return}
  let txt='';
  try{txt=await f.text()}catch(e){toast('讀不到這個檔案，請再試一次',3600);return}
  const r=bkParse(txt);
  if(r.error){toast(r.error,4200);return}
  BK=Object.assign({name:f.name,mode:'add'},r);BK_UNDO=null;
  bkSheet();
};
ACT.bkMode=d=>{if(!BK)return;BK.mode=d.v;bkSheet(true)};
ACT.bkCancel=()=>{BK=null;closeSheet()};
ACT.bkGo=()=>{
  if(!BK)return;
  const pl=bkPlan(BK.mode);
  if(!pl.n){toast('沒有需要匯入的資料');return}
  if(BK.mode==='all'&&pl.del.length&&!BK.sure){
    sheet('確定完全還原？','<p>這會<b>刪除 '+pl.del.length+' 份</b>目前有、但備份裡沒有的文件，並用備份覆蓋 '+pl.over.length+' 份、新增 '+pl.add.length+' 份。</p><p class="small muted" style="margin-top:8px">匯入後仍可以按「復原這次匯入」還原。</p>',
      '<button class="btn grow" data-a="bkBack">返回</button><button class="btn danger grow" data-a="bkSure">完全還原</button>');
    return;
  }
  bkApply(pl);
};
ACT.bkBack=()=>bkSheet();
ACT.bkSure=()=>{if(BK)BK.sure=true;ACT.bkGo()};
function bkApply(pl){
  const undo=[];
  bulkRun(()=>{
    pl.add.concat(pl.over).forEach(x=>{undo.push({c:x[0],id:x[1],prev:S[x[0]][x[1]]?clone(S[x[0]][x[1]]):null});put(x[0],x[1],BK.docs[x[0]][x[1]])});
    pl.del.forEach(x=>{undo.push({c:x[0],id:x[1],prev:clone(S[x[0]][x[1]])});del(x[0],x[1])});
  });
  BK_UNDO=undo;
  const nm=BK.name;BK=null;
  sheet('匯入完成','<div class="stats"><div class="stat"><b>'+pl.add.length+'</b><span>新增</span></div><div class="stat"><b>'+pl.over.length+'</b><span>覆蓋</span></div><div class="stat"><b>'+pl.del.length+'</b><span>刪除</span></div></div><p class="small muted" style="margin-top:12px">已從「'+esc(nm||'備份檔')+'」匯入，資料會自動同步到雲端。如果結果不是你要的，可以馬上復原。</p>',
    '<button class="btn grow" data-a="bkUndo">復原這次匯入</button><button class="btn pri grow" data-a="closeSheet">完成</button>');
}
ACT.bkUndo=()=>{
  if(!BK_UNDO||!BK_UNDO.length){closeSheet();return}
  const u=BK_UNDO;BK_UNDO=null;
  bulkRun(()=>u.forEach(x=>{if(x.prev)put(x.c,x.id,x.prev);else del(x.c,x.id)}));
  closeSheet();toast('已復原這次匯入（'+u.length+' 份文件）',3200);
};

/* ===== 事件分派、標題列、開場動畫、啟動 ===== */
const _pillBase=pill;
pill=function(){
  _pillBase();
  const cn=$('#center-name');if(cn)cn.textContent=centerName();
};
document.addEventListener('click',e=>{
  if(e.target.hasAttribute&&e.target.hasAttribute('data-scrim')){closeSheet();return}
  const t=e.target.closest?e.target.closest('[data-a]'):null;
  if(!t||t.disabled)return;
  const f=ACT[t.dataset.a];
  if(f){if(t.tagName==='A')e.preventDefault();f(t.dataset,t,e)}
});
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset&&t.dataset.i;
  if(k&&IN[k])IN[k](t);
});
/* 搜尋學生：只篩選畫面上的列，不重畫，所以打字時輸入不會中斷 */
document.addEventListener('input',e=>{
  const t=e.target;
  if(!t.dataset||t.dataset.live!=='search')return;
  NAV.q=t.value;
  const q=t.value.trim();
  $$('#view .stu').forEach(el=>{el.hidden=!stuHit(q,el.dataset)});
});
/* 學生名冊（班級 → 學生）的搜尋：姓名、學校、電話、家長、座號、班級名稱 */
document.addEventListener('input',e=>{
  const t=e.target;
  if(!t.dataset||t.dataset.live!=='dir')return;
  NAV.dq=t.value;
  const q=t.value.trim().toLowerCase();
  let n=0;
  $$('#view [data-find]').forEach(el=>{const hit=!q||el.dataset.find.indexOf(q)>=0;el.hidden=!hit;if(hit)n++});
  const em=$('#view .dirnone');if(em)em.hidden=!(q&&!n);
});
document.addEventListener('focusout',e=>{
  if(NAV.pendR&&e.target.closest&&e.target.closest('#view,#page'))setTimeout(()=>{if(NAV.pendR)render()},60);
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape'||AUTH.state!=='in'||PV.on)return;
  if($('#layer').innerHTML)closeSheet();
  else if(NAV.stack.length)back();
});
/* 從背景回到前景時重新讀取一次，補上睡眠期間漏掉的變更；同時送出待同步的資料 */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  foreground();
});
window.addEventListener('online',()=>{if(AUTH.state==='in')foreground();else pill()});
window.addEventListener('offline',()=>pill());
/* 待同步佇列的保險機制：每 15 秒再試一次（網路斷線時會停在佇列裡） */
setInterval(()=>{if(OB.length&&AUTH.state==='in')flush()},15000);

/* 開場動畫：至少顯示 1.7 秒，等登入狀態確定後再淡出；最長 5.2 秒一定收起 */
const SP0=Date.now();let spDone=false,spMin=false;
function splashDone(){
  if(spDone)return;spDone=true;
  const s=$('#splash');if(!s)return;
  s.classList.add('out');setTimeout(()=>s.remove(),520);
}
function splashCheck(){
  if(spDone||!spMin)return;
  if(AUTH.state==='init'&&Date.now()-SP0<5000)return;
  splashDone();
}
setTimeout(()=>{spMin=true;splashCheck()},1700);
setTimeout(splashDone,5200);
const _renderSp=render;
render=function(){_renderSp();splashCheck()};

const hf=$('#hdr-files');if(hf)hf.innerHTML=ic('folder',22);
render();
initCloud();

</script>
