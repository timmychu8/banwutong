<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F14">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="班務通">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="補習班班務管理：點名、成績、班級、補課與掃描歸檔，雲端同步。">
<title>班務通</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* 深色主題：黑灰底、琥珀色主色，缺課與不及格用紅色，到課用綠色。不依賴外部字型，離線也能正常顯示。 */
:root{
  color-scheme:dark;
  --bg:#0B0F14; --grid:rgba(160,180,210,.035);
  --surface:#151C25; --surface2:#1C2531; --line:#263140; --line2:#364357;
  --ink:#EEF2F7; --ink2:#A7B2C2; --ink3:#72809A;
  --brand:#F2B25B; --brand-fg:#1A1206; --brand-soft:#3A2A12;
  --red:#FF7A6B; --red-soft:#3B1E1B;
  --green:#4ADE9A; --green-soft:#12322A;
  --amber:#F5B54A; --amber-soft:#3A2D12;
  --blue:#7AA7FF; --blue-soft:#1A2A46;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.42);
  --scrim:rgba(0,0,0,.6);
  --glass:rgba(21,28,37,.80);
  --c0:#7AA7FF; --c1:#3CC7B8; --c2:#F59E6B; --c3:#A78BFA; --c4:#F472B6; --c5:#A3D65C; --c6:#E6B95B; --c7:#94A3B8;
  --f-body:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-disp:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:16px; --r-s:12px; --tab-h:64px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background-color:var(--bg);
  background-image:radial-gradient(120% 55% at 50% -12%,rgba(242,178,91,.11),transparent 62%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:auto,22px 22px,22px 22px;background-attachment:fixed;
  color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 16px);min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--glass)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{opacity:.42;cursor:default}
h1,h2,h3,p{margin:0}
a{color:var(--brand)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .small{font-size:13px} .tiny{font-size:12px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{display:block;flex:none}

/* 頂部列（毛玻璃） */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:54px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1}
.brand b{font-weight:800;font-size:20px;letter-spacing:.02em;color:var(--brand);white-space:nowrap}
.brand span{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:15px;font-size:12px;font-weight:600;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap;transition:background-color .25s,color .25s}
.pill .ic{flex:none}
.pill.ok{color:var(--green);background:var(--green-soft);border-color:transparent}
.pill.warn{color:var(--amber);background:var(--amber-soft);border-color:transparent}
.pill.bad{color:var(--red);background:var(--red-soft);border-color:transparent}
.pill.spin .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 內容區 */
#view{padding-block:14px 8px}

/* 底部分頁（毛玻璃，四個分頁） */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--ink3);position:relative;min-width:0;text-align:center;transition:color .2s}
.tab .ic{transition:transform .25s var(--ease)}
.tab:active .ic{transform:scale(.88)}
.tab.on{color:var(--brand);font-weight:700}
.tab.on .ic{transform:translateY(-1px)}
.tab::before{content:"";position:absolute;top:0;left:50%;width:28px;height:3px;margin-left:-14px;border-radius:0 0 3px 3px;background:var(--brand);transform:scaleX(0);transition:transform .3s var(--ease)}
.tab.on::before{transform:scaleX(1)}
.tab i{position:absolute;top:6px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font:600 10px/17px var(--f-mono);text-align:center;font-style:normal;padding:0 4px}

/* 全螢幕細節頁（從右側滑入） */
.page{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background-color:var(--bg);animation:slide .26s var(--ease)}
@keyframes slide{from{transform:translateX(32px);opacity:0}to{transform:none;opacity:1}}
.ph{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);flex:none}
.ph .wrap{display:flex;align-items:center;gap:4px;min-height:54px;padding-left:max(8px,env(safe-area-inset-left,0px))}
.ph h2{flex:1;min-width:0;font:700 17px/1.3 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pb .wrap{padding-block:14px 32px}
.pf{background:var(--glass);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);flex:none}
.pf .wrap{display:flex;gap:10px;padding-block:10px}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;color:var(--ink);flex:none;transition:background-color .15s,transform .12s}
.ib:active{background:var(--surface2);transform:scale(.94)}
.ib.t{width:auto;padding:0 12px;border-radius:22px;font-weight:700;color:var(--brand);gap:6px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 卡片與清單 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card.pad{padding:14px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 8px}
.sec:first-child{margin-top:0}
.sec h3{font:700 13px/1.3 var(--f-body);letter-spacing:.08em;color:var(--ink2)}
.sec .lnk{font-size:13px;font-weight:700;color:var(--brand);padding:4px 2px}
.rows>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;min-height:56px;background:var(--surface)}
button.row:active{background:var(--surface2)}
.row .main{flex:1;min-width:0}
.row .t1{font-weight:700;line-height:1.35}
.row .t2{font-size:13px;color:var(--ink2);line-height:1.4}
.row .end{flex:none;display:flex;align-items:center;gap:8px;color:var(--ink3);font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:900 16px/1 var(--f-disp);color:#fff;background:var(--c,var(--brand))}
.av.sm{width:30px;height:30px;font-size:13px}
.av.lg{width:56px;height:56px;font-size:24px}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.badge.blue{background:var(--brand-soft);color:var(--brand)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.empty{text-align:center;padding:34px 18px;color:var(--ink2)}
.empty .ic{margin:0 auto 10px;color:var(--ink3)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.note{padding:10px 12px;border-radius:var(--r-s);background:var(--amber-soft);color:var(--amber);font-size:13px;line-height:1.5}
.note.blue{background:var(--brand-soft);color:var(--brand)}
.note.red{background:var(--red-soft);color:var(--red)}

/* 按鈕與表單 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--surface);border:1px solid var(--line2);color:var(--ink);white-space:nowrap}
.btn:active{background:var(--surface2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.btn.pri:active{filter:brightness(.92);background:var(--brand)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn.grow{flex:1}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label,.lab{font-size:13px;font-weight:700;color:var(--ink2)}
.in{width:100%;min-width:0;height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:inherit}
textarea.in{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.5}
select.in{appearance:auto}
.in::placeholder{color:var(--ink3)}
.in:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:360px){.two,.three{grid-template-columns:1fr}}
.search{position:relative}
.search .ic{position:absolute;left:12px;top:12px;color:var(--ink3);pointer-events:none}
.search .in{padding-left:38px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:17px;background:var(--surface);border:1px solid var(--line2);font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-fg);font-weight:700}
.chip b{font:600 11px var(--f-mono)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{height:34px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink2);text-align:center;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wdays button{height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-weight:700;text-align:center;color:var(--ink2)}
.wdays button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line2)}
.swatches button.on{box-shadow:0 0 0 2.5px var(--ink)}
.slot{display:grid;grid-template-columns:78px 1fr 1fr 38px;gap:8px;align-items:center;margin-bottom:8px}
.slot .in{padding:0 8px}
@media (max-width:360px){.slot{grid-template-columns:70px 1fr 1fr 36px}}

/* 底部彈出視窗 */
.scrim{position:fixed;inset:0;z-index:70;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:560px;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);animation:up .22s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:6px 8px 6px max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);flex:none}
.sheet .sh h3{flex:1;font:700 17px/1.3 var(--f-body)}
.sheet .sb{padding:16px max(18px,env(safe-area-inset-right,0px)) 8px max(18px,env(safe-area-inset-left,0px));overflow-y:auto;overscroll-behavior:contain}
.sheet .sf{display:flex;gap:10px;padding:10px max(18px,env(safe-area-inset-right,0px)) 14px max(18px,env(safe-area-inset-left,0px));flex:none;border-top:1px solid var(--line)}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:86%}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 74px);z-index:90;max-width:calc(100% - 32px);padding:11px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;box-shadow:var(--shadow);animation:fade .15s ease-out;text-align:center}
.toast .tb{margin-left:12px;font-weight:700;color:var(--brand-soft);text-decoration:underline}

/* 今日 */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.hello .d{font:900 30px/1.1 var(--f-disp);letter-spacing:.01em}
.hello .w{font-size:13px;color:var(--ink2);margin-top:4px}
.sessions{display:flex;flex-direction:column;gap:10px}
.sess{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:stretch}
.sess .tm{text-align:right;padding-top:12px;font:600 13px/1.25 var(--f-mono);color:var(--ink2)}
.sess .tm small{display:block;font-size:11px;color:var(--ink3);font-weight:500}
.sess .cd{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:9px;min-width:0}
.sess.now .cd{box-shadow:0 0 0 2px var(--brand)}
.sess .cd .h{display:flex;align-items:center;gap:10px}
.sess .cd .h b{font-size:16px}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface2)}
.bar i{display:block;height:100%}
.bar .p{background:var(--green)}.bar .l{background:var(--amber)}.bar .v{background:var(--brand)}.bar .x{background:var(--red)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.todo{display:flex;flex-direction:column;gap:8px}
.todo .row{border:1px solid var(--line);border-radius:var(--r);padding:11px 14px}
.todo .row.late{border-color:var(--red);background:var(--red-soft)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.stat b{display:block;font:900 26px/1.1 var(--f-disp);color:var(--ink)}
.stat b.red{color:var(--red)}
.stat span{display:block;font-size:12px;color:var(--ink2);margin-top:3px}

/* 點名 */
.mkrow{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);min-height:60px}
.mkrow .nm{flex:1;min-width:0}
.mkrow .nm b{display:block;font-weight:700;line-height:1.3}
.mkrow .nm small{display:block;font-size:12px;color:var(--ink3)}
.mks{display:flex;gap:6px;flex:none}
.mk{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line2);background:var(--surface);font-weight:700;font-size:14px;color:var(--ink2);text-align:center}
.mk.p.on{background:var(--green);border-color:var(--green);color:#fff}
.mk.l.on{background:var(--amber);border-color:var(--amber);color:#fff}
.mk.v.on{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.mk.x.on{background:var(--red);border-color:var(--red);color:#fff}
@media (max-width:360px){.mk{width:38px;height:40px}.mks{gap:4px}}
.sum{display:flex;gap:6px;flex-wrap:wrap}
.sum .badge{height:26px;font-size:13px}
.datebar{display:flex;align-items:center;gap:6px}
.datebar .in{width:auto;flex:1;text-align:center;font-weight:700}

/* 班級與學生 */
.hero{display:flex;gap:14px;align-items:center;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
.hero h1{font:900 22px/1.25 var(--f-disp)}
.hero .meta{font-size:13px;color:var(--ink2);margin-top:3px}
.kv{display:grid;grid-template-columns:84px 1fr;gap:8px 12px;font-size:14px;padding:14px}
.kv dt{color:var(--ink3);font-size:13px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:0 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;min-width:max-content;padding:11px 14px;font-weight:700;color:var(--ink3);border-bottom:3px solid transparent;text-align:center;white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.cc{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r);width:100%;min-height:76px}
.cc .main{flex:1;min-width:0}
.cc b{font-size:17px;display:block}
.cc .s{font-size:13px;color:var(--ink2);margin-top:2px}
.cc .n{font:900 24px/1 var(--f-disp);text-align:right}
.cc .n small{display:block;font:500 11px var(--f-body);color:var(--ink3);margin-top:2px}
.list-gap{display:flex;flex-direction:column;gap:10px}
.hist{display:flex;flex-wrap:wrap;gap:6px}
.hist span{min-width:34px;height:30px;padding:0 6px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font:600 12px var(--f-mono);background:var(--surface2);color:var(--ink2)}
.hist .p{background:var(--green-soft);color:var(--green)}
.hist .l{background:var(--amber-soft);color:var(--amber)}
.hist .v{background:var(--brand-soft);color:var(--brand)}
.hist .x{background:var(--red-soft);color:var(--red)}

/* 成績 */
.scrow{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);min-height:56px}
.scrow .nm{flex:1;min-width:0;font-weight:700}
.scrow .nm small{display:block;font-weight:400;color:var(--ink3);font-size:12px}
.sc{width:84px;height:44px;border-radius:10px;border:1.5px solid var(--line2);background:var(--surface);text-align:center;font:700 18px var(--f-mono);color:var(--ink);flex:none}
.sc:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.sc.low{color:var(--red);border-color:var(--red)}
.sc.absent{background:var(--surface2)}
.qrow{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%}
.qrow .main{flex:1;min-width:0}
.qrow .sc2{text-align:right;flex:none}
.qrow .sc2 b{font:900 22px/1 var(--f-disp)}
.qrow .sc2 small{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}

table.tb td:first-child,table.tb th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:700}
table.tb th:first-child{background:var(--surface2)}
table.tb tr:last-child td{border-bottom:0}
table.tb .low{color:var(--red);font-weight:700}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 6px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .cap{font-size:12px;color:var(--ink3);margin-top:2px;padding-bottom:6px}
.ax{stroke:var(--line);stroke-width:1}
.axt{fill:var(--ink3);font:11px var(--f-mono)}
.ln{fill:none;stroke:var(--brand);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.ln2{fill:none;stroke:var(--c2);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.pt{fill:var(--surface);stroke:var(--brand);stroke-width:2.2}
.pt2{fill:var(--surface);stroke:var(--c2);stroke-width:2.2}
.pt.last{fill:var(--brand)}
.pt2.last{fill:var(--c2)}
.area{fill:var(--brand);opacity:.1}
.pass{stroke:var(--red);stroke-width:1;stroke-dasharray:4 4;opacity:.7}
.brs{fill:var(--brand)}
.brs.lo{fill:var(--red)}

/* 補課 */
.mk-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;flex-direction:column;gap:10px}
.mk-card.late{border-color:var(--red)}
.mk-card .h{display:flex;align-items:center;gap:10px}
.mk-card .h .main{flex:1;min-width:0}
.mk-card .h b{display:block;line-height:1.3}
.mk-card .acts{display:flex;gap:8px;flex-wrap:wrap}

/* 掃描 */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.grid2{grid-template-columns:repeat(3,minmax(0,1fr))}}
.shot{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;min-width:0}
.shot .im{aspect-ratio:3/4;background:var(--surface2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--ink3);max-width:100%}
.shot .im img{width:100%;height:100%;object-fit:cover;display:block}
.shot .cp{padding:8px 10px 10px;min-width:0}
.shot .cp b{display:block;font-size:13px;line-height:1.35}
.shot .cp small{display:block;font-size:12px;color:var(--ink3)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 10px;border-radius:var(--r);border:1.5px dashed var(--line2);background:var(--surface);font-weight:700;color:var(--brand);text-align:center}

.pick.single{grid-template-columns:1fr}
.prev{background:#0a0a0a;border-radius:12px;display:flex;justify-content:center;align-items:center;overflow:hidden;max-height:46vh}
.prev img,.prev canvas{display:block;max-width:100%;max-height:46vh;object-fit:contain}
.viewer{flex:1;overflow:auto;background:#0a0a0a;display:flex;align-items:center;justify-content:center;touch-action:pan-x pan-y pinch-zoom}
.viewer img{max-width:100%;max-height:100%;display:block;object-fit:contain}
.bk{padding:0 0 4px}
.sp{height:10px}

<style>
/* 補充樣式：沿用原本的按鈕、列表與表格，再加上新版的點名首頁、速點、開場動畫 */
button.row,button.card,button.cc,button.shot{font:inherit;color:inherit;width:100%;text-align:left}
button.shot{width:auto}
.row .main>span{display:block}
.tb .sc{width:64px;height:38px;font-size:15px}
.slot .ib{width:38px;height:38px}
.pick button:disabled{opacity:.45;cursor:default}
.brand{min-width:0}
.top .brand span{display:block;min-width:0}
.mk-card .acts .btn{flex:0 0 auto}
.hero .av{flex:none}
.foot{text-align:center;margin-top:12px}
.btn{transition:transform .12s var(--ease),background-color .2s,border-color .2s}
.btn:active{transform:scale(.98)}
.card{box-shadow:0 1px 2px rgba(0,0,0,.25)}

/* 開場動畫：圖示彈出，名稱淡入，底部小進度條，完成後整體淡出 */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(90% 60% at 50% 35%,#1E2633 0%,#0B0F14 62%,#06080C 100%);transition:opacity .5s ease,transform .5s var(--ease)}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.spl-logo{width:112px;height:112px;border-radius:28px;display:flex;align-items:center;justify-content:center;animation:logoIn .8s var(--ease) both;box-shadow:0 18px 50px rgba(242,178,91,.22)}
.spl-logo svg{width:112px;height:112px;display:block}
.spl-name{font:800 30px/1 var(--f-body);color:var(--ink);letter-spacing:.06em;margin-top:8px;animation:nameIn .7s .25s var(--ease) both}
.spl-sub{font-size:13px;color:var(--ink3);animation:nameIn .7s .4s var(--ease) both}
.spl-bar{position:absolute;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:120px;height:3px;border-radius:2px;background:var(--surface2);overflow:hidden}
.spl-bar i{display:block;height:100%;width:40%;background:var(--brand);border-radius:2px;animation:load 1.4s var(--ease) infinite}
@keyframes logoIn{from{opacity:0;transform:scale(.55) rotate(-10deg)}60%{opacity:1;transform:scale(1.06) rotate(2deg)}to{opacity:1;transform:none}}
@keyframes nameIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(300%)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .34s var(--ease) both;animation-delay:min(calc(var(--i,0) * 35ms),420ms)}

/* 登入頁：沒有分頁按鈕時整條底部列一起隱藏 */
.tabbar:has(#tabbar:empty){display:none}
.login{max-width:420px;margin:28px auto 0;text-align:center}
.login-mark{width:72px;height:72px;margin:0 auto 14px;filter:drop-shadow(0 10px 24px rgba(242,178,91,.25))}
.login h2{font:800 24px/1.2 var(--f-body);margin-bottom:6px}
.login .card{text-align:left}
.note.red{background:var(--red-soft);color:var(--red)}

/* 點名首頁：日期列 */
.ahead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.ahead h1{font:800 26px/1.15 var(--f-body);letter-spacing:.01em}
.kicker{font-size:12px;color:var(--brand);font-weight:700;letter-spacing:.08em;margin-bottom:2px}
.dpick{width:auto;height:38px;font-size:13px;padding:0 10px;flex:none}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:0 0 14px}
.day{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink2);transition:transform .15s var(--ease),background-color .2s,border-color .2s;min-width:0}
.day small{font-size:11px}
.day b{font:700 16px/1.2 var(--f-body);color:var(--ink)}
.day:active{transform:scale(.93)}
.day.today:not(.on){border-color:var(--brand)}
.day.on{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.day.on b,.day.on small{color:var(--brand-fg)}
.day i{position:absolute;bottom:4px;width:4px;height:4px;border-radius:2px;background:var(--brand)}
.day.on i{background:var(--brand-fg)}

/* 點名首頁：班級摘要卡 */
.ahero{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:16px 16px 14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:4px}
.ahero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--brand))}
.ah-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ah-main{min-width:0;flex:1}
.ah-name{font:800 21px/1.25 var(--f-body);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ahero .sum{margin:0}
.bar.big{height:10px;border-radius:5px}
.ah-acts{display:flex;gap:10px}
.ah-acts .btn{height:46px;font-size:15px}

/* 小考入口 */
.qstrip{display:flex;flex-direction:column;gap:8px;margin:12px 0 4px}
.qcard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);width:100%;text-align:left;color:var(--ink)}
.qcard .ic{color:var(--brand)}
.qcard .main{flex:1;min-width:0}
.qcard b{display:block;line-height:1.3}
.qcard small{color:var(--ink2);font-size:13px}
.qadd{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:var(--r);border:1.5px dashed var(--line2);color:var(--brand);font-weight:700;width:100%}

/* 學生列（一列一位：頭像、姓名與標記、四個符號、更多） */
.stusearch{margin:14px 0 10px}
.stusearch .in{padding-left:38px;height:44px}
.stulist{display:flex;flex-direction:column;gap:8px}
.stu{display:flex;align-items:center;gap:8px;min-height:60px;padding:10px 6px 10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);transition:border-color .2s}
.stu .nm{flex:1;min-width:0}
.stu .nm b{display:block;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stu .nm small{display:block;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;min-width:0}
.ftag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--red-soft);color:var(--red);white-space:nowrap}
.fnote{font-size:11px;color:var(--ink2);background:var(--surface2);padding:1px 6px;border-radius:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stu .mks{gap:4px}
.stu .mk{width:36px;height:38px;border-radius:11px;font-size:13px;transition:background-color .18s,border-color .18s,color .18s,transform .12s var(--ease),box-shadow .18s}
.stu .mk:active{transform:scale(.9)}
.stu .mk.on{box-shadow:0 0 0 3px rgba(242,178,91,.18)}
.stu .mk.p.on{box-shadow:0 0 0 3px rgba(74,222,154,.18)}
.stu .mk.x.on{box-shadow:0 0 0 3px rgba(255,122,107,.2)}
.more{display:inline-flex;align-items:center;justify-content:center;width:28px;height:40px;border-radius:10px;color:var(--ink3);flex:none}
.more:active{background:var(--surface2)}
@media (max-width:360px){.stu .mk{width:32px;height:36px;font-size:12px}.stu .mks{gap:3px}}

/* 速點 */
.speed{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:6px}
.spp{display:flex;gap:10px;align-items:center}
.spname{font:800 46px/1.15 var(--f-body);letter-spacing:.02em;color:var(--ink);margin-top:14px;padding:0 6px;animation:rise .32s var(--ease) both;word-break:break-all}
.spsub{min-height:1.4em}
.spmks{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin:16px 0 8px}
.spk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:100px;border-radius:24px;border:1.5px solid var(--line2);background:var(--surface);transition:transform .12s var(--ease),background-color .2s,border-color .2s}
.spk:active{transform:scale(.95)}
.spk b{font:800 32px/1 var(--f-body)}
.spk small{font-size:12px;opacity:.85}
.spk.p{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.spk.l{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.spk.v{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.spk.x{background:var(--red-soft);border-color:var(--red);color:var(--red)}

/* 違規與備註頁 */
.fhead{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.fname{font-size:20px;display:block;line-height:1.3}
.flagrow{width:100%;display:flex;align-items:center;gap:12px;min-height:54px;padding:12px 14px;text-align:left}
.flagrow .main{flex:1;min-width:0}
.flagrow .sw{width:44px;height:26px;border-radius:13px;background:var(--surface2);border:1px solid var(--line2);position:relative;flex:none;transition:background-color .2s,border-color .2s}
.flagrow .sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--ink3);transition:transform .25s var(--ease),background-color .2s}
.flagrow.on{color:var(--red)}
.flagrow.on .sw{background:var(--red-soft);border-color:var(--red)}
.flagrow.on .sw::after{transform:translateX(18px);background:var(--red)}

/* 應用程式外框（修正 iPhone 主畫面模式下整頁上移、日期被頂部列蓋住的問題）：
   頂部列、中間內容、底部分頁依序固定排列，只有中間內容捲動，頁面本身不再捲動 */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background-attachment:scroll;padding-bottom:0}
body::before{display:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.top{position:relative;flex:none;padding-top:env(safe-area-inset-top,0px)}
#view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-block:14px 24px}
.tabbar{position:relative;flex:none;left:auto;right:auto;bottom:auto}

<style>
/* ===== 視覺層：iOS Liquid Glass 風格 =====
   參考 Google AI Studio 版的版型（深色底、琥珀主色、到/遲/假/缺四色），
   用半透明玻璃、折射高光、彈性動效取代原本的平面卡片。
   放在 p02b 之後，同樣的選擇器會以這裡為準。 */

:root{
  color-scheme:dark;
  --bg:#06080C;
  --ink:#F5F7FB; --ink2:#B7C0CF; --ink3:#7F8AA0;
  --glass-fill:rgba(255,255,255,.07);
  --glass-fill2:rgba(255,255,255,.12);
  --glass-edge:rgba(255,255,255,.15);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.2);
  --glass-shadow:0 12px 32px rgba(0,0,0,.34);
  --blur:blur(28px) saturate(170%);
  --surface:rgba(255,255,255,.06); --surface2:rgba(255,255,255,.1);
  --line:rgba(255,255,255,.085); --line2:rgba(255,255,255,.15);
  --brand:#F6B45E; --brand-2:#FFD28F; --brand-fg:#1C1307;
  --brand-soft:rgba(246,180,94,.17);
  --red:#FF7F70; --red-soft:rgba(255,127,112,.17);
  --green:#52E0A3; --green-soft:rgba(82,224,163,.17);
  --amber:#F7C04E; --amber-soft:rgba(247,192,78,.17);
  --blue:#82AEFF; --blue-soft:rgba(130,174,255,.17);
  --r:24px; --r-s:16px; --tab-h:62px;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --gold:linear-gradient(180deg,#FFD79A 0%,#F4A444 100%);
}

/* 背景：深色底加上三團柔和色光，玻璃才有東西可以折射 */
html{background:var(--bg)}
body{background:none;background-image:none;background-attachment:scroll}
body::before{display:block;content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60% 38% at 6% 0%,rgba(246,180,94,.30),transparent 72%),
    radial-gradient(52% 36% at 100% 28%,rgba(104,140,255,.22),transparent 72%),
    radial-gradient(60% 40% at 0% 100%,rgba(82,224,163,.14),transparent 72%),
    var(--bg)}

/* 主畫面模式：iPhone 只把網頁畫到約 894pt（螢幕 956pt），底下 62pt 是系統區域，網頁畫不到。
   它的顏色取自頁面背景 #06080C，所以網頁底部要用同一個顏色收尾，才看不出邊界。 */

/* 修正：內容區被置中時會縮成內容寬度，這裡改成撐滿整個螢幕寬 */
#app{align-items:stretch}
#view{width:100%;max-width:none;margin:0;padding-block:12px 28px}
#view>.wrap,#view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 頂部列 */
.top{position:relative;top:auto;flex:none;padding-top:env(safe-area-inset-top,0px);background:rgba(10,13,19,.5);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--line)}
.top .wrap{min-height:58px;padding-top:4px;padding-bottom:4px}
.brand{align-items:center;gap:10px}
.brand-mark{width:28px;height:28px;flex:none;border-radius:8px;filter:drop-shadow(0 4px 10px rgba(246,180,94,.35))}
.brand b{font:800 19px/1 var(--f-body);letter-spacing:.02em;color:var(--ink)}
.brand span{color:var(--ink3)}
.pill{height:30px;border-radius:15px;background:var(--glass-fill);border:1px solid var(--line2);box-shadow:var(--glass-hi);color:var(--ink2)}
.pill.ok{background:var(--green-soft);border-color:rgba(82,224,163,.28);color:var(--green)}
.pill.warn{background:var(--amber-soft);border-color:rgba(247,192,78,.3);color:var(--amber)}
.pill.bad{background:var(--red-soft);border-color:rgba(255,127,112,.3);color:var(--red)}
.top .ib{width:40px;height:40px;border-radius:20px;background:var(--glass-fill);border:1px solid var(--line2);box-shadow:var(--glass-hi)}

/* 底部分頁：浮在內容上方的玻璃膠囊 */
.tabbar{background:linear-gradient(to bottom,rgba(6,8,12,0),var(--bg) 46%);border:0;padding:4px 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
.tabbar .wrap{max-width:560px;height:var(--tab-h);margin:0 auto;padding-inline:6px;border-radius:32px;
  background:rgba(20,25,34,.52);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--glass-edge);box-shadow:var(--glass-hi),0 16px 40px rgba(0,0,0,.42)}
.tab{height:50px;margin:6px 0;border-radius:24px;gap:3px;font-size:11px;font-weight:600;color:var(--ink3);isolation:isolate}
.tab::before{content:"";position:absolute;inset:0;top:0;left:0;width:auto;height:auto;margin:0;z-index:-1;
  border-radius:24px;background:linear-gradient(180deg,rgba(246,180,94,.26),rgba(246,180,94,.12));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22);transform:scale(.6);opacity:0;transition:transform .5s var(--spring),opacity .25s}
.tab.on::before{transform:none;opacity:1}
.tab.on{color:var(--brand-2);font-weight:700}
.tab.on .ic{filter:drop-shadow(0 0 6px rgba(246,180,94,.55))}
.tab i{top:4px;left:calc(50% + 8px);min-width:18px;height:18px;line-height:18px;border-radius:9px;box-shadow:0 2px 6px rgba(255,80,70,.4)}

/* 細節頁：整頁深色底＋色光，頂部玻璃列 */
.page{background:var(--bg)}
.page::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:

function merge(a,b){
  const o=Object.assign({},a);
  for(const k in b){const v=b[k];
    o[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))?merge(o[k],v):v}
  return o;
}

/* 待同步佇列：每筆是「整份文件」的最新狀態，同一份文件只保留最後一筆；存在 localStorage，重新開啟也不會遺失 */
const OBK='banwutong-outbox-v1';
function obRead(){try{const a=JSON.parse(localStorage.getItem(OBK)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function obSave(){try{if(OB.length)localStorage.setItem(OBK,JSON.stringify(OB));else localStorage.removeItem(OBK)}catch(e){}}
let OB=obRead();
const obHas=(col,id)=>OB.some(o=>o.col===col&&o.id===id);
function obQueue(col,id,data){
  const op={col,id,owner:AUTH.uid,data};
  const i=OB.findIndex(o=>o.col===col&&o.id===id);
  if(i>=0)OB[i]=op;else OB.push(op);
  obSave();
}
function overlayOB(){
  OB.forEach(o=>{if(o.owner!==AUTH.uid||!S[o.col])return;if(o.data===null)delete S[o.col][o.id];else S[o.col][o.id]=o.data});
}

const isNet=e=>!!e&&(e instanceof TypeError||/Failed to fetch|NetworkError|Load failed|network/i.test(String(e.message||'')));
function fail(e){
  const m=String((e&&e.message)||'');
  let t='儲存失敗，請稍後再試';
  if((e&&e.code==='42501')||/row-level|permission denied/i.test(m))t='沒有權限，請重新登入後再試';
  else if(/JWT|expired/i.test(m))t='登入已過期，請重新登入';
  sync.err=t;toast(t,3200);
}
function guard(){if(!AUTH.uid){toast('請先登入');return true}return false}

/* 寫入：先改本機畫面、再放進佇列，連線後自動送出 */
function write(col,id,data){
  const wasEmpty=!OB.length;
  obQueue(col,id,data);
  if(data===null)delete S[col][id];else S[col][id]=data;
  mirror();render();
  if(wasEmpty&&!navigator.onLine)toast('網路未連線，變更已存在手機，連線後會自動同步',3200);
  flushSoon();
}
function put(col,id,data){if(guard())return Promise.resolve(false);write(col,id,clone(data));return Promise.resolve(true)}
function patch(col,id,part){if(guard())return Promise.resolve(false);write(col,id,merge(S[col][id]||{},clone(part)));return Promise.resolve(true)}
function del(col,id){if(guard())return Promise.resolve(false);write(col,id,null);return Promise.resolve(true)}

/* 送出佇列：一次一筆、依序；網路斷線就停下來，等下次觸發再試 */
const upsertRow=(col,id,data)=>sync.client.from(TABLE).upsert(
  {owner:AUTH.uid,col,id,data,updated_at:new Date().toISOString()},
  {onConflict:'owner,col,id'}
);
let flT=0,flying=false;
function flushSoon(){clearTimeout(flT);flT=setTimeout(flush,0);pill()}
async function flush(){
  if(flying||!sync.client||!AUTH.uid||!OB.length||!navigator.onLine)return pill();
  flying=true;
  const uid0=AUTH.uid;
  try{
    while(OB.length&&AUTH.uid===uid0){
      const op=OB[0];
      const q=op.data===null
        ?sync.client.from(TABLE).delete().eq('owner',uid0).eq('col',op.col).eq('id',op.id)
        :upsertRow(op.col,op.id,op.data);
      let error=null;
      try{({error}=await q)}catch(e){error=e}
      if(AUTH.uid!==uid0)break;
      if(error&&isNet(error))break;
      OB.shift();obSave();
      if(error){fail(error);await pullNow();continue}
      sync.dead=false;sync.last=Date.now();
    }
  }finally{flying=false;pill()}
}
async function pullNow(){if(await pull()){pill();render()}}

/* 讀取與即時同步 */
async function fetchAll(){
  const rows=[];
  for(let from=0;;from+=1000){
    const {data,error}=await sync.client.from(TABLE).select('col,id,data').eq('owner',AUTH.uid)
      .order('col').order('id').range(from,from+999);
    if(error)throw error;
    rows.push(...(data||[]));
    if(!data||data.length<1000)break;
  }
  return rows;
}
function applyRows(rows){
  COLS.forEach(c=>{S[c]={};sync.loaded[c]=true});
  rows.forEach(r=>{if(S[r.col])S[r.col][r.id]=r.data||{}});
  overlayOB();
  mirror();
}
async function pull(){
  const uid0=AUTH.uid;
  try{
    const rows=await fetchAll();
    if(AUTH.uid!==uid0)return false;
    applyRows(rows);sync.dead=false;sync.last=Date.now();return true;
  }catch(e){
    if(AUTH.uid===uid0)sync.dead=true;
    return false;
  }
}
function applyRT(p){
  const o=p.eventType==='DELETE'?p.old:p.new;
  if(!o||!S[o.col]||obHas(o.col,o.id))return;
  if(p.eventType==='DELETE')delete S[o.col][o.id];
  else S[o.col][o.id]=o.data||{};
  mirror();render();
}
function subscribeRT(){
  if(sync.rt){try{sync.client.removeChannel(sync.rt)}catch(e){}sync.rt=null}
  const uid0=AUTH.uid;
  sync.rt=sync.client.channel('app-docs-'+uid0)
    .on('postgres_changes',{event:'*',schema:'public',table:TABLE,filter:'owner=eq.'+uid0},applyRT)
    .subscribe(st=>{
      if(AUTH.uid!==uid0)return;
      if(st==='SUBSCRIBED'){if(sync.dead)pullNow();else pill()}
      else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){sync.dead=true;pill()}
    });
}

function blurAll(){const a=document.activeElement;if(a&&a.blur&&a!==document.body)a.blur()}
function resetLocal(){
  COLS.forEach(c=>{S[c]={};sync.loaded[c]=false});
  OB=[];obSave();clearTimeout(flT);
  Object.keys(IMG).forEach(k=>delete IMG[k]);
  Object.keys(IMG_TRY).forEach(k=>delete IMG_TRY[k]);
  IMG_T=0;
  SCANQ.splice(0).forEach(q=>URL.revokeObjectURL(q.url));
  if(sync.rt&&sync.client){try{sync.client.removeChannel(sync.rt)}catch(e){}}
  sync.rt=null;sync.db=null;sync.cached=false;sync.dead=false;sync.ready=false;sync.last=0;
  clearMirror();
  AUTH.uid='';AUTH.email='';
  NAV.stack=[];NAV.tab='att';NAV.pk='';
}
async function onSession(session){
  const user=session&&session.user;
  if(!user){
    const was=AUTH.state==='in';
    AUTH.state='out';
    if(was)resetLocal();
    blurAll();render();
    return;
  }
  if(AUTH.state==='in'&&AUTH.uid===user.id)return;
  /* 只保留這個帳號的待同步資料；其他帳號遺留的佇列丟棄 */
  const mine=OB.filter(o=>o.owner===user.id);
  if(mine.length!==OB.length){OB=mine;obSave();toast('已捨棄其他帳號未同步的變更',3200)}
  AUTH.uid=user.id;AUTH.email=user.email||'';AUTH.lastEmail=AUTH.email;
  AUTH.state='in';AUTH.err='';
  sync.db=sync.client;
  sync.cached=loadMirror(user.id);
  overlayOB();
  sync.ready=sync.cached;
  blurAll();render();
  const ok=await pull();
  if(AUTH.uid!==user.id)return;
  if(!ok)toast(sync.cached?'無法連上雲端，目前顯示的是手機上的資料':'無法連上雲端，請檢查網路後重新開啟',3600);
  sync.ready=true;
  subscribeRT();
  pill();render();
  flushSoon();
}
async function initCloud(){
  if(!window.supabase||!window.supabase.createClient){
    AUTH.state='out';AUTH.err='無法載入雲端元件，請檢查網路後重新整理頁面';render();return;
  }
  sync.client=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  sync.client.auth.onAuthStateChange((event,session)=>{onSession(session)});
  try{
    const r=await sync.client.auth.getSession();
    await onSession(r.data?r.data.session:null);
  }catch(e){AUTH.state='out';AUTH.err='無法連接雲端，請檢查網路後重新整理';render()}
}

/* 照片：私人儲存空間，以 24 小時有效的簽名網址顯示 */
const IMG={},IMG_TRY={};let IMG_T=0;
const allPhotoPaths=()=>{const out=[];list('scans').forEach(x=>(x.pages||[]).forEach(p=>out.push(p)));return out};
async function warmImgs(paths){
  if(!AUTH.uid||!sync.client)return;
  const uid0=AUTH.uid;
  if(IMG_T&&Date.now()-IMG_T>20*3600e3){
    Object.keys(IMG).forEach(k=>delete IMG[k]);Object.keys(IMG_TRY).forEach(k=>delete IMG_TRY[k]);IMG_T=0;
  }
  const need=[...new Set(paths)].filter(p=>p&&!IMG[p]&&!IMG_TRY[p]);
  if(!need.length)return;
  need.forEach(p=>{IMG_TRY[p]=1});
  let got=0;
  for(let i=0;i<need.length;i+=100){
    const part=need.slice(i,i+100);
    try{
      const {data,error}=await sync.client.storage.from(BUCKET).createSignedUrls(part,86400);
      if(error||!data){part.forEach(p=>{delete IMG_TRY[p]});continue}
      data.forEach(r=>{if(r.signedUrl){IMG[r.path]=r.signedUrl;got++}});
    }catch(e){part.forEach(p=>{delete IMG_TRY[p]})}
  }
  if(AUTH.uid!==uid0)return;
  if(got){if(!IMG_T)IMG_T=Date.now();render()}
}

function slotText(c){
  const sl=c.slots||[];
  if(!sl.length)return '尚未設定上課時間';
  const g={};
  sl.forEach(s=>{const k=s.s+'–'+s.e;(g[k]=g[k]||[]).push(s.d)});
  return Object.keys(g).map(k=>g[k].slice().sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b)).map(d=>'週'+WD[d]).join('、')+' '+k).join('；');
}
function sessionsOn(date){
  const wd=wdOf(date),out=[];
  activeClasses().forEach(c=>(c.slots||[]).forEach(s=>{if(s.d===wd&&date>=(c.start||'0000-00-00'))out.push({c:c,s:s})}));
  return out.sort((a,b)=>toMin(a.s.s)-toMin(b.s.s));
}
function attCount(doc,roster){
  const r={p:0,l:0,v:0,x:0,none:0},m=(doc&&doc.marks)||{};
  roster.forEach(s=>{const k=m[s.id];if(k&&r[k]!=null)r[k]++;else r.none++});
  return r;
}
const hasMarks=doc=>!!(doc&&doc.marks&&Object.keys(doc.marks).some(k=>doc.marks[k]));
function studentAtt(sid,cid){
  const r={p:0,l:0,v:0,x:0};
  list('att').forEach(a=>{if(cid&&a.cid!==cid)return;const k=a.marks&&a.marks[sid];if(k&&r[k]!=null)r[k]++});
  r.t=r.p+r.l+r.v+r.x;r.rate=r.t?(r.p+r.l)/r.t:null;
  return r;
}
function classRate(cid,days){
  const from=addDays(todayS(),-days);let p=0,t=0;
  list('att').forEach(a=>{
    if(a.cid!==cid||a.date<from)return;
    Object.keys(a.marks||{}).forEach(s=>{const k=a.marks[s];if(k){t++;if(k==='p'||k==='l')p++}});
  });
  return t?p/t:null;
}
function missedSessions(days){
  const out=[],t=todayS(),nm=nowMin();
  for(let i=0;i<=days;i++){
    const d=addDays(t,-i);
    sessionsOn(d).forEach(x=>{
      if(i===0&&toMin(x.s.e)>nm)return;
      if(hasMarks(attDoc(x.c.id,d)))return;
      if(!rosterOf(x.c.id).length)return;

ACT.saveClass=d=>{
  const name=val('f-name').trim();
  if(!name){toast('請輸入班級名稱');return}
  const slots=[];let bad=false;
  $$('#page [data-slot]').forEach(r=>{
    const dd=+r.querySelector('select').value,ins=r.querySelectorAll('input'),s=ins[0].value,e=ins[1].value;
    if(!s||!e||toMin(e)<=toMin(s))bad=true;else slots.push({d:dd,s,e});
  });
  if(bad){toast('上課時間請填完整，且結束要晚於開始');return}
  const data={name,subject:val('f-subject'),color:(+val('f-color'))||0,start:val('f-start')||todayS(),slots,note:val('f-note').trim()};
  let id=d.id;
  if(id)patch('classes',id,data);
  else{id=uid('c');put('classes',id,Object.assign(data,{archived:false}))}

  if(!d.id)NAV.stack.push({name:'classP',p:{id}});

function lineChart(pts,o){
  o=o||{};
  const W=320,H=170,L=34,R=12,T=12,B=26,n=pts.length;
  const x=i=>n<=1?(L+(W-L-R)/2):L+i*(W-L-R)/(n-1);
  const y=v=>T+(1-Math.max(0,Math.min(100,v))/100)*(H-T-B);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="成績趨勢圖">';
  [0,50,100].forEach(g=>{s+='<line class="ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(g)+'" y2="'+y(g)+'"/><text class="axt" x="'+(L-6)+'" y="'+(y(g)+4)+'" text-anchor="end">'+g+'</text>'});
  if(o.pass!=null)s+='<line class="pass" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(o.pass)+'" y2="'+y(o.pass)+'"/>';
  if(n>1)s+='<polyline class="ln" points="'+pts.map((p,i)=>x(i).toFixed(1)+','+y(p.y).toFixed(1)).join(' ')+'"/>';
  pts.forEach((p,i)=>{s+='<circle class="pt'+(i===n-1?' last':'')+'" cx="'+x(i).toFixed(1)+'" cy="'+y(p.y).toFixed(1)+'" r="4"/>'});
  const step=Math.max(1,Math.ceil(n/5));
  pts.forEach((p,i)=>{if(i%step===0||i===n-1)s+='<text class="axt" x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(p.x)+'</text>'});
  return s+'</svg>';
}

/* ===== 拍照掃描與歸類（照片存於雲端私人空間） ===== */
const SCANQ=[];
function refreshPage(){NAV.pk='';render()}
async function shrink(f){
  try{
    if(!window.createImageBitmap)return f;
    const bm=await createImageBitmap(f);
    const k=Math.min(1,1800/Math.max(bm.width,bm.height));
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(bm.width*k));c.height=Math.max(1,Math.round(bm.height*k));
    c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.84));
    return b||f;
  }catch(e){return f}
}
const imgOrPh=(u,alt)=>u?'<img src="'+esc(u)+'" alt="'+esc(alt||'')+'" loading="lazy">':ic('image',28);
const safeName=s=>String(s||'檔案').replace(/[\\/:*?"<>|]/g,'_').slice(0,60);
function storageMsg(e){
  const m=String((e&&e.message)||'');
  if(/row-level|policy|permission|not allowed|unauthorized|403/i.test(m))return '沒有上傳權限，請重新登入後再試';
  if(/too large|exceed|payload|413/i.test(m)||String((e&&e.statusCode)||'')==='413')return '圖片太大，請改用較小的照片';
  if(/quota|storage limit|full/i.test(m))return '雲端空間已滿，請刪除不需要的檔案';
  if(isNet(e))return '網路連線失敗，圖片未上傳';
  return '上傳失敗，請再試一次';
}
/* 逐張上傳到 scans/<使用者 id>/ 底下，回傳成功的路徑 */
async function uploadArr(items){
  const paths=[];let failed=0,msg='';
  for(const x of items){
    const path=AUTH.uid+'/'+uid('p')+'.jpg';
    try{
      const {error}=await sync.client.storage.from(BUCKET).upload(path,x.blob,{contentType:'image/jpeg',cacheControl:'3600',upsert:false});
      if(error)throw error;
      paths.push(path);
    }catch(e){failed++;msg=msg||storageMsg(e)}
  }
  if(failed)toast(msg+(failed>1?'（另有 '+(failed-1)+' 張未上傳）':''),3200);
  return paths;
}
async function uploadInto(id,items){
  const paths=await uploadArr(items);
  if(!paths.length)return;
  const x=getD('scans',id);
  patch('scans',id,{pages:((x&&x.pages)||[]).concat(paths)});
  items.forEach(q=>URL.revokeObjectURL(q.url));
  refreshPage();toast('已新增 '+paths.length+' 頁');
}
async function pickedFiles(el){
  const files=Array.from(el.files||[]);el.value='';
  if(!files.length)return [];
  const out=[];
  for(const f of files){const b=await shrink(f);out.push({blob:b,url:URL.createObjectURL(b)})}
  return out;
}
function removePhotos(paths){
  if(!sync.client||!paths||!paths.length)return;
  try{sync.client.storage.from(BUCKET).remove(paths).catch(()=>{})}catch(e){}
}

function cloudInfo(){
  const last=sync.last?new Date(sync.last):null;
  const st=sync.dead?'雲端連線中斷，恢復後會自動同步。':'已連上雲端，變更會自動同步到其他裝置。';
  return st+(last?' 上次同步：'+fmtMD(ymd(last))+' '+pad(last.getHours())+':'+pad(last.getMinutes())+'。':'');
}
/* 儲存檔案：iPhone 優先開啟分享面板（可存到相簿或檔案），否則直接下載 */
async function saveFiles(files){
  try{
    if(navigator.share&&navigator.canShare&&files.every(f=>navigator.canShare({files:[f]}))){
      await navigator.share({files,title:files.length===1?files[0].name:'班務通'});
      return 'shared';
    }
  }catch(e){if(e&&e.name==='AbortError')return 'cancel'}
  files.forEach(f=>{
    const u=URL.createObjectURL(f),a=document.createElement('a');
    a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),6000);
  });
  return 'downloaded';
}

document.addEventListener('input',e=>{
  const t=e.target;
  if(!t.dataset||t.dataset.live!=='search')return;
  NAV.q=t.value;
  const q=t.value.trim();
  $$('#view .stu').forEach(el=>{el.hidden=!!q&&el.dataset.name.indexOf(q)<0});
});
document.addEventListener('focusout',e=>{
  if(NAV.pendR&&e.target.closest&&e.target.closest('#view,#page'))setTimeout(()=>{if(NAV.pendR)render()},60);
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape'||AUTH.state!=='in')return;
  if($('#layer').innerHTML)closeSheet();
  else if(NAV.stack.length)back();
});
/* 從背景回到前景時重新讀取一次，補上睡眠期間漏掉的變更；同時送出待同步的資料 */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'||AUTH.state!=='in'||!sync.client)return;
  flush();pullNow();
});
window.addEventListener('online',()=>{if(AUTH.state==='in'){flush();pullNow()}else pill()});
window.addEventListener('offline',()=>pill());
/* 待同步佇列的保險機制：每 15 秒再試一次（網路斷線時會停在佇列裡） */
setInterval(()=>{if(OB.length&&AUTH.state==='in')flush()},15000);

/* 開場動畫：至少顯示 1.7 秒，等登入狀態確定後再淡出；最長 5.2 秒一定收起 */
const SP0=Date.now();let spDone=false,spMin=false;
function splashDone(){
  if(spDone)return;spDone=true;
  const s=$('#splash');if(!s)return;
  s.classList.add('out');setTimeout(()=>s.remove(),520);
}
function splashCheck(){
  if(spDone||!spMin)return;
  if(AUTH.state==='init'&&Date.now()-SP0<5000)return;
  splashDone();
}
setTimeout(()=>{spMin=true;splashCheck()},1700);
setTimeout(splashDone,5200);
const _renderSp=render;
render=function(){_renderSp();splashCheck()};

const hf=$('#hdr-files');if(hf)hf.innerHTML=ic('folder',22);
render();
initCloud();

</script>
</body>
</html>
