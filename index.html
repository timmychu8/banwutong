      '<div class="stat"><b'+(cn.miss?' class="red"':'')+'>'+cn.miss+'</b><span>未繳</span></div>'+
      '<div class="stat"><b>'+cn.none+'</b><span>未檢查</span></div></div>';
    h+='<div class="stulist" style="margin-top:12px">'+ro.map((s,i)=>hwRow(s,c,cid,d,hwOf(doc,s.id),i,an)).join('')+'</div>';
    h+='<p class="tiny faint foot">點一下記錄，再點同一個可取消。</p>';
  }

  /* 家長通知 */
  const mode=NAV.hwMode==='one'?'one':'all',tone=NAV.tone==='formal'?'formal':'warm';
  h+=sec('家長通知');
  h+='<div class="seg" style="margin-bottom:10px">'+[['all','全班公告'],['one','個別學生']].map(t=>'<button class="'+(mode===t[0]?'on':'')+'" data-a="hwMode" data-v="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
  h+='<div class="chips" style="margin-bottom:10px">'+[['warm','溫暖語氣'],['formal','正式語氣']].map(t=>'<button class="chip'+(tone===t[0]?' on':'')+'" data-a="hwTone" data-v="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
  let txt='';
  if(mode==='one'){
    if(!ro.length)h+='<div class="note">這個班還沒有學生。</div>';
    else{
      let sid=NAV.hwStu;if(!ro.some(s=>s.id===sid))sid=ro[0].id;NAV.hwStu=sid;
      h+='<div class="field"><label class="lab" for="hw-stu">選擇學生</label><select id="hw-stu" class="in" data-i="hwStu">'+ro.map(s=>'<option value="'+s.id+'"'+(s.id===sid?' selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></div>';
      txt=studentMsg(cid,d,sid,tone);
    }
  }else txt=classNotice(cid,d,tone);
  if(txt){
    if(mode==='all'&&!ls.progress&&!ls.homework)h+='<div class="note" style="margin-bottom:10px">還沒有填教學進度和指定作業，通知內容會比較精簡。</div>';
    const rows=Math.max(7,Math.min(24,txt.split('\n').length+1));
    h+='<textarea id="hw-msg" class="in msgta" rows="'+rows+'" aria-label="通知內容，可直接修改">'+esc(txt)+'</textarea>';
    h+=aiBtns('hw-msg','hw');
    h+='<div class="two" style="margin-top:10px"><button class="btn pri" data-a="msgCopy">'+ic('copy',18)+'複製</button><button class="btn" data-a="msgShare">'+ic('ul',18)+'分享到 LINE</button></div>';
    h+='<p class="tiny faint foot">內容可以直接修改再複製。「AI 潤飾」會把訊息交給 Google 的 Gemini 改寫得更通順（不滿意可以「復原原文」）。「分享」會開啟 iPhone 的分享選單，選 LINE 就能貼到聊天室。</p>';
  }
  return h;
};

/* ===== 上課日曆：每個班各自的上課日 =====
   平常照「每週固定時段」；臨時變動直接在月曆上點那一天：
   上課 → 點一下變「停課」，不上課 → 點一下變「加課」，再點一次就恢復原狀。
   只存「和每週固定不一樣的日子」：c.ov = { 'YYYY-MM-DD': 1（加課）或 0（停課）}，null 代表已恢復。 */
const CAL={cid:'',ym:'',sync:false};
const calYm=s=>String(s).slice(0,7);
function calShift(ym,n){
  const y=+ym.slice(0,4),m=+ym.slice(5,7)-1+n;
  return ymd(new Date(y+Math.floor(m/12),((m%12)+12)%12,1,12)).slice(0,7);
}
function calBody(){
  const c=classOf(CAL.cid);
  if(!c)return empty('classes','找不到這個班級','可能已被刪除。','');
  const A=activeClasses(),ym=CAL.ym,y=+ym.slice(0,4),m=+ym.slice(5,7),n=new Date(y,m,0).getDate(),t=todayS();
  const lead=(wdOf(ym+'-01')+6)%7;   // 週一排第一欄
  let cnt=0,add=0,off=0,cells='';
  for(let i=0;i<lead;i++)cells+='<span class="cald e" aria-hidden="true"></span>';
  for(let d=1;d<=n;d++){
    const x=ym+'-'+pad(d),reg=regSlots(c,x).length>0,on=isClassDay(c,x),rec=hasRecord(c.id,x);
    const st=on?(reg?'reg':'add'):(reg?'off':'');
    if(on)cnt++;if(st==='add')add++;if(st==='off')off++;
    const others=A.filter(z=>z.id!==c.id&&isClassDay(z,x)).slice(0,3);
    cells+='<button type="button" class="cald'+(st?' '+st:'')+(x===t?' today':'')+'" data-a="calDay" data-date="'+x+'" aria-pressed="'+on+'" aria-label="'+esc(fmtMDW(x)+'，'+(on?'上課':'不上課')+(st==='add'?'（加課）':st==='off'?'（停課）':'')+(rec?'，已有紀錄':''))+'">'+
      '<b>'+d+'</b>'+(st==='add'?'<em>加</em>':st==='off'?'<em>停</em>':'')+
      '<span class="od">'+others.map(z=>'<i style="--c:'+ccolor(z)+'"></i>').join('')+(rec?'<u></u>':'')+'</span></button>';
  }
  let h='<div class="calcls" role="group" aria-label="選擇班級">'+A.map(x=>'<button type="button" class="chip'+(x.id===c.id?' on':'')+'" data-a="calCls" data-cid="'+x.id+'">'+dotHtml(x)+esc(x.name)+'</button>').join('')+'</div>';
  h+='<div class="calnav"><button type="button" class="ib" data-a="calMonth" data-n="-1" aria-label="上個月">'+ic('back',20)+'</button>'+
    '<b>'+y+' 年 '+m+' 月</b>'+
    '<button type="button" class="ib" data-a="calMonth" data-n="1" aria-label="下個月">'+ic('chev',20)+'</button></div>';
  h+='<div class="calwd" aria-hidden="true">'+ORDER.map(d=>'<span>'+WD[d]+'</span>').join('')+'</div>';
  h+='<div class="calg" style="--c:'+ccolor(c)+'" role="group" aria-label="點一下日期，切換上課或不上課">'+cells+'</div>';
  h+='<div class="calsum"><b>本月上課 '+cnt+' 天</b>'+(add||off?'<span class="small muted">加課 '+add+' 天、停課 '+off+' 天</span>':'<span class="small muted">全部照每週固定</span>')+
    (add||off?'<button type="button" class="lnk" data-a="calReset">這個月恢復每週固定</button>':'')+'</div>';
  h+='<div class="callg" aria-hidden="true"><span><i class="reg" style="--c:'+ccolor(c)+'"></i>上課</span><span><i class="add" style="--c:'+ccolor(c)+'"></i>加課</span><span><i class="off"></i>停課</span><span><u></u>已有點名或小考紀錄</span><span><i class="od" style="--c:var(--ink3)"></i>同一天別班也有課</span></div>';
  h+='<p class="tiny faint" style="margin-top:10px">平常上課：'+esc(slotText(c))+'。點一下日期可以切換「上課／不上課」，只會改那一天，不影響其他週。</p>';
  return h;
}
function calRefresh(){const b=$('#cal-body');if(b)b.innerHTML=calBody()}
function calSheet(){
  sheet('上課日曆','<div id="cal-body">'+calBody()+'</div>','<button type="button" class="btn pri grow" data-a="closeSheet">完成</button>');
}

ACT.calReset=()=>{
  const c=classOf(CAL.cid);if(!c||!c.ov)return;
  const part={};let n=0;
  Object.keys(c.ov).forEach(k=>{if(calYm(k)===CAL.ym&&(c.ov[k]===1||c.ov[k]===0)){part[k]=null;n++}});
  if(!n)return;
  patch('classes',c.id,{ov:part});
  calRefresh();toast('已恢復成每週固定');
};

/* ===== 學費：班級學費標準、每位學生每期的收款紀錄、待收統計、催繳訊息、收條 =====
   班級（classes）：room 教室、tuitionFee 學費、tuitionPeriod 'monthly'|'term'|'session'、tuPeriods:{T1:{label}}（按期才用）
   學生（students）：fees:{班級id:金額}  此學生在該班的固定學費（例如手足折扣）
   收款（tuition，鍵 = 班級_學生_期別）：{cid,sid,pk, due?（手動調整的應繳）, note?, pays:[{id,amt,date,method,no,note}]}
   期別 pk：按月、按堂 = 'YYYYMM'；按期 = 'T1'、'T2'…
   按堂：本期應繳 = 單堂金額 × 該月出席（到＋遲）堂數；其他：應繳 = 學費。
   不用「已繳／未繳」開關，而是記錄每一筆收款：收到多少算多少，可以分期、可以補收，每筆各有收據編號。 */
const BILL={monthly:'按月',term:'按期',session:'按堂'};
const BILL_UNIT={monthly:'月',term:'期',session:'堂'};
const BILL_HINT={monthly:'每個月收一次。學費金額＝每月學費。',term:'依「期」收費（如學期、寒暑假班）。學費金額＝每期學費，期別在學費頁新增。',session:'依出席堂數收費。學費金額＝單堂金額，每月以出席（到、遲到）堂數計算。'};
const TU_METHOD={cash:'現金',transfer:'轉帳',linepay:'LINE Pay',other:'其他'};
IC.coin='<circle cx="12" cy="12" r="8.5"/><path d="M14.6 9.4c-.4-.9-1.4-1.4-2.6-1.4-1.5 0-2.6.8-2.6 1.9 0 2.7 5.2 1.3 5.2 4 0 1.1-1.2 1.9-2.7 1.9-1.3 0-2.4-.5-2.9-1.4M12 6.3V8M12 16v1.7"/>';
NAV.tuSel={};NAV.tuYM='';NAV.tuF='all';NAV.tuTone='warm';NAV.tuMethod='cash';
let TU=null,RC=null,RM=null;   // 目前開啟的：收款明細、收條、催繳訊息

/* ----- 金額與期別 ----- */
const money=n=>'$'+Math.round(+n||0).toLocaleString('en-US');
const moneyS=n=>{n=Math.round(+n||0);return n>=100000?'$'+(Math.round(n/1000)/10)+'萬':money(n)};
function cnGroup(n){
  const D='零壹貳參肆伍陸柒捌玖',U=['','拾','佰','仟'];
  let s='',z=false;
  for(let i=3;i>=0;i--){
    const d=Math.floor(n/Math.pow(10,i))%10;
    if(d===0){if(s)z=true}
    else{if(z){s+='零';z=false}s+=D[d]+U[i]}
  }
  return s;
}
function cnMoney(n){
  n=Math.round(+n||0);
  if(n<=0)return '零元整';
  const hi=Math.floor(n/10000),lo=n%10000;
  let s='';
  if(hi)s+=cnGroup(hi)+'萬';
  if(lo){if(hi&&lo<1000)s+='零';s+=cnGroup(lo)}
  return s+'元整';
}
const tuFee=c=>Math.max(0,+(c&&c.tuitionFee)||0);
const tuBill=c=>(c&&BILL[c.tuitionPeriod])?c.tuitionPeriod:'monthly';
const tuYmNow=()=>{const t=todayS();return t.slice(0,4)+t.slice(5,7)};
const tuYmLabel=k=>k.slice(0,4)+' 年 '+(+k.slice(4,6))+' 月';
function tuYmShift(k,n){let y=+k.slice(0,4),m=+k.slice(4,6)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+pad(m+1)}
const tuTerms=c=>{
  const o=(c&&c.tuPeriods)||{};
  return Object.keys(o).filter(k=>o[k]).sort((a,b)=>(+b.slice(1))-(+a.slice(1))).map(k=>({k:k,label:o[k].label||('第 '+(+k.slice(1))+' 期')}));
};
function tuCur(c){
  const sel=NAV.tuSel[c.id];
  if(tuBill(c)==='term'){const L=tuTerms(c);return L.some(x=>x.k===sel)?sel:(L[0]?L[0].k:'')}
  return /^\d{6}$/.test(sel||'')?sel:tuYmNow();
}
const tuLabel=(c,pk)=>tuBill(c)==='term'?((tuTerms(c).find(x=>x.k===pk)||{}).label||'—'):tuYmLabel(pk);
const tuUnit=c=>tuBill(c)==='session'?'堂':tuBill(c)==='term'?'期':'月';

/* ----- 計算 ----- */
const tuId=(cid,sid,pk)=>cid+'_'+sid+'_'+pk;
const tuRec=(cid,sid,pk)=>S.tuition[tuId(cid,sid,pk)]||null;
function tuSess(cid,sid,ym){
  let n=0;
  list('att').forEach(a=>{
    if(a.cid!==cid||!a.date||a.date.slice(0,4)+a.date.slice(5,7)!==ym)return;
    const k=a.marks&&a.marks[sid];if(k==='p'||k==='l')n++;
  });
  return n;
}
function tuCalc(c,s,pk){
  const rec=tuRec(c.id,s.id,pk),bill=tuBill(c),fx=(s.fees&&s.fees[c.id]!=null)?+s.fees[c.id]:null;
  const unit=fx!=null?fx:tuFee(c),sess=bill==='session'?tuSess(c.id,s.id,pk):0;
  const def=bill==='session'?unit*sess:unit;
  const over=!!(rec&&rec.due!=null),due=over?+rec.due:def;
  const pays=((rec&&rec.pays)||[]).slice(),total=pays.reduce((a,p)=>a+(+p.amt||0),0);
  const st=total>=due&&(due>0||total>0)?'paid':(total>0?'part':(due>0?'due':'free'));
  return {rec:rec,bill:bill,unit:unit,fx:fx,sess:sess,def:def,over:over,due:due,pays:pays,total:total,left:Math.max(0,due-total),st:st};
}
function tuStat(c,pk){
  const rows=[];let paid=0,part=0,due=0,free=0,col=0,pend=0;
  rosterOf(c.id).forEach(s=>{
    const x=tuCalc(c,s,pk);x.s=s;rows.push(x);
    col+=x.total;
    if(x.st==='paid')paid++;else if(x.st==='part'){part++;pend+=x.left}else if(x.st==='due'){due++;pend+=x.left}else free++;
  });
  const t=paid+part+due;
  return {rows:rows,paid:paid,part:part,due:due,free:free,owe:part+due,col:col,pend:pend,rate:t?paid/t:null,n:rows.length};
}
/* 跨班級：月份給按月／按堂的班；按期的班取最新一期 */
function tuAllStat(ym){
  const o={rows:[],col:0,pend:0,paid:0,owe:0,list:[]};
  activeClasses().forEach(c=>{
    if(!tuFee(c))return;
    const pk=tuBill(c)==='term'?((tuTerms(c)[0]||{}).k||''):ym;
    if(!pk)return;
    const T=tuStat(c,pk);
    if(!T.n)return;
    o.rows.push({c:c,pk:pk,T:T});o.col+=T.col;o.pend+=T.pend;o.paid+=T.paid;o.owe+=T.owe;
    T.rows.forEach(x=>{if(x.st==='due'||x.st==='part')o.list.push({c:c,pk:pk,s:x.s,left:x.left,st:x.st})});
  });
  o.rate=(o.paid+o.owe)?o.paid/(o.paid+o.owe):null;
  return o;
}
function tuNextNo(date){
  const p=date.replace(/-/g,'');let mx=0;
  list('tuition').forEach(r=>(r.pays||[]).forEach(x=>{
    if(x.no&&x.no.indexOf(p+'-')===0){const n=+x.no.slice(9);if(n>mx)mx=n}
  }));
  return p+'-'+String(mx+1).padStart(3,'0');
}
function tuAddPay(c,s,pk,o){
  const id=tuId(c.id,s.id,pk),r=S.tuition[id]||{},pays=(r.pays||[]).slice();
  const pay={id:uid('p'),amt:Math.round(o.amt*100)/100,date:o.date,method:o.method||'cash',no:tuNextNo(o.date)};
  if(o.note)pay.note=o.note;
  pays.push(pay);
  patch('tuition',id,{cid:c.id,sid:s.id,pk:pk,pays:pays});
  NAV.tuMethod=pay.method;
  return pay;
}

/* ----- 共用小元件 ----- */
function tuStep(label,attrs){
  return '<div class="pstep"><button class="ib" data-a="'+attrs.a+'" data-n="-1" '+(attrs.x||'')+' aria-label="上一個月">'+ic('back',20)+'</button><b>'+esc(label)+'</b><button class="ib" data-a="'+attrs.a+'" data-n="1" '+(attrs.x||'')+' aria-label="下一個月">'+ic('chev',20)+'</button></div>';
}
function tuRow(c,pk,x,i){
  const s=x.s,d='data-cid="'+c.id+'" data-sid="'+s.id+'" data-pk="'+pk+'"';
  let sub=x.bill==='session'?'出席 '+x.sess+' 堂 × '+money(x.unit):(s.grade||' ');
  if(x.rec&&x.rec.note)sub+=' · '+x.rec.note;
  let right;
  if(x.st==='paid')right='<div class="tuamt ok"><b>'+money(x.total)+'</b><small>已繳</small></div>';
  else if(x.st==='free')right='<div class="tuamt"><small>免收</small></div>';
  else right='<div class="tuamt'+(x.st==='part'?' part':'')+'"><b>'+money(x.left)+'</b><small>'+(x.st==='part'?'尚欠':'待繳')+'</small></div><button class="tub go" data-a="tuQuick" '+d+'>'+(x.st==='part'?'補收':'收款')+'</button>';
  return '<div class="stu" style="--i:'+i+';--c:'+ccolor(c)+'">'+avH(s.name,ccolor(c),'sm')+'<button class="nm" data-a="tuOpen" '+d+'><b>'+esc(s.name)+'</b><small>'+esc(sub)+'</small></button>'+right+'</div>';
}
const tuBar=T=>{const t=T.paid+T.part+T.due;return t?'<div class="bar big" style="margin:10px 0 12px"><i class="p" style="width:'+(T.paid/t*100)+'%"></i><i class="l" style="width:'+(T.part/t*100)+'%"></i></div>':''};

/* ----- 班級的學費頁 ----- */
PAGES.tuition=p=>{
  const c=classOf(p.id);
  if(!c)return pageShell('學費',empty('classes','找不到這個班級','可能已被刪除。',''));
  const fee=tuFee(c),bill=tuBill(c);
  let b='<div class="hero" style="border-left:5px solid var(--c);--c:'+ccolor(c)+'"><div style="min-width:0;flex:1"><h1 class="ell">'+esc(c.name)+'</h1><div class="meta">'+(fee?BILL[bill]+' · '+money(fee)+' / '+tuUnit(c):'尚未設定學費')+'</div>'+(c.room?'<div class="meta">教室：'+esc(c.room)+'</div>':'')+'</div><button class="ib" data-a="openp" data-n="classForm" data-id="'+c.id+'" aria-label="修改學費設定">'+ic('edit',20)+'</button></div>';
  if(!fee)return pageShell('學費',b+empty('coin','還沒有設定學費','先填入學費金額與計費方式，才能開始記錄收款。','<button class="btn pri" data-a="openp" data-n="classForm" data-id="'+c.id+'">設定學費</button>'));
  const pk=tuCur(c);
  if(bill==='term'){
    const L=tuTerms(c);
    b+='<div class="chips" style="margin-bottom:12px">'+L.map(t=>'<button class="chip'+(t.k===pk?' on':'')+'" data-a="tuPick" data-cid="'+c.id+'" data-pk="'+t.k+'">'+esc(t.label)+'</button>').join('')+'<button class="chip" data-a="tuTermNew" data-cid="'+c.id+'">'+ic('plus',14)+'新增一期</button></div>';
    if(!pk)return pageShell(c.name+' 學費',b+empty('coin','還沒有期別','按「新增一期」建立第一期（例如「114 上學期」），再記錄每位學生的收款。',''));
  }else{
    b+=tuStep(tuYmLabel(pk),{a:'tuMon',x:'data-cid="'+c.id+'"'});
    if(pk!==tuYmNow())b+='<div style="margin:-4px 0 12px;text-align:center"><button class="lnk" data-a="tuMon" data-n="0" data-cid="'+c.id+'">回到本月</button></div>';
  }
  const T=tuStat(c,pk),f=NAV.tuF;
  b+='<div class="stats"><div class="stat"><b class="money green">'+moneyS(T.col)+'</b><span>已收</span></div><div class="stat"><b class="money'+(T.pend?' red':'')+'">'+moneyS(T.pend)+'</b><span>待收</span></div><div class="stat"><b>'+pct(T.rate)+'</b><span>繳費率</span></div></div>';
  b+=tuBar(T);
  const nDue=T.owe,nPaid=T.paid;
  b+='<div class="chips" style="margin-bottom:10px">'+[['all','全部',T.n],['due','待繳',nDue],['paid','已繳',nPaid]].map(t=>'<button class="chip'+(f===t[0]?' on':'')+'" data-a="tuFilter" data-v="'+t[0]+'">'+t[1]+' <b>'+t[2]+'</b></button>').join('')+'</div>';
  const rows=T.rows.filter(x=>f==='due'?(x.st==='due'||x.st==='part'):f==='paid'?x.st==='paid':true);
  if(!T.n)b+=empty('user','這個班還沒有學生','到班級頁把學生加入此班後，這裡就會出現。','');
  else if(!rows.length)b+='<div class="card pad small muted" style="text-align:center">'+(f==='due'?'這一期沒有待繳的學生 🎉':'這一期還沒有人繳費')+'</div>';
  else b+='<div class="stulist">'+rows.map((x,i)=>tuRow(c,pk,x,i)).join('')+'</div>';
  if(T.n){
    b+='<p class="tiny faint foot">點「收款」記錄今天收款；點姓名看明細、分期、開收條。</p>';
    b+='<div class="two" style="margin-top:14px"><button class="btn" data-a="tuUnpaid" data-cid="'+c.id+'">'+ic('copy',18)+'待催繳名單</button><button class="btn" data-a="tuCsv" data-cid="'+c.id+'">'+ic('dl',18)+'匯出名冊 CSV</button></div>';
  }
  return pageShell(c.name+' 學費',b);
};
ACT.tuMon=d=>{
  const c=classOf(d.cid);if(!c)return;
  NAV.tuSel[c.id]=(+d.n===0)?tuYmNow():tuYmShift(tuCur(c),+d.n);
  render();
};
ACT.tuPick=d=>{
  const c=classOf(d.cid);if(!c)return;
  if(d.pk===tuCur(c)){tuTermSheet(c,d.pk);return}
  NAV.tuSel[c.id]=d.pk;render();
};
ACT.tuFilter=d=>{NAV.tuF=d.v;render()};

/* 新增、改名、刪除「期」（按期計費） */
function tuTermSheet(c,k){
  const L=tuTerms(c),cur=k?L.find(x=>x.k===k):null;

function tuRcInfo(c,s,pk,p){

function tuRcText(x){
  const L=['【'+x.center+' 學費收據】'];

function tuRoundRect(g,x,y,w,h,r){
  g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}
/* 把收條畫成圖片（白底、方便傳 LINE 或存相簿） */
function tuRcCanvas(x){
  const W=640,PD=40,VX=186,VW=W-PD-VX,F='"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif';
  const rows=[['收據編號',x.no||'—'],['繳費日期',fmtFull(x.date)],['學生姓名',x.student],['班　　級',x.cls],['期　　別',x.period],['付款方式',x.method]];
  if(x.note)rows.push(['備　　註',x.note]);
  const extra=x.left>0?'本期應繳 '+money(x.due)+'　累計已收 '+money(x.total)+'　尚欠 '+money(x.left):(x.total>x.amt?'本期應繳 '+money(x.due)+'　累計已收 '+money(x.total)+'（已繳清）':'');
  const wrap=(g,t,maxW)=>{const out=[];let cur='';for(const ch of String(t)){if(cur&&g.measureText(cur+ch).width>maxW){out.push(cur);cur=ch}else cur+=ch}if(cur)out.push(cur);return out};
  const run=(g,draw)=>{
    let y=PD;
    const T=(t,xx,yy,font,col,al)=>{if(!draw)return;g.font=font;g.fillStyle=col;g.textAlign=al||'left';g.fillText(t,xx,yy)};
    g.textBaseline='alphabetic';
    y+=40;T('學費收據',W/2,y,'800 40px '+F,'#1f2430','center');
    y+=36;T(x.center,W/2,y,'600 22px '+F,'#5b6270','center');
    y+=24;if(draw){g.strokeStyle='#d9d4c7';g.lineWidth=2;g.beginPath();g.moveTo(PD,y);g.lineTo(W-PD,y);g.stroke()}
    y+=10;
    rows.forEach(r=>{
      g.font='600 24px '+F;
      const ls=wrap(g,r[1],VW);
      ls.forEach((l,i)=>{y+=38;if(i===0)T(r[0],PD,y,'500 22px '+F,'#7a7f8a');T(l,VX,y,'600 24px '+F,'#1f2430')});
      y+=4;
    });
    y+=20;
    const bh=extra?190:150;
    if(draw){g.fillStyle='#f4efe1';tuRoundRect(g,PD,y,W-2*PD,bh,18);g.fill()}
    T('本次收款（新臺幣）',PD+24,y+38,'500 22px '+F,'#7a7f8a');
    T('NT$ '+Math.round(x.amt).toLocaleString('en-US'),PD+24,y+98,'800 56px '+F,'#1f2430');
    T(cnMoney(x.amt),PD+24,y+134,'600 24px '+F,'#5b6270');
    if(extra)T(extra,PD+24,y+170,'500 20px '+F,'#9a6a12');
    y+=bh+34;
    if(draw){g.strokeStyle='#cfc9b8';g.lineWidth=2;g.setLineDash([6,6]);g.beginPath();g.moveTo(PD,y);g.lineTo(W-PD,y);g.stroke();g.setLineDash([])}
    y+=44;T('經手人簽章：',PD,y,'500 22px '+F,'#7a7f8a');
    if(draw){g.strokeStyle='#bdb7a6';g.lineWidth=2;g.beginPath();g.moveTo(PD+150,y+4);g.lineTo(W-PD,y+4);g.stroke()}
    y+=48;T('此收據為繳費證明，請妥善保存。',W/2,y,'500 19px '+F,'#9a9fa9','center');
    return y+PD;
  };
  const m=document.createElement('canvas').getContext('2d');
  const H=run(m,false),cv=document.createElement('canvas'),k=2;
  cv.width=W*k;cv.height=H*k;
  const g=cv.getContext('2d');
  g.scale(k,k);
  g.fillStyle='#fffdf7';g.fillRect(0,0,W,H);
  g.strokeStyle='#e6dfcc';g.lineWidth=2;g.strokeRect(1,1,W-2,H-2);
  run(g,true);
  return cv;
}

/* ===== 紙本輸出：把表格畫成 A4 圖片頁 → 預覽、列印、存成 PDF =====
   為什麼畫成圖片？
   · iPhone 主畫面（獨立視窗）模式下 window.print() 不一定可用，而 PDF 需要內嵌中文字型；
   · 先畫成 200 dpi 的圖片頁，預覽、列印、PDF 三者共用同一份，所見即所得。
   spec 格式：
     name        檔名（不含副檔名）
     （rows 內的某一列若設 row.sum=true，會畫成灰底粗體的總計列）
     landscape   true＝橫式
     title       大標題；meta:[字串…] 標題下的一行資訊
     cols:[{h,w,a,b,wrap}]  欄標題（可用 \n 分兩行）、相對寬度、對齊 l/c/r、b=粗體、wrap=文字自動折成最多兩行
     rows:[[字串…]]    每格可用 \n 分兩行（第一行粗體、第二行較小）
     foot:[{k,v}｜{t,small}]  表格下方的欄位（v 空白會畫出可手寫的底線）
     sign:[[標籤,底線長度mm]…]  右下角簽名欄
     fs（字高 mm）、rhMin／rhMax／rhHard（列高 mm）、zebra、stamp */
const PP_MM=200/25.4;
const PP_F='"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei","Heiti TC",sans-serif';
let PAPER=null,PP_BUSY=false;
IC.print='<path d="M7 8V4h10v4M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="7" y="14" width="10" height="6" rx="1"/>';
IC.table='<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M9.5 4.5v15M15 10v9.5"/>';

function paperDraw(spec){
  const mm=PP_MM,land=!!spec.landscape;
  const W=Math.round((land?297:210)*mm),H=Math.round((land?210:297)*mm);
  const M=Math.round((spec.margin||11)*mm),fs=Math.round((spec.fs||3.6)*mm),TW=W-2*M;
  const fnt=(wt,px)=>wt+' '+Math.round(px)+'px '+PP_F;
  const sc=document.createElement('canvas');sc.width=W;sc.height=H;
  const sg=sc.getContext('2d');
  const cols=spec.cols,sumW=cols.reduce((a,c)=>a+c.w,0),cw=[],cx=[];
  let acc=0;
  cols.forEach(c=>{const x0=Math.round(TW*acc/sumW);acc+=c.w;const x1=Math.round(TW*acc/sumW);cx.push(M+x0);cw.push(x1-x0)});
  const PAD=Math.round(fs*0.35);
  /* 文字太寬就先縮小（最多縮到 70%），還是放不下就加刪節號 */
  const fit=(g,t,wt,px,maxW)=>{
    t=String(t);let p=px;g.font=fnt(wt,p);
    while(g.measureText(t).width>maxW&&p>px*0.7){p-=1;g.font=fnt(wt,p)}
    if(g.measureText(t).width<=maxW)return t;
    const a=Array.from(t);
    while(a.length>1&&g.measureText(a.join('')+'…').width>maxW)a.pop();
    return a.join('')+'…';
  };
  const wrapT=(g,t,maxW)=>{
    const out=[];
    String(t).split('\n').forEach(par=>{let cur='';for(const ch of par){if(cur&&g.measureText(cur+ch).width>maxW){out.push(cur);cur=ch}else cur+=ch}out.push(cur)});
    return out;
  };
  const alignOf=(c,x,w)=>c.a==='l'?['left',x+PAD]:c.a==='r'?['right',x+w-PAD]:['center',x+w/2];

  /* 標題區：回傳表格從哪個 y 開始 */
  function head(g,first,pi,np){
    let y=M;
    const tpx=first?fs*1.6:fs*1.15;
    g.textBaseline='alphabetic';g.fillStyle='#111';g.textAlign='center';
    const t=first?spec.title:spec.title+(np>1?'（續 '+(pi+1)+'/'+np+'）':'（續）');
    const tt=fit(g,t,800,tpx,TW);
    y+=Math.round(tpx);g.fillText(tt,W/2,y);
    y+=Math.round(fs*0.55);
    g.strokeStyle='#111';g.lineWidth=Math.max(3,Math.round(fs*0.12));
    g.beginPath();g.moveTo(M,y);g.lineTo(W-M,y);g.stroke();
    y+=Math.round(fs*0.3);
    if(first&&spec.meta&&spec.meta.length){
      g.font=fnt(500,fs*0.9);g.textAlign='left';g.fillStyle='#333';
      let x=M,ly=y+Math.round(fs*1.25);const gap=Math.round(fs*1.5);
      spec.meta.forEach(m=>{
        const w=g.measureText(m).width;
        if(x>M&&x+w>W-M){x=M;ly+=Math.round(fs*1.35)}
        g.fillText(m,x,ly);x+=w+gap;
      });
      y=ly+Math.round(fs*0.6);
    }else y+=Math.round(fs*0.4);
    return y;
  }
  /* 表頭 */
  const hasML=cols.some(c=>String(c.h).indexOf('\n')>=0);
  const thH=Math.round(fs*(hasML?2.9:2.1));
  function thead(g,y){
    g.fillStyle='#e6e8ec';g.fillRect(M,y,TW,thH);
    g.textBaseline='alphabetic';
    cols.forEach((c,i)=>{
      const ls=String(c.h).split('\n'),w=cw[i],al=alignOf(c,cx[i],w);
      g.textAlign=al[0];g.fillStyle='#111';
      if(ls.length===1){g.fillText(fit(g,ls[0],700,fs,w-PAD*2),al[1],y+thH/2+fs*0.35)}
      else{
        g.fillText(fit(g,ls[0],700,fs*0.95,w-PAD*2),al[1],y+thH*0.44);
        g.fillStyle='#444';g.fillText(fit(g,ls[1],500,fs*0.72,w-PAD*2),al[1],y+thH*0.84);
      }
    });
  }
  /* 一列資料 */
  function rowDraw(g,y,rh,r,idx){
    if(r.sum){g.fillStyle='#e8eaee';g.fillRect(M,y,TW,rh)}
    else if(spec.zebra&&idx%2===1){g.fillStyle='#f3f4f6';g.fillRect(M,y,TW,rh)}
    g.textBaseline='alphabetic';
    cols.forEach((c,i)=>{
      const raw=String(r[i]==null?'':r[i]),ls=raw.split('\n'),w=cw[i],al=alignOf(c,cx[i],w);
      g.textAlign=al[0];g.fillStyle='#111';
      if(c.wrap&&raw){
        const sz=fs*0.8,mw=w-PAD*2;g.font=fnt(500,sz);
        /* 逗號、句號等標點不排在行首：寧可略微超出一點點 */
        let L=[],cur='';
        for(const ch of raw.replace(/\n/g,' ')){if(cur&&g.measureText(cur+ch).width>mw&&'，。、；：！？）」』〉》…,.;:!?)'.indexOf(ch)<0){L.push(cur);cur=ch}else cur+=ch}
        L.push(cur);
        if(L.length>2){const a=Array.from(L.slice(1).join(''));while(a.length>1&&g.measureText(a.join('')+'…').width>mw)a.pop();L=[L[0],a.join('')+'…']}
        const lh=sz*1.3,y0=y+rh/2-(L.length-1)*lh/2+sz*0.35;
        L.forEach((t,k)=>g.fillText(t,al[1],y0+k*lh));
        return;
      }
      if(ls.length<2||ls[1]===''){
        if(ls[0]!=='')g.fillText(fit(g,ls[0],r.sum?800:c.b?700:500,fs,w-PAD*2),al[1],y+rh/2+fs*0.35);
      }else{
        if(ls[0]!=='')g.fillText(fit(g,ls[0],800,fs*0.98,w-PAD*2),al[1],y+rh*0.47);
        g.fillStyle='#333';g.fillText(fit(g,ls[1],600,fs*0.78,w-PAD*2),al[1],y+rh*0.88);
      }
    });
    g.strokeStyle='#9aa0aa';g.lineWidth=2;
    g.beginPath();g.moveTo(M,y+rh);g.lineTo(M+TW,y+rh);g.stroke();
  }
  /* 表格外框與直線 */
  function frame(g,top,cnt,rh){
    const bot=top+thH+cnt*rh;
    g.strokeStyle='#9aa0aa';g.lineWidth=2;
    for(let i=1;i<cols.length;i++){g.beginPath();g.moveTo(cx[i],top);g.lineTo(cx[i],bot);g.stroke()}
    g.strokeStyle='#222';g.lineWidth=3;
    g.beginPath();g.moveTo(M,top+thH);g.lineTo(M+TW,top+thH);g.stroke();
    g.strokeRect(M,top,TW,bot-top);
  }
  /* 表格下方：欄位與簽名。draw=false 只量高度 */
  function foot(g,y,draw){
    let cy=y+Math.round(fs*0.9);
    (spec.foot||[]).forEach(f=>{
      if(f.t){
        g.font=fnt(500,fs*(f.small?0.78:0.95));
        wrapT(g,f.t,TW).forEach(l=>{
          cy+=Math.round(fs*(f.small?1.25:1.5));
          if(draw){g.textAlign='left';g.fillStyle=f.small?'#555':'#111';g.fillText(l,M,cy)}
        });
        cy+=Math.round(fs*0.3);return;
      }
      g.font=fnt(800,fs*0.95);const lw=g.measureText(f.k+'：').width;
      g.font=fnt(500,fs*0.95);
      const ls=f.v?wrapT(g,f.v,TW-lw):[''];
      ls.forEach((l,i)=>{
        cy+=Math.round(fs*1.65);
        if(!draw)return;
        g.textAlign='left';g.fillStyle='#111';
        if(i===0){g.font=fnt(800,fs*0.95);g.fillText(f.k+'：',M,cy)}
        g.font=fnt(500,fs*0.95);g.fillText(l,M+lw,cy);
        if(!f.v){g.strokeStyle='#9aa0aa';g.lineWidth=2;g.beginPath();g.moveTo(M+lw,cy+fs*0.2);g.lineTo(W-M,cy+fs*0.2);g.stroke()}
      });
      cy+=Math.round(fs*0.2);
    });
    if(spec.sign&&spec.sign.length){
      cy+=Math.round(fs*2.4);
      if(draw){
        let x=W-M;
        for(let i=spec.sign.length-1;i>=0;i--){
          const lab=spec.sign[i][0]+'：',L=Math.round(spec.sign[i][1]*mm);
          g.strokeStyle='#111';g.lineWidth=2;g.beginPath();g.moveTo(x-L,cy);g.lineTo(x,cy);g.stroke();
          g.font=fnt(500,fs*0.95);g.textAlign='right';g.fillStyle='#111';g.fillText(lab,x-L-4,cy-5);
          x-=L+g.measureText(lab).width+Math.round(fs*1.2);
        }
      }
    }
    return cy;
  }
  const pnH=Math.round(fs*1.2),bottom=H-M-pnH;
  function pageNo(g,pi,np){
    g.font=fnt(500,fs*0.72);g.fillStyle='#777';g.textBaseline='alphabetic';
    g.textAlign='center';g.fillText('第 '+(pi+1)+' / '+np+' 頁',W/2,H-Math.round(M*0.55));
    if(spec.stamp){g.textAlign='left';g.fillText(spec.stamp,M,H-Math.round(M*0.55))}
  }

  /* ----- 版面計算：能放一頁就放一頁，放不下才分頁 ----- */
  const rows=spec.rows,n=rows.length;
  const topFirst=head(sg,true,0,1),topNext=head(sg,false,1,2);
  const hasFoot=!!((spec.foot&&spec.foot.length)||(spec.sign&&spec.sign.length));
  const footH=hasFoot?foot(sg,0,false):0;
  const rhMin=Math.round(mm*(spec.rhMin||6.8)),rhMax=Math.round(mm*(spec.rhMax||9.6)),rhHard=Math.round(mm*(spec.rhHard||5.6));
  /* 擠得進一頁（列高不低於 rhHard）就只用一頁；放不下才改用舒適的列高 rhMin 並分頁 */
  let rh=Math.floor((bottom-topFirst-thH-footH)/Math.max(1,n));
  rh=rh>=rhHard?Math.min(rhMax,rh):rhMin;
  const per1=Math.max(1,Math.floor((bottom-topFirst-thH)/rh)),perN=Math.max(1,Math.floor((bottom-topNext-thH)/rh));
  const chunks=[];
  if(n<=per1)chunks.push([0,n]);
  else{chunks.push([0,per1]);let i=per1;while(i<n){const k=Math.min(perN,n-i);chunks.push([i,i+k]);i+=k}}
  const last=chunks[chunks.length-1],lastTop=chunks.length===1?topFirst:topNext;
  const footOnNew=hasFoot&&(lastTop+thH+(last[1]-last[0])*rh+footH>bottom);
  const np=chunks.length+(footOnNew?1:0);
  const pages=[];
  const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);pages.push(c);return g};
  chunks.forEach((ch,pi)=>{
    const g=mk(),top=head(g,pi===0,pi,np),cnt=ch[1]-ch[0];
    thead(g,top);
    for(let k=0;k<cnt;k++)rowDraw(g,top+thH+k*rh,rh,rows[ch[0]+k],ch[0]+k);
    frame(g,top,cnt,rh);
    if(pi===chunks.length-1&&!footOnNew&&hasFoot)foot(g,top+thH+cnt*rh,true);
    pageNo(g,pi,np);
  });
  if(footOnNew){const g=mk(),top=head(g,false,np-1,np);foot(g,top,true);pageNo(g,np-1,np)}
  sc.width=sc.height=1;
  return pages;
}

/* 把圖片頁包成 PDF（每頁一張 JPEG，A4 尺寸） */
async function paperPdfBlob(d){
  const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const put=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);len+=u.length};
  const pw=d.land?841.89:595.276,ph=d.land?595.276:841.89,N=d.pages.length;
  put('%PDF-1.4\n%âãÏÓ\n');
  const obj=(i,s)=>{off[i]=len;put(i+' 0 obj\n'+s+'\nendobj\n')};
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids ['+d.pages.map((p,i)=>(3+3*i)+' 0 R').join(' ')+'] /Count '+N+' >>');
  for(let i=0;i<N;i++){
    const p=d.pages[i],img=new Uint8Array(await p.blob.arrayBuffer()),pn=3+3*i;
    obj(pn,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 '+(pn+2)+' 0 R >> >> /Contents '+(pn+1)+' 0 R >>');
    const cs='q '+pw+' 0 0 '+ph+' 0 0 cm /Im0 Do Q';
    obj(pn+1,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
    off[pn+2]=len;
    put((pn+2)+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+img.length+' >>\nstream\n');
    put(img);put('\nendstream\nendobj\n');
  }
  const xr=len,total=3+3*N;
  let x='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(let i=1;i<total;i++)x+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  x+='trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF\n';
  put(x);
  return new Blob(parts,{type:'application/pdf'});
}

function paperFree(){
  if(PAPER)PAPER.pages.forEach(p=>{try{URL.revokeObjectURL(p.url)}catch(e){}});
  PAPER=null;
}
/* 產生預覽：畫頁面 → JPEG → PDF，全部備妥後才開啟預覽（這樣按「存成 PDF」時可以立刻分享） */
async function paperOpen(spec,title){
  if(PP_BUSY)return;
  PP_BUSY=true;
  try{
    paperFree();
    const cvs=paperDraw(spec),pages=[];
    for(const c of cvs){
      const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.92));
      if(!blob)throw new Error('toBlob');
      pages.push({blob,url:URL.createObjectURL(blob),w:c.width,h:c.height});
      c.width=c.height=1;
    }
    PAPER={pages,land:!!spec.landscape,name:spec.name||'班務通',title:title||'列印預覽'};
    PAPER.pdf=await paperPdfBlob(PAPER);
    paperSheet();
  }catch(e){toast('無法產生列印檔，請稍後再試',3200)}
  finally{PP_BUSY=false}
}

    '<p class="tiny faint" style="margin-top:10px">「存成 PDF」會開啟分享面板：可存到「檔案」、傳到 LINE，或選「列印」用 AirPrint 列印。「列印」會直接開啟系統列印視窗；部分手機的主畫面模式不支援，請改用 PDF。</p>';

/* 直接列印：把圖片頁放進 #printroot，列印時只顯示它（見 CSS @media print） */
ACT.paperPrint=async()=>{
  const d=PAPER;if(!d)return;
  let r=$('#printroot');
  if(!r){r=document.createElement('div');r.id='printroot';document.body.appendChild(r)}
  r.innerHTML=d.pages.map(p=>'<img src="'+p.url+'" alt="">').join('');
  let st=$('#printpage');
  if(!st){st=document.createElement('style');st.id='printpage';document.head.appendChild(st)}
  /* 圖片高度略小於紙張（差 0.4mm），避免 297×210 的比例四捨五入後多出一點點而多印一張空白頁 */
  const W=d.land?297:210,H=d.land?209.6:296.6;
  st.textContent='@page{size:A4 '+(d.land?'landscape':'portrait')+';margin:0}@media print{#printroot{width:'+W+'mm;overflow:hidden}#printroot img{width:'+W+'mm;height:'+H+'mm}}';
  try{await Promise.all(Array.from(r.querySelectorAll('img')).map(i=>i.decode?i.decode():Promise.resolve()))}catch(e){}
  const done=()=>{window.removeEventListener('afterprint',done);r.innerHTML=''};
  window.addEventListener('afterprint',done);
  try{window.print()}catch(e){done();toast('這個瀏覽器無法直接列印，請改用「存成 PDF」',3400)}
};

/* ===== 月總表：某班某月「學生 × 上課日」的出席＋小考矩陣；匯出 CSV；列印 A4 點名表 =====
   不新增任何資料：全部由既有的點名（att）、小考（exams）、聯絡簿（att.lesson／att.hw）算出來。
   上課日 ＝ 這個班的上課日（每週固定、開課日之後，加上臨時加課、扣掉臨時停課）＋ 有點名紀錄的日子 ＋ 有小考的日子。 */
NAV.ledSel={};NAV.ledReset=false;
const ledScoreTxt=(q,sid)=>{const v=(q.scores||{})[sid];return v==='x'?'缺考':(typeof v==='number'?fmtN(v):'')};
const ledFile=s=>String(s).replace(/[\\/:*?"<>|\s]+/g,'_');
const ledStamp=()=>{const d=new Date();return (centerName()||'班務通')+'　列印於 '+fmtFull(todayS())+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const ledYm=date=>date.slice(0,4)+date.slice(5,7);

/* 這個月有哪些「日子」要排成欄 */
function ledDates(c,ym){
  const y=+ym.slice(0,4),m=+ym.slice(4,6),n=new Date(y,m,0).getDate(),pre=y+'-'+pad(m)+'-',set={};
  for(let d=1;d<=n;d++){const s=pre+pad(d);if(isClassDay(c,s))set[s]=1}
  list('att').forEach(a=>{if(a.cid===c.id&&a.date&&a.date.slice(0,7)===pre.slice(0,7)&&hasMarks(a))set[a.date]=1});
  list('exams').forEach(q=>{if(q.cid===c.id&&q.date&&q.date.slice(0,7)===pre.slice(0,7))set[q.date]=1});
  return Object.keys(set).sort();
}
/* 整張矩陣的資料（螢幕、CSV、列印共用） */
function ledBuild(c,ym){
  const dates=ledDates(c,ym),docs={},qz={};
  dates.forEach(d=>{docs[d]=attDoc(c.id,d);qz[d]=quizzesOn(c.id,d).sort((a,b)=>String(a.title||'')<String(b.title||'')?-1:1)});
  /* 已退班的學生：只有在這個月留有紀錄時才列出 */
  const ro=students().filter(s=>{
    if((s.classIds||[]).indexOf(c.id)<0)return false;
    if(s.status!=='left')return true;
    return dates.some(d=>(docs[d]&&docs[d].marks&&docs[d].marks[s.id])||qz[d].some(q=>(q.scores||{})[s.id]!=null));
  }).sort(bySeat(c.id));
  const rows=ro.map(s=>{
    const r={s:s,cells:[],p:0,l:0,v:0,x:0,sc:[]};
    dates.forEach(d=>{
      const k=(docs[d]&&docs[d].marks&&docs[d].marks[s.id])||'';
      if(k&&r[k]!=null)r[k]++;
      const qs=[];
      qz[d].forEach(q=>{
        const v=(q.scores||{})[s.id];
        if(v===undefined||v===null)return;
        qs.push({q:q,v:v});
        if(typeof v==='number')r.sc.push(v/(q.full||100)*100);
      });
      r.cells.push({d:d,k:k,qs:qs});
    });
    const t=r.p+r.l+r.v+r.x;
    r.rate=t?(r.p+r.l)/t:null;
    r.avg=r.sc.length?r.sc.reduce((a,b)=>a+b,0)/r.sc.length:null;
    return r;
  });
  let tp=0,tt=0;rows.forEach(r=>{tp+=r.p+r.l;tt+=r.p+r.l+r.v+r.x});
  return {dates:dates,docs:docs,qz:qz,rows:rows,
    marked:dates.filter(d=>hasMarks(docs[d])).length,
    nq:dates.reduce((a,d)=>a+qz[d].length,0),
    rate:tt?tp/tt:null};
}

  if(!L.dates.length||!L.rows.length){toast('這個月沒有可匯出的資料');return}
  const hdr=['座號','姓名','年級','學校'];
  L.dates.forEach(dt=>{
    hdr.push(fmtMD(dt)+'（'+WD[wdOf(dt)]+'）出席');
    L.qz[dt].forEach(q=>hdr.push(fmtMD(dt)+' '+(q.title||'小考')+'（滿分'+(q.full||100)+'）'));
  });
  hdr.push('準時','遲到','請假','缺席','出席率','小考均分（百分制）');
  const rows=[hdr];
  L.rows.forEach(r=>{
    const row=[seatOf(r.s,c.id)==null?'':seatOf(r.s,c.id),r.s.name,r.s.grade||'',r.s.school||''];
    r.cells.forEach(cl=>{
      row.push(cl.k?MARKS[cl.k][1]:'未點名');
      L.qz[cl.d].forEach(q=>{const v=(q.scores||{})[r.s.id];row.push(v==='x'?'缺考':(typeof v==='number'?v:''))});
    });
    row.push(r.p,r.l,r.v,r.x,r.rate==null?'':Math.round(r.rate*100)+'%',r.avg==null?'':Math.round(r.avg*10)/10);
    rows.push(row);
  });
  return ledCsvOut(rows,ledFile(c.name+'-'+ym.slice(0,4)+'年'+(+ym.slice(4,6))+'月-月總表')+'.csv');
};
ACT.attCsv=d=>{
  const c=classOf(d.cid);if(!c)return;
  const ro=rosterOf(d.cid),doc=attDoc(d.cid,d.date),qs=quizzesOn(d.cid,d.date),m=(doc&&doc.marks)||{};
  if(!ro.length){toast('這個班還沒有學生');return}

  qs.forEach(q=>hdr.push((q.title||'小考')+'（滿分'+(q.full||100)+'）'));
  hdr.push('作業','未帶簿','未簽簿','備註','家長','聯絡電話');
  const rows=[hdr];
  ro.forEach(s=>{
    const k=m[s.id]||'',fl=(doc&&doc.flags&&doc.flags[s.id])||{},hk=hwOf(doc,s.id);
    const row=[d.date,c.name,seatOf(s,c.id)==null?'':seatOf(s,c.id),s.name,s.grade||'',s.school||'',k?MARKS[k][1]:'未點名'];
    qs.forEach(q=>{const v=(q.scores||{})[s.id];row.push(v==='x'?'缺考':(typeof v==='number'?v:''))});
    row.push(hk?HW_LBL[hk][1]:'',fl.book?'是':'',fl.sign?'是':'',(doc&&doc.notes&&doc.notes[s.id])||'',s.parent||'',csvPhone(s.phone));
    rows.push(row);

/* ----- 列印：當日點名表（直式）、月總表（橫式） ----- */
function ledDaySpec(cid,date){
  const c=classOf(cid),ro=rosterOf(cid),doc=attDoc(cid,date),qs=quizzesOn(cid,date),ls=lessonOf(doc),m=(doc&&doc.marks)||{};
  const cn=attCount(doc,ro),tm=timeText(cid,date),useSeat=ro.some(s=>seatOf(s,cid)!=null);
  const rows=ro.map((s,i)=>{
    const k=m[s.id]||'',fl=(doc&&doc.flags&&doc.flags[s.id])||{},nt=(doc&&doc.notes&&doc.notes[s.id])||'',hk=hwOf(doc,s.id);
    const scs=qs.map(q=>ledScoreTxt(q,s.id)).filter(x=>x!=='').join(' / ');
    const tags=[fl.book?'未帶簿':'',fl.sign?'未簽簿':''].filter(Boolean).join('、');
    return [useSeat?(seatOf(s,cid)==null?'':String(seatOf(s,cid))):String(i+1),s.name,[s.grade,s.school].filter(Boolean).join(' '),k?MARKS[k][0]:'',scs,hk?HW_LBL[hk][0]:'',[tags,nt].filter(Boolean).join('　')];
  });
  const meta=['日期：'+fmtFull(date)+'（週'+WD[wdOf(date)]+'）'];
  if(tm)meta.push('時間：'+tm);
  if(c.room)meta.push('教室：'+c.room);
  meta.push('人數：'+ro.length+' 人');
  if(cn.p+cn.l+cn.v+cn.x)meta.push('到 '+cn.p+'　遲 '+cn.l+'　假 '+cn.v+'　缺 '+cn.x);
  qs.forEach(q=>meta.push('小考：'+(q.title||'小考')+'（滿分 '+(q.full||100)+'）'));
  const foot=[{k:'今日教學進度',v:ls.progress||''},{k:'指定作業',v:ls.homework||''}];
  if(ls.exam)foot.push({k:'下次考試範圍',v:ls.exam});
  return {name:ledFile(c.name+'-點名表-'+date),title:c.name+'　點名與成績表',meta:meta,
    cols:[{h:useSeat?'座號':'序',w:1,a:'c'},{h:'姓名',w:2.7,a:'l',b:true},{h:'年級／學校',w:3,a:'l'},{h:'出席',w:1.5,a:'c',b:true},{h:'小考',w:2,a:'c'},{h:'作業',w:1.5,a:'c'},{h:'簽名／備註',w:5,a:'l'}],
    rows:rows,foot:foot,sign:[['任課老師簽名',46],['日期',28]],stamp:ledStamp(),rhMin:6.6,rhMax:9.6,fs:3.6};
}
function ledMonthSpec(c,ym){
  const L=ledBuild(c,ym);
  const useSeat=L.rows.some(r=>seatOf(r.s,c.id)!=null);
  const cols=(useSeat?[{h:'座號',w:1.2,a:'c'}]:[]).concat([{h:'姓名',w:3.6,a:'l',b:true}]);
  /* 日期很多（> 16 欄）時欄位會很窄：標題改成只寫「日」＋星期，月份已在標題區 */
  const tight=L.dates.length>16;
  L.dates.forEach(d=>cols.push({h:tight?(+d.slice(8,10))+'\n'+WD[wdOf(d)]:fmtMD(d)+'\n週'+WD[wdOf(d)],w:1.5,a:'c'}));
  [['到',1.2],['遲',1.2],['假',1.2],['缺',1.2],['出席率',2.3],['均分',2.1]].forEach(x=>cols.push({h:x[0],w:x[1],a:'c'}));
  const rows=L.rows.map(r=>{
    const row=(useSeat?[seatOf(r.s,c.id)==null?'':String(seatOf(r.s,c.id))]:[]).concat([r.s.name]);
    r.cells.forEach(cl=>{
      const mk=cl.k?MARKS[cl.k][0]:'',sc=cl.qs.map(x=>x.v==='x'?'缺考':fmtN(x.v)).join('/');
      row.push(sc?mk+'\n'+sc:mk);
    });
    row.push(String(r.p),String(r.l),String(r.v),String(r.x),r.rate==null?'':Math.round(r.rate*100)+'%',r.avg==null?'':fmtN(r.avg));
    return row;
  });
  const meta=['月份：'+tuYmLabel(ym),'上課：'+L.dates.length+' 堂（已點名 '+L.marked+' 堂）','人數：'+L.rows.length+' 人','平均出席：'+pct(L.rate)];
  if(c.room)meta.splice(1,0,'教室：'+c.room);
  return {name:ledFile(c.name+'-'+ym.slice(0,4)+'年'+(+ym.slice(4,6))+'月-月總表'),landscape:true,title:c.name+'　月總表',meta:meta,
    cols:cols,rows:rows,
    foot:[{t:'到＝準時　遲＝遲到　假＝請假　缺＝缺席　格內下方數字為當日小考分數；均分已換算成 100 分制。',small:true}],
    stamp:ledStamp(),rhMin:7.4,rhMax:9.6,rhHard:7.0,fs:3.1,zebra:true};
}

function seatBoxHtml(cids,seats,sid,keep,already){
  already=already||[];

    return '<label class="seatrow"><span class="ell">'+esc(c.name)+'</span><input class="in seatin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" data-cid="'+c.id+'" value="'+esc(v)+'" placeholder="不填" aria-label="'+esc(c.name)+' 座號"></label>';

}

ACT.saveStu=d=>{
  const name=val('f-name').trim();
  if(!name){toast('請輸入學生姓名');return}
  const classIds=$$('#f-cls .chip.on').map(x=>x.dataset.id),gb=$('#f-gender button.on'),seats={};
  let bad='';
  $$('#f-seatbox .seatin').forEach(inp=>{
    const cid=inp.dataset.cid,raw=inp.value.trim();
    if(raw===''){seats[cid]=null;return}
    if(!/^\d{1,3}$/.test(raw)||+raw<1){bad='座號請填 1 到 999 的數字';return}
    const n=+raw,clash=students().find(x=>x.id!==d.id&&x.status!=='left'&&(x.classIds||[]).indexOf(cid)>=0&&seatOf(x,cid)===n);
    if(clash)bad=((classOf(cid)||{}).name||'這個班')+' 的 '+n+' 號已是「'+clash.name+'」';
    seats[cid]=n;
  });
  if(bad){toast(bad,3400);return}
  const prev=d.id?(studentOf(d.id)||{}).seats||{}:{};
  Object.keys(prev).forEach(cid=>{if(classIds.indexOf(cid)<0&&prev[cid]!=null)seats[cid]=null});
  const data={name,school:val('f-school').trim(),grade:val('f-grade'),parent:val('f-parent').trim(),phone:val('f-phone').trim(),note:val('f-note').trim(),gender:gb?gb.dataset.v:'',classIds,seats};
  let id=d.id;

function lineChart(pts,o){
  o=o||{};
  const W=320,H=170,L=34,R=12,T=12,B=26,n=pts.length;
  const x=i=>n<=1?(L+(W-L-R)/2):L+i*(W-L-R)/(n-1);
  const y=v=>T+(1-Math.max(0,Math.min(100,v))/100)*(H-T-B);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="成績趨勢圖">';
  [0,50,100].forEach(g=>{s+='<line class="ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(g)+'" y2="'+y(g)+'"/><text class="axt" x="'+(L-6)+'" y="'+(y(g)+4)+'" text-anchor="end">'+g+'</text>'});
  if(o.pass!=null)s+='<line class="pass" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(o.pass)+'" y2="'+y(o.pass)+'"/>';
  if(n>1)s+='<polyline class="ln" points="'+pts.map((p,i)=>x(i).toFixed(1)+','+y(p.y).toFixed(1)).join(' ')+'"/>';
  pts.forEach((p,i)=>{s+='<circle class="pt'+(i===n-1?' last':'')+'" cx="'+x(i).toFixed(1)+'" cy="'+y(p.y).toFixed(1)+'" r="4"/>'});
  const step=Math.max(1,Math.ceil(n/5));
  pts.forEach((p,i)=>{if(i%step===0||i===n-1)s+='<text class="axt" x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(p.x)+'</text>'});
  return s+'</svg>';
}

/* ===== 名冊工具：違規累計與值日生、座號排序、批量貼上匯入 =====
   資料（都存在學生文件 students 裡；座號與違規都是「每個班各自」計算）：
     seats:{班級id:座號}          座號
     gender:'M'|'F'|'O'           性別
     served:{班級id:[紀錄鍵…]}    已抵銷的違規（完成值日、清零時寫入）
     infr:[{id,cid,date,note}]    手動新增的「其他違規」
   違規次數不另外存：直接由點名紀錄（att）算出來——
     「未帶簿」「未簽簿」（點名頁的 ⋯）與「作業未繳」（點名頁或聯絡簿）每天各算 1 次。
   所以在點名頁把勾選取消，累計就會跟著減少，不會有兩份資料對不起來。 */
IC.up='<path d="M5 15l7-7 7 7"/>';
IC.down='<path d="M5 9l7 7 7-7"/>';
const INF_LBL={book:'未帶聯絡簿',sign:'未簽聯絡簿',hw:'作業未繳',other:'其他違規'};
const INF_SHORT={book:'未帶簿',sign:'未簽簿',hw:'作業未繳',other:'其他'};
const INF_DUE=3;

/* 一次更新很多筆時先不重畫，最後畫一次 */
function bulkRun(fn){
  const r0=render;render=function(){};OBDEFER=true;
  try{fn()}finally{render=r0;OBDEFER=false;obSave()}
  render();
}

/* ----- 違規累計 ----- */
/* 回傳這個班每位學生的違規紀錄：{學生id:[{k,date,type,note?,id?}…]}，日期由舊到新 */
function infrRecords(cid){
  const out={},add=(sid,r)=>{(out[sid]=out[sid]||[]).push(r)};
  list('att').forEach(a=>{
    if(a.cid!==cid||!a.date)return;
    const ids={};
    Object.keys(a.flags||{}).forEach(x=>{ids[x]=1});
    Object.keys(a.hw||{}).forEach(x=>{ids[x]=1});
    Object.keys(ids).forEach(sid=>{
      const fl=(a.flags&&a.flags[sid])||{};
      if(fl.book)add(sid,{k:a.date+'|book',date:a.date,type:'book'});
      if(fl.sign)add(sid,{k:a.date+'|sign',date:a.date,type:'sign'});
      if(hwOf(a,sid)==='miss')add(sid,{k:a.date+'|hw',date:a.date,type:'hw'});
    });
  });
  list('students').forEach(s=>(s.infr||[]).forEach(r=>{
    if(r&&r.cid===cid)add(s.id,{k:'o|'+r.id,date:r.date||'',type:'other',note:r.note||'',id:r.id});
  }));
  Object.keys(out).forEach(sid=>out[sid].sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0));
  return out;
}
/* 某位學生在某班的累計：open＝還沒抵銷的紀錄，n＝次數，due＝滿 3 次要值日 */
function infrInfo(map,s,cid){
  const recs=((map&&map[s.id])||[]).map(r=>r),sv={};
  ((s.served&&s.served[cid])||[]).forEach(k=>{sv[k]=1});
  recs.forEach(r=>{r.done=!!sv[r.k]});
  const open=recs.filter(r=>!r.done);
  return {recs:recs,open:open,n:open.length,due:open.length>=INF_DUE,total:recs.length};
}
/* 執行一個會改變違規累計的動作；如果因此剛好累計滿 3 次（6、9…次也一樣），跳出值日生提醒 */
function withStrike(cid,sid,f,fn){
  const s0=studentOf(sid),before=s0?infrInfo(infrRecords(cid),s0,cid).n:0;
  fn();
  const s1=studentOf(sid);if(!s1)return;
  const after=infrInfo(infrRecords(cid),s1,cid).n;
  if(after>before&&after%INF_DUE===0)toast('🚨 值日生提醒：'+s1.name+'「'+(INF_LBL[f]||'違規')+'」累計已滿 '+after+' 次，今日課後需擔任班級值日生',5600);
}
function dutyClassLine(c){
  const map=infrRecords(c.id);let due=0,any=0;
  rosterOf(c.id).forEach(s=>{const i=infrInfo(map,s,c.id);if(i.due)due++;else if(i.n)any++});
  return due?due+' 位需擔任值日生':(any?any+' 位有違規累計':'未帶簿、未簽簿、作業未繳，滿 3 次值日');
}
const infrSummary=i=>{
  const cnt={};i.open.forEach(r=>{cnt[r.type]=(cnt[r.type]||0)+1});
  const t=['book','sign','hw','other'].filter(k=>cnt[k]).map(k=>INF_SHORT[k]+' '+cnt[k]).join('・');
  return t||(i.total?'已抵銷 '+i.total+' 筆':'沒有紀錄');
};

/* ----- 批量貼上匯入 ----- */
const BULK_HDR={'座號':'seat','號碼':'seat','序號':'seat','編號':'seat','姓名':'name','名字':'name','學生':'name','學生姓名':'name','性別':'gender','年級':'grade','學校':'school','就讀學校':'school','學校年級':'school','家長':'parent','家長姓名':'parent','家長稱呼':'parent','電話':'phone','手機':'phone','家長電話':'phone','聯絡電話':'phone','備註':'note'};
const BULK_SCHOOL=/(國中|國小|高中|高職|中學|小學|學校|附中|女中|商工|工商|家商|高工|實小|實中|國高中)$/;
const BULK_PARENT=/(媽媽|爸爸|媽咪|爸比|媽|爸|先生|太太|女士|阿姨|奶奶|爺爺|外婆|外公|阿公|阿嬤|叔叔|姑姑|舅舅|監護人)$/;
const bulkGender=t=>/^(男|男生|男性|m|male|♂)$/i.test(t)?'M':/^(女|女生|女性|f|female|♀)$/i.test(t)?'F':'';
function bulkGrade(t){
  t=String(t).trim();
  if(GRADES.indexOf(t)>=0&&t!=='其他')return t;
  const N='一二三四五六',cn=ch=>/[1-9]/.test(ch)?'一二三四五六七八九'[+ch-1]:ch;
  let m=t.match(/^(國|高|小)([一二三四五六1-6])$/);
  if(m){const g=m[1]+cn(m[2]);return GRADES.indexOf(g)>=0?g:''}
  m=t.match(/^(國中|國小|高中)([一二三四五六七八九1-9])年級?$/);
  if(m){const g=({國中:'國',國小:'小',高中:'高'})[m[1]]+cn(m[2]);return GRADES.indexOf(g)>=0?g:''}
  m=t.match(/^([七八九])年級$/);
  if(m)return '國'+N[{七:0,八:1,九:2}[m[1]]];
  return '';
}
function bulkPhone(t){
  const c=String(t).replace(/[\s\-().]/g,'');
  if(/^9\d{8}$/.test(c))return '0'+c;                   // Excel 吃掉開頭的 0
  if(/^(\+?886)?0?9\d{8}$/.test(c)||/^0\d{1,2}\d{6,8}$/.test(c))return c.replace(/^\+?886(?=9)/,'0').replace(/^\+?886/,'0');
  return '';
}
/* 把貼上的文字拆成一列一位學生：{raw,seat,name,gender,grade,school,parent,phone,note} */
function bulkRows(text){
  const lines=String(text||'').split(/\r?\n/).map(l=>l.replace(/ /g,' ').trim()).filter(Boolean);
  if(!lines.length)return [];
  /* 有標題列（座號／姓名／學校…）：照欄位對應 */
  const first=lines[0],tab=first.indexOf('\t')>=0,comma=!tab&&/[,，]/.test(first);
  const split=l=>tab?l.split('\t'):comma?l.split(/[,，]/):l.split(/\s+/);
  const hdr=split(first).map(x=>BULK_HDR[x.replace(/\s/g,'')]||'');
  const mapped=hdr.filter(Boolean);
  if(mapped.length>=2&&mapped.indexOf('name')>=0){
    return lines.slice(1).map(l=>{
      const cells=split(l).map(x=>x.trim()),r={raw:l,seat:null,name:'',gender:'',grade:'',school:'',parent:'',phone:'',note:''};
      hdr.forEach((k,i)=>{
        const v=cells[i]||'';if(!k||!v)return;
        if(k==='seat'){const m=v.match(/^\d{1,3}/);if(m)r.seat=+m[0]}
        else if(k==='gender')r.gender=bulkGender(v);
        else if(k==='phone')r.phone=bulkPhone(v)||v.replace(/\s/g,'');
        else if(k==='grade')r.grade=bulkGrade(v)||v;
        else r[k]=v;
      });
      return r;
    });
  }
  /* 沒有標題列：每行用空格、逗號、Tab、頓號隔開，順序不拘 */
  return lines.map(l=>{
    const r={raw:l,seat:null,name:'',gender:'',grade:'',school:'',parent:'',phone:'',note:''};
    const tk=(l.indexOf('\t')>=0?l.split('\t'):l.split(/[,，、;；\s]+/)).map(x=>x.trim()).filter(Boolean);
    if(tk.length>1&&/^\d{1,3}[.)）]?$/.test(tk[0])){r.seat=parseInt(tk[0],10);tk.shift()}
    const rest=[];
    tk.forEach(t=>{
      const g=bulkGender(t),gr=bulkGrade(t),ph=bulkPhone(t);
      if(g&&!r.gender)r.gender=g;
      else if(ph&&!r.phone)r.phone=ph;
      else if(gr&&!r.grade)r.grade=gr;
      else if(BULK_SCHOOL.test(t)&&t.length>2&&!r.school)r.school=t;
      else if(BULK_PARENT.test(t)&&t.length>=3&&!r.parent)r.parent=t;
      else rest.push(t);
    });
    if(rest.length){
      r.name=rest.shift();
      const left=rest.join(' ');
      if(left){if(!r.school&&/[一-鿿]/.test(left))r.school=left;else r.note=left}
    }
    return r;
  });
}
/* 和現有名冊比對：新增／加入本班／更新資料／略過；並決定座號 */
function bulkResolve(rows,cid){
  const all=students(),np=p=>String(p||'').replace(/\D/g,'').replace(/^886/,'0');
  const inCls=s=>(s.classIds||[]).indexOf(cid)>=0;
  const taken={};let max=0;
  all.forEach(s=>{if(inCls(s)&&s.status!=='left'){const n=seatOf(s,cid);if(n!=null){taken[n]=s.id;max=Math.max(max,n)}}});
  const seen={};
  const plan=rows.map(r=>{
    r.act='';r.why='';r.ex=null;r.auto=false;r.conflict='';
    if(!r.name){r.act='skip';r.why='看不出姓名';return r}
    const k=r.name+'|'+np(r.phone);
    if(seen[k]){r.act='skip';r.why='名單內重複';return r}
    seen[k]=1;
    const cand=all.filter(s=>s.name===r.name&&(!r.phone||!s.phone||np(s.phone)===np(r.phone)));
    const ex=cand.find(s=>inCls(s))||cand.find(s=>s.status!=='left')||cand[0]||null;
    r.ex=ex;
    return r;
  });
  /* 第一輪：先認領貼上文字裡明確寫的座號 */
  plan.forEach(r=>{
    if(r.act==='skip'||r.seat==null)return;
    max=Math.max(max,r.seat);
    const holder=taken[r.seat];
    if(holder&&(!r.ex||holder!==r.ex.id)){const h=studentOf(holder);r.conflict=h?h.name:'他人'}
    else taken[r.seat]=r.ex?r.ex.id:'new';
  });
  /* 第二輪：決定動作；新增／加入本班的人沒寫座號就接在後面 */
  plan.forEach(r=>{
    if(r.act==='skip')return;
    const ex=r.ex;
    if(!ex){r.act='new'}
    else if(inCls(ex)){
      const ch=[];
      if(ex.status==='left')ch.push('恢復在學');
      if(r.seat!=null&&r.seat!==seatOf(ex,cid))ch.push('座號');
      ['phone','school','grade','parent','gender'].forEach(f=>{if(r[f]&&!ex[f])ch.push({phone:'電話',school:'學校',grade:'年級',parent:'家長',gender:'性別'}[f])});
      if(ch.length){r.act='update';r.why=ch.join('、')}else{r.act='skip';r.why='已在本班，沒有新資料'}
    }else{r.act='join';r.why=ex.status==='left'?'已退班的學生，將加入本班並恢復在學':'名冊已有同名學生，直接加入本班'}
    if((r.act==='new'||r.act==='join')&&r.seat==null){
      do{max++}while(taken[max]);
      r.seat=max;r.auto=true;taken[max]=ex?ex.id:'new';
    }
  });
  return plan;
}

const BULK_ACT={new:['新增','green'],join:['加入本班','blue'],update:['更新','amber'],skip:['略過','']};
function bulkPreview(){
  const c=BULK&&classOf(BULK.cid);if(!c||!BULK.rows){closeSheet();return}

    const why=r.act==='skip'||r.act==='update'||r.act==='join'?r.why:'';

  }).join('')+'</div>';
  b+='<p class="tiny faint" style="margin-top:8px">淡色的座號是自動接在後面編的號碼。</p>';
  sheet('確認匯入',b,'<button class="btn grow" data-a="bulkBack">返回修改</button><button class="btn pri grow" data-a="bulkGo"'+(todo?'':' disabled')+'>匯入 '+todo+' 位</button>');
}
ACT.bulkBack=()=>{blurAll();bulkSheet()};
ACT.bulkGo=()=>{
  if(!BULK||!BULK.rows)return;
  const cid=BULK.cid,rows=BULK.rows.filter(r=>r.act!=='skip');
  if(!rows.length){toast('沒有可匯入的學生');return}
  const cnt={new:0,join:0,update:0};
  bulkRun(()=>rows.forEach(r=>{
    cnt[r.act]++;
    if(r.act==='new'){
      put('students',uid('s'),{name:r.name,school:r.school,grade:r.grade,parent:r.parent,phone:r.phone,gender:r.gender,note:r.note,classIds:[cid],seats:{[cid]:r.seat},status:'active',createdAt:todayS()});
      return;

    if(r.act==='join')part.classIds=(ex.classIds||[]).concat([cid]);
    if(r.seat!=null)part.seats={[cid]:r.seat};
    ['phone','school','grade','parent','gender'].forEach(f=>{if(r[f]&&!ex[f])part[f]=r[f]});
    if(ex.status==='left')part.status='active';

};

  patch('exams',el.dataset.id,{scores:{[el.dataset.s]:n}});
};

/* ===== 手工產生 Excel（.xlsx）與 Word（.docx）檔 =====
   兩種檔案其實都是 ZIP 壓縮包裝著幾個 XML，這裡不依賴任何函式庫：
   · zipStore：只「存放」不壓縮的 ZIP（檔案小，不需要壓縮），自己算 CRC32。
   · xlsxBuild／docxBuild：吃同一份表格資料 {title, meta, head, rows, sums, …}，各自轉成檔案。
   儲存格值：數字 → 數字格式；字串 → 文字。*/
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC_T[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
function zipStore(files,mime){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const now=new Date(),dt=((Math.max(1980,now.getFullYear())-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate(),tm=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);
  const u16=(a,v)=>{a.push(v&255,(v>>8)&255)},u32=(a,v)=>{a.push(v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255)};
  files.forEach(f=>{
    const nm=enc.encode(f.name),d=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(d);
    const h=[];u32(h,0x04034b50);u16(h,20);u16(h,0x0800);u16(h,0);u16(h,tm);u16(h,dt);u32(h,crc);u32(h,d.length);u32(h,d.length);u16(h,nm.length);u16(h,0);
    parts.push(new Uint8Array(h),nm,d);
    const c=[];u32(c,0x02014b50);u16(c,20);u16(c,20);u16(c,0x0800);u16(c,0);u16(c,tm);u16(c,dt);u32(c,crc);u32(c,d.length);u32(c,d.length);u16(c,nm.length);u16(c,0);u16(c,0);u16(c,0);u16(c,0);u32(c,0);u32(c,off);
    cd.push(new Uint8Array(c),nm);
    off+=h.length+nm.length+d.length;
  });
  let cs=0;cd.forEach(x=>{cs+=x.length});
  const e=[];u32(e,0x06054b50);u16(e,0);u16(e,0);u16(e,files.length);u16(e,files.length);u32(e,cs);u32(e,off);u16(e,0);
  return new Blob(parts.concat(cd,[new Uint8Array(e)]),{type:mime||'application/zip'});
}
const xe=s=>String(s==null?'':s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const XML_H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
const MIME_XLSX='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
const MIME_DOCX='application/vnd.openxmlformats-officedocument.wordprocessingml.document';
const xlsCol=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};

/* spec: {sheet, title, meta, head:[字串], types:['n'|'l'|'g'|'f'…每欄一個], widths:[字元寬], rows:[[…]], sums:[[…]], notes:[字串], land}
   types：n＝置中整數／文字、l＝靠左文字、g＝置中數字（一般）、f＝置中數字（一位小數）*/
function xlsxBuild(spec){
  const nc=spec.head.length,last=xlsCol(nc-1);
  const S={title:1,meta:2,head:3,txt:4,left:5,num:6,dec:7,sl:8,sn:9,sd:10,note:11};
  const styles=XML_H+'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<numFmts count="1"><numFmt numFmtId="164" formatCode="0.0"/></numFmts>'+
    '<fonts count="4"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="16"/><name val="Calibri"/></font><font><sz val="10"/><color rgb="FF555555"/><name val="Calibri"/></font></fonts>'+
    '<fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE6E8EC"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF3F4F6"/><bgColor indexed="64"/></patternFill></fill></fills>'+
    '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FF9AA0AA"/></left><right style="thin"><color rgb="FF9AA0AA"/></right><top style="thin"><color rgb="FF9AA0AA"/></top><bottom style="thin"><color rgb="FF9AA0AA"/></bottom><diagonal/></border></borders>'+
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
    '<cellXfs count="12">'+
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+
    '<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>'+
    '<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment horizontal="left" vertical="center"/></xf>'+
    '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>'+
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>'+
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="center" wrapText="1"/></xf>'+
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>'+
    '<xf numFmtId="164" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>'+
    '<xf numFmtId="0" fontId="1" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>'+
    '<xf numFmtId="0" fontId="1" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>'+
    '<xf numFmtId="164" fontId="1" fillId="3" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>'+
    '<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment horizontal="left" vertical="top"/></xf>'+
    '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  const cell=(r,c,v,s)=>{
    const ref=xlsCol(c)+r;
    if(typeof v==='number'&&isFinite(v))return '<c r="'+ref+'" s="'+s+'"><v>'+v+'</v></c>';
    if(v===''||v==null)return '<c r="'+ref+'" s="'+s+'"/>';
    return '<c r="'+ref+'" s="'+s+'" t="inlineStr"><is><t xml:space="preserve">'+xe(v)+'</t></is></c>';
  };
  const merges=[];let r=1,sd='';
  const textRow=(txt,st,h)=>{sd+='<row r="'+r+'"'+(h?' ht="'+h+'" customHeight="1"':'')+'>'+cell(r,0,txt,st)+'</row>';merges.push('A'+r+':'+last+r);r++};
  textRow(spec.title,S.title,30);
  if(spec.meta)textRow(spec.meta,S.meta,20);
  r++;                                       /* 空一列 */
  const headRow=r;
  sd+='<row r="'+r+'" ht="30" customHeight="1">'+spec.head.map((h,i)=>cell(r,i,h,S.head)).join('')+'</row>';r++;
  /* 估算一列需要幾行：全形字算 2 個字元寬，除以欄寬 */
  const vlen=s=>Array.from(String(s==null?'':s)).reduce((a,ch)=>a+(ch.charCodeAt(0)>255?2:1),0);
  const rowH=row=>{let n=1;spec.head.forEach((h,i)=>{if(spec.types[i]==='l'&&row[i]!=null&&row[i]!=='')n=Math.max(n,Math.ceil(vlen(row[i])/Math.max(4,(spec.widths[i]||10)-2)))});return n<=1?22:Math.min(160,n*16+6)};
  const dataStyle=t=>t==='l'?S.left:t==='g'?S.num:t==='f'?S.dec:S.txt;
  const sumStyle=(t,i)=>i===0||t==='n'||t==='l'?S.sl:t==='f'?S.sd:S.sn;
  spec.rows.forEach(row=>{sd+='<row r="'+r+'" ht="'+rowH(row)+'" customHeight="1">'+spec.head.map((h,i)=>cell(r,i,row[i],dataStyle(spec.types[i]))).join('')+'</row>';r++});
  (spec.sums||[]).forEach(row=>{sd+='<row r="'+r+'" ht="22" customHeight="1">'+spec.head.map((h,i)=>cell(r,i,row[i],sumStyle(spec.types[i],i))).join('')+'</row>';r++});
  (spec.notes||[]).forEach((n,i)=>{if(i===0)r++;textRow(n,S.note,18)});
  const cols='<cols>'+spec.widths.map((w,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join('')+'</cols>';
  const sheet=XML_H+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
    '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><dimension ref="A1:'+last+(r-1)+'"/>'+
    '<sheetViews><sheetView workbookViewId="0" showGridLines="0"><pane ySplit="'+headRow+'" topLeftCell="A'+(headRow+1)+'" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A'+(headRow+1)+'" sqref="A'+(headRow+1)+'"/></sheetView></sheetViews>'+
    '<sheetFormatPr defaultRowHeight="18"/>'+cols+'<sheetData>'+sd+'</sheetData>'+
    '<mergeCells count="'+merges.length+'">'+merges.map(m=>'<mergeCell ref="'+m+'"/>').join('')+'</mergeCells>'+
    '<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="'+(spec.land?'landscape':'portrait')+'" fitToWidth="1" fitToHeight="0"/></worksheet>';
  const nm=String(spec.sheet||'成績').replace(/[\[\]:*?\/\\]/g,' ').slice(0,31);
  return zipStore([
    {name:'[Content_Types].xml',data:XML_H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
    {name:'_rels/.rels',data:XML_H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml',data:XML_H+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="'+xe(nm)+'" sheetId="1" r:id="rId1"/></sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels',data:XML_H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:'xl/styles.xml',data:styles},
    {name:'xl/worksheets/sheet1.xml',data:sheet}
  ],MIME_XLSX);
}

/* spec: {title, sub, meta, head, rows, sums, widths（相對寬度）, aligns:['c'|'l'…], notes:[字串], sign, land}  */
function docxBuild(spec){
  const land=!!spec.land,PW=land?16838:11906,PH=land?11906:16838,MG=land?850:850,TW=PW-2*MG;
  const sw=spec.widths.reduce((a,b)=>a+b,0),gw=spec.widths.map(w=>Math.round(TW*w/sw));
  const run=(t,o)=>{o=o||{};return '<w:r><w:rPr>'+(o.b?'<w:b/>':'')+(o.color?'<w:color w:val="'+o.color+'"/>':'')+'<w:sz w:val="'+(o.sz||21)+'"/></w:rPr><w:t xml:space="preserve">'+xe(t)+'</w:t></w:r>'};
  const para=(t,o)=>{o=o||{};return '<w:p><w:pPr><w:spacing w:before="'+(o.before||0)+'" w:after="'+(o.after||0)+'"/><w:jc w:val="'+(o.jc||'left')+'"/></w:pPr>'+(t===''?'':run(t,o))+'</w:p>'};
  const brd=['top','left','bottom','right','insideH','insideV'].map(k=>'<w:'+k+' w:val="single" w:sz="4" w:space="0" w:color="777777"/>').join('');
  const tc=(i,t,o)=>{o=o||{};const al=o.head?'center':(spec.aligns[i]==='l'?'left':'center');
    return '<w:tc><w:tcPr><w:tcW w:w="'+gw[i]+'" w:type="dxa"/>'+(o.fill?'<w:shd w:val="clear" w:color="auto" w:fill="'+o.fill+'"/>':'')+'<w:vAlign w:val="center"/></w:tcPr><w:p><w:pPr><w:spacing w:before="40" w:after="40"/><w:jc w:val="'+al+'"/></w:pPr>'+(t===''||t==null?'':run(t,{b:o.b,sz:o.sz||20}))+'</w:p></w:tc>'};
  let tbl='<w:tbl><w:tblPr><w:tblW w:w="'+TW+'" w:type="dxa"/><w:jc w:val="center"/><w:tblBorders>'+brd+'</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="60" w:type="dxa"/><w:right w:w="60" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>'+gw.map(w=>'<w:gridCol w:w="'+w+'"/>').join('')+'</w:tblGrid>';
  tbl+='<w:tr><w:trPr><w:cantSplit/><w:tblHeader/></w:trPr>'+spec.head.map((h,i)=>tc(i,h,{head:1,b:1,fill:'E6E8EC'})).join('')+'</w:tr>';
  spec.rows.forEach(row=>{tbl+='<w:tr><w:trPr><w:cantSplit/></w:trPr>'+spec.head.map((h,i)=>tc(i,row[i],{b:i===2})).join('')+'</w:tr>'});
  (spec.sums||[]).forEach(row=>{tbl+='<w:tr><w:trPr><w:cantSplit/></w:trPr>'+spec.head.map((h,i)=>tc(i,row[i],{b:1,fill:'F3F4F6'})).join('')+'</w:tr>'});
  tbl+='</w:tbl>';
  let body=para(spec.title,{b:1,sz:36,jc:'center',after:40});
  if(spec.sub)body+=para(spec.sub,{sz:26,jc:'center',color:'334155',after:60});
  if(spec.meta)body+=para(spec.meta,{sz:19,jc:'center',color:'555555',after:160});
  body+=tbl;
  (spec.notes||[]).forEach((n,i)=>{body+=para(n,{sz:18,color:'555555',before:i===0?140:20})});
  if(spec.sign)body+=para(spec.sign,{sz:21,jc:'right',before:420});
  const doc=XML_H+'<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+
    '<w:sectPr><w:pgSz w:w="'+PW+'" w:h="'+PH+'"'+(land?' w:orient="landscape"':'')+'/><w:pgMar w:top="'+MG+'" w:right="'+MG+'" w:bottom="'+MG+'" w:left="'+MG+'" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>';
  const styles=XML_H+'<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="Microsoft JhengHei" w:cs="Calibri"/><w:sz w:val="21"/><w:lang w:val="en-US" w:eastAsia="zh-TW"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>'+
    '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>'+
    '<w:style w:type="table" w:default="1" w:styleId="TableNormal"><w:name w:val="Normal Table"/><w:uiPriority w:val="99"/><w:semiHidden/><w:unhideWhenUsed/><w:tblPr><w:tblInd w:w="0" w:type="dxa"/><w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="108" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="108" w:type="dxa"/></w:tblCellMar></w:tblPr></w:style></w:styles>';
  return zipStore([
    {name:'[Content_Types].xml',data:XML_H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>'},
    {name:'_rels/.rels',data:XML_H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'},
    {name:'word/_rels/document.xml.rels',data:XML_H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:'word/document.xml',data:doc},
    {name:'word/styles.xml',data:styles}
  ],MIME_DOCX);
}

/* ===== 段考：各科成績、作文（6 級分／百分制）、總分／平均／名次、備註、成績單匯出 =====
   資料：
   · settings.termCfg[段考名稱] = {scale:'g6'|'p100', date:'YYYY-MM-DD'}（作文計分方式與測驗日期，每次段考各自設定）
   · school/{學生}_{t序號} = {sid,term,cid,date,scores:{科目:分數},essay:{g:級分,p:百分},memo:'備註'}
     作文的 6 級分與百分制分開存放，切換計分方式不會弄丟另一種的輸入。
   · 作文不併入總分與平均（和 AI Studio 版相同）；名次依平均分數排序，同分同名次。*/
IC.doc='<path d="M6.5 3.5h7.5l4 4V20a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5z"/><path d="M14 3.5V8h4M9 12.5h6M9 16h6"/>';
const ESSAY={g6:{lab:'6 級分制',unit:'級分',max:6},p100:{lab:'百分制',unit:'分',max:100}};
const termCfg=t=>((settings().termCfg||{})[t])||{};
const termScale=t=>termCfg(t).scale==='p100'?'p100':'g6';
const termDate=t=>termCfg(t).date||'';
const termIdx=t=>termList().indexOf(t);
const essayOf=(rec,scale)=>{const e=rec&&rec.essay,v=e&&(scale==='g6'?e.g:e.p);return typeof v==='number'?v:null};
const r1=x=>x==null?'':Math.round(x*10)/10;

/* 某班某次段考的所有數字：每位學生的各科、作文、總分、平均、名次，以及各欄的全班平均／最高／最低 */
function termCalc(cid,T){
  const subs=subjectList(),tk='t'+termIdx(T),scale=termScale(T);
  const rows=rosterOf(cid).map(s=>{
    const rec=S.school[s.id+'_'+tk]||{},sc=rec.scores||{};
    const vals=subs.map(x=>typeof sc[x]==='number'?sc[x]:null),got=vals.filter(v=>v!=null),tot=got.reduce((a,b)=>a+b,0);
    return {s:s,seat:seatOf(s,cid),vals:vals,essay:essayOf(rec,scale),total:got.length?tot:null,count:got.length,avg:got.length?tot/got.length:null,memo:rec.memo||'',rank:null};
  });
  const ranked=rows.filter(r=>r.avg!=null).sort((a,b)=>b.avg-a.avg);
  ranked.forEach((r,i)=>{r.rank=i>0&&Math.round(r.avg*1e6)===Math.round(ranked[i-1].avg*1e6)?ranked[i-1].rank:i+1});
  const col=f=>rows.map(f).filter(v=>v!=null);
  const st=a=>a.length?{avg:a.reduce((x,y)=>x+y,0)/a.length,max:Math.max.apply(null,a),min:Math.min.apply(null,a),n:a.length}:null;
  return {c:classOf(cid),T:T,scale:scale,date:termDate(T),subs:subs,rows:rows,
    stat:{subs:subs.map((x,j)=>st(col(r=>r.vals[j]))),essay:st(col(r=>r.essay)),total:st(col(r=>r.total)),avg:st(col(r=>r.avg))}};
}
const termMeta=d=>[d.T].concat(d.date?['測驗日期：'+fmtFull(d.date)]:[],['人數：'+d.rows.length+' 人','作文：'+ESSAY[d.scale].lab]);
const TERM_NOTE='總分與平均只計各科合計，作文另計、不併入；名次依平均排序，同分同名次，尚未登記任何科目的學生不排名。';

/* 匯出用的表格資料（Excel／Word／CSV／列印共用）：by＝'seat'（座號順序）或 'rank'（名次順序） */
function termTable(d,by){
  const rows=by==='rank'?d.rows.slice().sort((a,b)=>(a.rank==null)-(b.rank==null)||((a.rank||0)-(b.rank||0))):d.rows;
  const head=['名次','座號','姓名','學校'].concat(d.subs,['作文（'+ESSAY[d.scale].unit+'）','總分','平均','備註']);
  const types=['n','n','l','l'].concat(d.subs.map(()=>'g'),['g','g','f','l']);
  const body=rows.map(r=>[r.rank==null?'':r.rank,r.seat==null?'':r.seat,r.s.name,r.s.school||''].concat(r.vals.map(v=>v==null?'':v),[r.essay==null?'':r.essay,r.total==null?'':r1(r.total),r.avg==null?'':r1(r.avg),r.memo]));
  const sums=[['全班平均','avg'],['最高分','max'],['最低分','min']].map(x=>{
    const f=o=>o?r1(o[x[1]]):'';
    return ['',  '', x[0], ''].concat(d.stat.subs.map(f),[f(d.stat.essay),f(d.stat.total),f(d.stat.avg),'']);
  });
  return {head:head,types:types,rows:body,sums:sums,meta:termMeta(d).join('　｜　'),
    widths:[6,6,12,20].concat(d.subs.map(()=>9),[14,9,9,34]),
    file:ledFile(d.c.name+'-'+d.T+'-段考成績單')};
}
function termSpec(d,by){
  const t=termTable(d,by),hasSch=d.rows.some(r=>r.s.school),hasMemo=d.rows.some(r=>r.memo);
  const w=[1,1,2.4,3.2].concat(d.subs.map(()=>1.35),[1.7,1.5,1.5,4.6]);
  const keep=t.head.map((h,i)=>!((i===3&&!hasSch)||(i===t.head.length-1&&!hasMemo)));
  const pick=a=>a.filter((x,i)=>keep[i]);
  const heads=pick(t.head).map(h=>h==='作文（級分）'?'作文\n級分':h==='作文（分）'?'作文\n百分':h);
  const aligns=pick(t.head).map((h,i,a)=>h==='姓名'?'l':h==='學校'||h==='備註'?'l':'c');
  const cols=pick(w).map((x,i)=>({h:heads[i],w:x,a:aligns[i],b:heads[i]==='姓名',wrap:heads[i]==='備註'}));
  const rows=t.rows.map(r=>pick(r).map(String));
  const sums=t.sums.map(r=>{const a=pick(r).map(String);a.sum=true;return a});
  return {name:t.file,landscape:cols.length>14,title:d.c.name+'　段考成績表',meta:termMeta(d),cols:cols,rows:rows.concat(sums),
    foot:[{t:TERM_NOTE,small:true}],sign:[['任課老師簽名',46],['日期',28]],stamp:ledStamp(),rhMin:6.6,rhMax:9.4,rhHard:6.0,fs:3.4,zebra:true};
}

VIEWS.mk=()=>{
  const sub=NAV.sub.mk||'pending';
  const all=mkAll().filter(m=>m.status!=='void');
  const cnt=k=>all.filter(m=>m.status===k).length;
  const L=all.filter(m=>m.status===sub);
  const key=m=>sub==='scheduled'?(m.schedDate||'9'):(m.date||'9');
  L.sort((a,b)=>sub==='done'?((a.doneDate||'')<(b.doneDate||'')?1:-1):(key(a)<key(b)?-1:key(a)>key(b)?1:0));

/* ===== 拍照掃描與歸類（照片存於雲端私人空間） ===== */
const SCANQ=[];
function refreshPage(){NAV.pk='';render()}
async function shrink(f){
  try{
    if(!window.createImageBitmap)return f;
    const bm=await createImageBitmap(f);
    const k=Math.min(1,1800/Math.max(bm.width,bm.height));
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(bm.width*k));c.height=Math.max(1,Math.round(bm.height*k));
    c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.84));
    return b||f;
  }catch(e){return f}
}
const imgOrPh=(u,alt)=>u?'<img src="'+esc(u)+'" alt="'+esc(alt||'')+'" loading="lazy">':ic('image',28);
const safeName=s=>String(s||'檔案').replace(/[\\/:*?"<>|]/g,'_').slice(0,60);
function storageMsg(e){
  const m=String((e&&e.message)||'');
  if(/row-level|policy|permission|not allowed|unauthorized|403/i.test(m))return '沒有上傳權限，請重新登入後再試';
  if(/too large|exceed|payload|413/i.test(m)||String((e&&e.statusCode)||'')==='413')return '圖片太大，請改用較小的照片';
  if(/quota|storage limit|full/i.test(m))return '雲端空間已滿，請刪除不需要的檔案';
  if(isNet(e))return '網路連線失敗，圖片未上傳';
  return '上傳失敗，請再試一次';
}
/* 逐張上傳到 scans/<使用者 id>/ 底下，回傳成功的路徑 */
async function uploadArr(items){
  const paths=[];let failed=0,msg='';
  for(const x of items){
    const path=WS()+'/'+uid('p')+'.jpg';
    try{
      const {error}=await sync.client.storage.from(BUCKET).upload(path,x.blob,{contentType:'image/jpeg',cacheControl:'3600',upsert:false});
      if(error)throw error;
      paths.push(path);
    }catch(e){failed++;msg=msg||storageMsg(e)}
  }
  if(failed)toast(msg+(failed>1?'（另有 '+(failed-1)+' 張未上傳）':''),3200);
  return paths;
}
async function uploadInto(id,items){
  const paths=await uploadArr(items);
  if(!paths.length)return;
  const x=getD('scans',id);
  patch('scans',id,{pages:((x&&x.pages)||[]).concat(paths)});
  items.forEach(q=>URL.revokeObjectURL(q.url));
  refreshPage();toast('已新增 '+paths.length+' 頁');
}
async function pickedFiles(el){
  const files=Array.from(el.files||[]);el.value='';
  if(!files.length)return [];
  const out=[];
  for(const f of files){const b=await shrink(f);out.push({blob:b,url:URL.createObjectURL(b)})}
  return out;
}
function removePhotos(paths){
  if(!sync.client||!paths||!paths.length)return;
  try{sync.client.storage.from(BUCKET).remove(paths).catch(()=>{})}catch(e){}
}

/* ===== 像 App 一樣不能縮放 + 全螢幕照片檢視器 ===== */

/* 1) iPhone Safari 的雙指縮放手勢（gesture 事件）一律擋掉；多指拖曳也不讓頁面縮放。
      注意：不能對 touchend 做 preventDefault，不然連續快點會被吞掉。 */
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>{e.preventDefault()},{passive:false}));
document.addEventListener('touchmove',e=>{
  if(!e.touches||e.touches.length<2||!e.cancelable)return;
  if(e.target&&e.target.closest&&e.target.closest('#pvw'))return;
  e.preventDefault();
},{passive:false});

/* 2) 全螢幕照片檢視器：雙指縮放、拖曳、連點兩下放大／還原、左右滑換頁、往下拉關閉 */
const PV={on:false,urls:[],map:[],i:0,s:1,x:0,y:0,max:8,dbl:2.6,ptr:new Map(),mode:null,base:null,sw:null,multi:false,last:null,scan:null,t:0};
const pvRoot=()=>document.getElementById('pvw');
const pvImg=()=>pvRoot().querySelector('.st img');
const pvClamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function pvBox(){
  const st=pvRoot().querySelector('.st'),im=pvImg(),r=st.getBoundingClientRect();
  const W=r.width,H=r.height,nw=im.naturalWidth||W,nh=im.naturalHeight||H,f=Math.min(W/nw,H/nh);
  return {W,H,dw:nw*f,dh:nh*f,cx:r.left+W/2,cy:r.top+H/2};
}
function pvFit(){
  const b=pvBox(),mx=Math.max(0,(b.dw*PV.s-b.W)/2),my=Math.max(0,(b.dh*PV.s-b.H)/2);
  PV.x=pvClamp(PV.x,-mx,mx);PV.y=pvClamp(PV.y,-my,my);
}
function pvApply(anim,ox,oy){
  const im=pvImg();
  if(anim){im.classList.add('anim');clearTimeout(PV.t);PV.t=setTimeout(()=>{im.classList.remove('anim')},260)}
  else{clearTimeout(PV.t);im.classList.remove('anim')}
  im.style.transform='translate3d('+(PV.x+(ox||0))+'px,'+(PV.y+(oy||0))+'px,0) scale('+PV.s+')';
  pvRoot().classList.toggle('zm',PV.s>1.05);
}
function pvZoomAt(cx,cy,s2,anim){
  const b=pvBox(),qx=(cx-b.cx-PV.x)/PV.s,qy=(cy-b.cy-PV.y)/PV.s;
  PV.s=pvClamp(s2,1,PV.max);
  if(PV.s<1.001){PV.s=1;PV.x=0;PV.y=0}
  else{PV.x=cx-b.cx-qx*PV.s;PV.y=cy-b.cy-qy*PV.s;pvFit()}
  pvApply(anim);
}
function pvReset(anim){PV.s=1;PV.x=0;PV.y=0;pvApply(anim)}
function pvShow(i){
  const r=pvRoot(),n=PV.urls.length;
  PV.i=pvClamp(i,0,n-1);
  const im=pvImg();im.src=PV.urls[PV.i];im.alt='第 '+(PV.i+1)+' 張';
  pvReset(false);
  r.querySelector('.pvc').textContent=(PV.i+1)+' / '+n;
  r.querySelector('.pvc').hidden=n<2;
  r.querySelector('.pvl').hidden=n<2||PV.i<=0;
  r.querySelector('.pvr').hidden=n<2||PV.i>=n-1;
}
function pvMake(){
  let r=pvRoot();if(r)return r;
  r=document.createElement('div');r.id='pvw';
  r.tabIndex=-1;r.setAttribute('role','dialog');r.setAttribute('aria-modal','true');r.setAttribute('aria-label','照片檢視');
  r.innerHTML='<div class="st"><img alt="" draggable="false"></div>'+
    '<div class="pvc" hidden></div>'+
    '<button class="pvb pvx" data-a="pvClose" aria-label="關閉">'+ic('x',22)+'</button>'+
    '<button class="pvb pvl" data-a="pvGo" data-n="-1" aria-label="上一張">'+ic('back',22)+'</button>'+
    '<button class="pvb pvr" data-a="pvGo" data-n="1" aria-label="下一張">'+ic('chev',22)+'</button>'+
    '<div class="pvh">雙指放大・拖曳移動・連點兩下放大</div>';
  (document.getElementById('app')||document.body).appendChild(r);
  const st=r.querySelector('.st');
  st.addEventListener('pointerdown',pvDown);
  st.addEventListener('pointermove',pvMove);
  st.addEventListener('pointerup',pvUp);
  st.addEventListener('pointercancel',pvUp);
  st.addEventListener('wheel',e=>{e.preventDefault();pvZoomAt(e.clientX,e.clientY,PV.s*Math.exp(-e.deltaY*0.0024),false)},{passive:false});
  st.addEventListener('contextmenu',e=>{if(e.pointerType==='mouse')e.preventDefault()});
  return r;
}
/* 手指數量改變時，重新決定現在是「雙指縮放」「拖曳」還是「滑動換頁」 */
function pvSync(){
  const pts=[...PV.ptr.values()];
  if(pts.length>=2){
    PV.multi=true;
    const a=pts[0],b=pts[1],bx=pvBox(),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    PV.mode='pinch';
    PV.base={d:Math.max(10,Math.hypot(a.x-b.x,a.y-b.y)),s:PV.s,qx:(mx-bx.cx-PV.x)/PV.s,qy:(my-bx.cy-PV.y)/PV.s};
    PV.sw=null;pvApply(false);
  }else if(pts.length===1){
    const p=pts[0];
    PV.mode=PV.s>1.01?'pan':'swipe';
    PV.base={px:p.x,py:p.y,x:PV.x,y:PV.y};PV.sw=null;
  }else PV.mode=null;
}
function pvDown(e){
  if(e.pointerType==='mouse'&&e.button!==0)return;
  try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}
  PV.ptr.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:Date.now(),moved:false});
  pvSync();
}
function pvMove(e){
  const p=PV.ptr.get(e.pointerId);if(!p)return;
  p.x=e.clientX;p.y=e.clientY;
  if(Math.hypot(p.x-p.sx,p.y-p.sy)>10)p.moved=true;
  if(PV.mode==='pinch'){
    const pts=[...PV.ptr.values()],a=pts[0],b=pts[1];if(!b)return;
    const bx=pvBox(),mx=(a.x+b.x)/2,my=(a.y+b.y)/2,d=Math.hypot(a.x-b.x,a.y-b.y);
    PV.s=pvClamp(PV.base.s*d/PV.base.d,1,PV.max);
    PV.x=mx-bx.cx-PV.base.qx*PV.s;PV.y=my-bx.cy-PV.base.qy*PV.s;
    pvFit();pvApply(false);
  }else if(PV.mode==='pan'){
    PV.x=PV.base.x+(p.x-PV.base.px);PV.y=PV.base.y+(p.y-PV.base.py);
    pvFit();pvApply(false);
  }else if(PV.mode==='swipe'){
    const dx=p.x-PV.base.px,dy=p.y-PV.base.py;
    PV.sw={dx,dy};
    if(p.moved)pvApply(false,dx*0.55,dy*0.55);
  }
}
function pvUp(e){
  const p=PV.ptr.get(e.pointerId);if(!p)return;
  PV.ptr.delete(e.pointerId);
  const now=Date.now(),tap=!p.moved&&!PV.multi&&now-p.t<380&&e.type==='pointerup';
  if(PV.mode==='swipe'&&!PV.ptr.size&&!PV.multi&&PV.sw&&e.type==='pointerup'){
    const {dx,dy}=PV.sw,n=PV.urls.length;
    if(Math.abs(dx)>64&&Math.abs(dx)>Math.abs(dy)*1.4&&n>1){
      PV.mode=null;PV.sw=null;
      const nx=PV.i+(dx<0?1:-1);
      if(nx>=0&&nx<n)pvShow(nx);else pvApply(true);
      return;
    }
    if(dy>110&&Math.abs(dy)>Math.abs(dx)*1.4){PV.mode=null;PV.sw=null;pvClose();return}
    pvApply(true);
  }
  if(tap){
    const l=PV.last;
    if(l&&now-l.t<330&&Math.hypot(e.clientX-l.x,e.clientY-l.y)<40){
      PV.last=null;
      if(PV.s>1.05)pvReset(true);else pvZoomAt(e.clientX,e.clientY,PV.dbl,true);
    }else PV.last={t:now,x:e.clientX,y:e.clientY};
  }
  if(!PV.ptr.size){
    PV.multi=false;PV.mode=null;PV.sw=null;
    if(PV.s<1.02)pvReset(true);else{pvFit();pvApply(true)}
  }else pvSync();
}
function pvOpen(urls,i,map,scan){
  if(!urls.length)return;
  const r=pvMake();
  PV.urls=urls;PV.map=map||urls.map((_,k)=>k);PV.scan=scan||null;PV.last=null;PV.ptr.clear();PV.mode=null;PV.multi=false;
  PV.on=true;
  r.classList.add('on');
  /* 重新觸發底部提示的淡出動畫 */
  const h=r.querySelector('.pvh');h.style.animation='none';void h.offsetWidth;h.style.animation='';
  pvShow(i||0);
  try{r.focus({preventScroll:true})}catch(_){}
}
function pvClose(){
  if(!PV.on)return;
  PV.on=false;
  const r=pvRoot();r.classList.remove('on','zm');
  const im=r.querySelector('.st img');im.removeAttribute('src');im.style.transform='';

}

/* 鍵盤：Esc 關閉；左右鍵換頁；+／- 放大縮小（桌機用）。用 capture 先處理，避免同時退回上一頁 */
