<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B0F14">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="班務通">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="補習班班務管理：點名、成績、班級、補課與掃描歸檔，雲端同步。">
<title>班務通</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* 深色主題：黑灰底、琥珀色主色，缺課與不及格用紅色，到課用綠色。不依賴外部字型，離線也能正常顯示。 */
:root{
  color-scheme:dark;
  --bg:#0B0F14; --grid:rgba(160,180,210,.035);
  --surface:#151C25; --surface2:#1C2531; --line:#263140; --line2:#364357;
  --ink:#EEF2F7; --ink2:#A7B2C2; --ink3:#72809A;
  --brand:#F2B25B; --brand-fg:#1A1206; --brand-soft:#3A2A12;
  --red:#FF7A6B; --red-soft:#3B1E1B;
  --green:#4ADE9A; --green-soft:#12322A;
  --amber:#F5B54A; --amber-soft:#3A2D12;
  --blue:#7AA7FF; --blue-soft:#1A2A46;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.42);
  --scrim:rgba(0,0,0,.6);
  --glass:rgba(21,28,37,.80);
  --c0:#7AA7FF; --c1:#3CC7B8; --c2:#F59E6B; --c3:#A78BFA; --c4:#F472B6; --c5:#A3D65C; --c6:#E6B95B; --c7:#94A3B8;
  --f-body:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-disp:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:16px; --r-s:12px; --tab-h:64px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background-color:var(--bg);
  background-image:radial-gradient(120% 55% at 50% -12%,rgba(242,178,91,.11),transparent 62%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:auto,22px 22px,22px 22px;background-attachment:fixed;
  color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 16px);min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--glass)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{opacity:.42;cursor:default}
h1,h2,h3,p{margin:0}
a{color:var(--brand)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .small{font-size:13px} .tiny{font-size:12px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{display:block;flex:none}

/* 頂部列（毛玻璃） */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:54px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1}
.brand b{font-weight:800;font-size:20px;letter-spacing:.02em;color:var(--brand);white-space:nowrap}
.brand span{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:15px;font-size:12px;font-weight:600;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap;transition:background-color .25s,color .25s}
.pill .ic{flex:none}
.pill.ok{color:var(--green);background:var(--green-soft);border-color:transparent}
.pill.warn{color:var(--amber);background:var(--amber-soft);border-color:transparent}
.pill.bad{color:var(--red);background:var(--red-soft);border-color:transparent}
.pill.spin .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 內容區 */
#view{padding-block:14px 8px}

/* 底部分頁（毛玻璃，四個分頁） */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--ink3);position:relative;min-width:0;text-align:center;transition:color .2s}
.tab .ic{transition:transform .25s var(--ease)}
.tab:active .ic{transform:scale(.88)}
.tab.on{color:var(--brand);font-weight:700}
.tab.on .ic{transform:translateY(-1px)}
.tab::before{content:"";position:absolute;top:0;left:50%;width:28px;height:3px;margin-left:-14px;border-radius:0 0 3px 3px;background:var(--brand);transform:scaleX(0);transition:transform .3s var(--ease)}
.tab.on::before{transform:scaleX(1)}
.tab i{position:absolute;top:6px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font:600 10px/17px var(--f-mono);text-align:center;font-style:normal;padding:0 4px}

/* 全螢幕細節頁（從右側滑入） */
.page{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background-color:var(--bg);animation:slide .26s var(--ease)}
@keyframes slide{from{transform:translateX(32px);opacity:0}to{transform:none;opacity:1}}
.ph{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);flex:none}
.ph .wrap{display:flex;align-items:center;gap:4px;min-height:54px;padding-left:max(8px,env(safe-area-inset-left,0px))}
.ph h2{flex:1;min-width:0;font:700 17px/1.3 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pb .wrap{padding-block:14px 32px}
.pf{background:var(--glass);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);flex:none}
.pf .wrap{display:flex;gap:10px;padding-block:10px}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;color:var(--ink);flex:none;transition:background-color .15s,transform .12s}
.ib:active{background:var(--surface2);transform:scale(.94)}
.ib.t{width:auto;padding:0 12px;border-radius:22px;font-weight:700;color:var(--brand);gap:6px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 卡片與清單 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card.pad{padding:14px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 8px}
.sec:first-child{margin-top:0}
.sec h3{font:700 13px/1.3 var(--f-body);letter-spacing:.08em;color:var(--ink2)}
.sec .lnk{font-size:13px;font-weight:700;color:var(--brand);padding:4px 2px}
.rows>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;min-height:56px;background:var(--surface)}
button.row:active{background:var(--surface2)}
.row .main{flex:1;min-width:0}
.row .t1{font-weight:700;line-height:1.35}
.row .t2{font-size:13px;color:var(--ink2);line-height:1.4}
.row .end{flex:none;display:flex;align-items:center;gap:8px;color:var(--ink3);font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:900 16px/1 var(--f-disp);color:#fff;background:var(--c,var(--brand))}
.av.sm{width:30px;height:30px;font-size:13px}
.av.lg{width:56px;height:56px;font-size:24px}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.badge.blue{background:var(--brand-soft);color:var(--brand)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.empty{text-align:center;padding:34px 18px;color:var(--ink2)}
.empty .ic{margin:0 auto 10px;color:var(--ink3)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.note{padding:10px 12px;border-radius:var(--r-s);background:var(--amber-soft);color:var(--amber);font-size:13px;line-height:1.5}
.note.blue{background:var(--brand-soft);color:var(--brand)}
.note.red{background:var(--red-soft);color:var(--red)}

/* 按鈕與表單 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--surface);border:1px solid var(--line2);color:var(--ink);white-space:nowrap}
.btn:active{background:var(--surface2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.btn.pri:active{filter:brightness(.92);background:var(--brand)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn.grow{flex:1}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label,.lab{font-size:13px;font-weight:700;color:var(--ink2)}
.in{width:100%;min-width:0;height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:inherit}
textarea.in{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.5}
select.in{appearance:auto}
.in::placeholder{color:var(--ink3)}
.in:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:360px){.two,.three{grid-template-columns:1fr}}
.search{position:relative}
.search .ic{position:absolute;left:12px;top:12px;color:var(--ink3);pointer-events:none}
.search .in{padding-left:38px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:17px;background:var(--surface);border:1px solid var(--line2);font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-fg);font-weight:700}
.chip b{font:600 11px var(--f-mono)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{height:34px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink2);text-align:center;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wdays button{height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-weight:700;text-align:center;color:var(--ink2)}
.wdays button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line2)}
.swatches button.on{box-shadow:0 0 0 2.5px var(--ink)}
.slot{display:grid;grid-template-columns:78px 1fr 1fr 38px;gap:8px;align-items:center;margin-bottom:8px}
.slot .in{padding:0 8px}
@media (max-width:360px){.slot{grid-template-columns:70px 1fr 1fr 36px}}

/* 底部彈出視窗 */
.scrim{position:fixed;inset:0;z-index:70;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:560px;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);animation:up .22s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:6px 8px 6px max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);flex:none}
.sheet .sh h3{flex:1;font:700 17px/1.3 var(--f-body)}
.sheet .sb{padding:16px max(18px,env(safe-area-inset-right,0px)) 8px max(18px,env(safe-area-inset-left,0px));overflow-y:auto;overscroll-behavior:contain}
.sheet .sf{display:flex;gap:10px;padding:10px max(18px,env(safe-area-inset-right,0px)) 14px max(18px,env(safe-area-inset-left,0px));flex:none;border-top:1px solid var(--line)}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:86%}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 74px);z-index:90;max-width:calc(100% - 32px);padding:11px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;box-shadow:var(--shadow);animation:fade .15s ease-out;text-align:center}
.toast .tb{margin-left:12px;font-weight:700;color:var(--brand-soft);text-decoration:underline}

/* 今日 */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.hello .d{font:900 30px/1.1 var(--f-disp);letter-spacing:.01em}
.hello .w{font-size:13px;color:var(--ink2);margin-top:4px}
.sessions{display:flex;flex-direction:column;gap:10px}
.sess{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:stretch}
.sess .tm{text-align:right;padding-top:12px;font:600 13px/1.25 var(--f-mono);color:var(--ink2)}
.sess .tm small{display:block;font-size:11px;color:var(--ink3);font-weight:500}
.sess .cd{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:9px;min-width:0}
.sess.now .cd{box-shadow:0 0 0 2px var(--brand)}
.sess .cd .h{display:flex;align-items:center;gap:10px}
.sess .cd .h b{font-size:16px}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface2)}
.bar i{display:block;height:100%}
.bar .p{background:var(--green)}.bar .l{background:var(--amber)}.bar .v{background:var(--brand)}.bar .x{background:var(--red)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.todo{display:flex;flex-direction:column;gap:8px}
.todo .row{border:1px solid var(--line);border-radius:var(--r);padding:11px 14px}
.todo .row.late{border-color:var(--red);background:var(--red-soft)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.stat b{display:block;font:900 26px/1.1 var(--f-disp);color:var(--ink)}
.stat b.red{color:var(--red)}
.stat span{display:block;font-size:12px;color:var(--ink2);margin-top:3px}

/* 點名 */
.mkrow{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);min-height:60px}
.mkrow .nm{flex:1;min-width:0}
.mkrow .nm b{display:block;font-weight:700;line-height:1.3}
.mkrow .nm small{display:block;font-size:12px;color:var(--ink3)}
.mks{display:flex;gap:6px;flex:none}
.mk{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line2);background:var(--surface);font-weight:700;font-size:14px;color:var(--ink2);text-align:center}
.mk.p.on{background:var(--green);border-color:var(--green);color:#fff}
.mk.l.on{background:var(--amber);border-color:var(--amber);color:#fff}
.mk.v.on{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.mk.x.on{background:var(--red);border-color:var(--red);color:#fff}
@media (max-width:360px){.mk{width:38px;height:40px}.mks{gap:4px}}
.sum{display:flex;gap:6px;flex-wrap:wrap}
.sum .badge{height:26px;font-size:13px}
.datebar{display:flex;align-items:center;gap:6px}
.datebar .in{width:auto;flex:1;text-align:center;font-weight:700}

/* 班級與學生 */
.hero{display:flex;gap:14px;align-items:center;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
.hero h1{font:900 22px/1.25 var(--f-disp)}
.hero .meta{font-size:13px;color:var(--ink2);margin-top:3px}
.kv{display:grid;grid-template-columns:84px 1fr;gap:8px 12px;font-size:14px;padding:14px}
.kv dt{color:var(--ink3);font-size:13px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:0 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;min-width:max-content;padding:11px 14px;font-weight:700;color:var(--ink3);border-bottom:3px solid transparent;text-align:center;white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.cc{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r);width:100%;min-height:76px}
.cc .main{flex:1;min-width:0}
.cc b{font-size:17px;display:block}
.cc .s{font-size:13px;color:var(--ink2);margin-top:2px}
.cc .n{font:900 24px/1 var(--f-disp);text-align:right}
.cc .n small{display:block;font:500 11px var(--f-body);color:var(--ink3);margin-top:2px}
.list-gap{display:flex;flex-direction:column;gap:10px}
.hist{display:flex;flex-wrap:wrap;gap:6px}
.hist span{min-width:34px;height:30px;padding:0 6px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font:600 12px var(--f-mono);background:var(--surface2);color:var(--ink2)}
.hist .p{background:var(--green-soft);color:var(--green)}
.hist .l{background:var(--amber-soft);color:var(--amber)}
.hist .v{background:var(--brand-soft);color:var(--brand)}
.hist .x{background:var(--red-soft);color:var(--red)}

/* 成績 */
.scrow{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);min-height:56px}
.scrow .nm{flex:1;min-width:0;font-weight:700}
.scrow .nm small{display:block;font-weight:400;color:var(--ink3);font-size:12px}
.sc{width:84px;height:44px;border-radius:10px;border:1.5px solid var(--line2);background:var(--surface);text-align:center;font:700 18px var(--f-mono);color:var(--ink);flex:none}

<style>
/* 補充樣式：沿用原本的按鈕、列表與表格，再加上新版的點名首頁、速點、開場動畫 */
button.row,button.card,button.cc,button.shot{font:inherit;color:inherit;width:100%;text-align:left}
button.shot{width:auto}
.row .main>span{display:block}
.tb .sc{width:64px;height:38px;font-size:15px}
.slot .ib{width:38px;height:38px}
.pick button:disabled{opacity:.45;cursor:default}
.brand{min-width:0}
.top .brand span{display:block;min-width:0}
.mk-card .acts .btn{flex:0 0 auto}
.hero .av{flex:none}
.foot{text-align:center;margin-top:12px}
.btn{transition:transform .12s var(--ease),background-color .2s,border-color .2s}
.btn:active{transform:scale(.98)}
.card{box-shadow:0 1px 2px rgba(0,0,0,.25)}

/* 開場動畫：圖示彈出，名稱淡入，底部小進度條，完成後整體淡出 */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(90% 60% at 50% 35%,#1E2633 0%,#0B0F14 62%,#06080C 100%);transition:opacity .5s ease,transform .5s var(--ease)}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.spl-logo{width:112px;height:112px;border-radius:28px;display:flex;align-items:center;justify-content:center;animation:logoIn .8s var(--ease) both;box-shadow:0 18px 50px rgba(242,178,91,.22)}
.spl-logo svg{width:112px;height:112px;display:block}
.spl-name{font:800 30px/1 var(--f-body);color:var(--ink);letter-spacing:.06em;margin-top:8px;animation:nameIn .7s .25s var(--ease) both}
.spl-sub{font-size:13px;color:var(--ink3);animation:nameIn .7s .4s var(--ease) both}
.spl-bar{position:absolute;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:120px;height:3px;border-radius:2px;background:var(--surface2);overflow:hidden}
.spl-bar i{display:block;height:100%;width:40%;background:var(--brand);border-radius:2px;animation:load 1.4s var(--ease) infinite}
@keyframes logoIn{from{opacity:0;transform:scale(.55) rotate(-10deg)}60%{opacity:1;transform:scale(1.06) rotate(2deg)}to{opacity:1;transform:none}}
@keyframes nameIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(300%)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .34s var(--ease) both;animation-delay:min(calc(var(--i,0) * 35ms),420ms)}

/* 登入頁：沒有分頁按鈕時整條底部列一起隱藏 */
.tabbar:has(#tabbar:empty){display:none}
.login{max-width:420px;margin:28px auto 0;text-align:center}
.login-mark{width:72px;height:72px;margin:0 auto 14px;filter:drop-shadow(0 10px 24px rgba(242,178,91,.25))}
.login h2{font:800 24px/1.2 var(--f-body);margin-bottom:6px}
.login .card{text-align:left}
.note.red{background:var(--red-soft);color:var(--red)}

/* 點名首頁：日期列 */
.ahead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.ahead h1{font:800 26px/1.15 var(--f-body);letter-spacing:.01em}
.kicker{font-size:12px;color:var(--brand);font-weight:700;letter-spacing:.08em;margin-bottom:2px}
.dpick{width:auto;height:38px;font-size:13px;padding:0 10px;flex:none}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:0 0 14px}
.day{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink2);transition:transform .15s var(--ease),background-color .2s,border-color .2s;min-width:0}
.day small{font-size:11px}
.day b{font:700 16px/1.2 var(--f-body);color:var(--ink)}
.day:active{transform:scale(.93)}
.day.today:not(.on){border-color:var(--brand)}
.day.on{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.day.on b,.day.on small{color:var(--brand-fg)}
.day i{position:absolute;bottom:4px;width:4px;height:4px;border-radius:2px;background:var(--brand)}
.day.on i{background:var(--brand-fg)}

/* 點名首頁：班級摘要卡 */
.ahero{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:16px 16px 14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:4px}
.ahero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--brand))}
.ah-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ah-main{min-width:0;flex:1}
.ah-name{font:800 21px/1.25 var(--f-body);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ahero .sum{margin:0}
.bar.big{height:10px;border-radius:5px}
.ah-acts{display:flex;gap:10px}

/* 小考入口 */
.qstrip{display:flex;flex-direction:column;gap:8px;margin:12px 0 4px}
.qcard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);width:100%;text-align:left;color:var(--ink)}
.qcard .ic{color:var(--brand)}
.qcard .main{flex:1;min-width:0}
.qcard b{display:block;line-height:1.3}
.qcard small{color:var(--ink2);font-size:13px}
.qadd{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:var(--r);border:1.5px dashed var(--line2);color:var(--brand);font-weight:700;width:100%}

/* 學生列（一列一位：頭像、姓名與標記、四個符號、更多） */
.stusearch{margin:14px 0 10px}
.stusearch .in{padding-left:38px;height:44px}
.stulist{display:flex;flex-direction:column;gap:8px}
.stu{display:flex;align-items:center;gap:8px;min-height:60px;padding:10px 6px 10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);transition:border-color .2s}
.stu .nm{flex:1;min-width:0}
.stu .nm b{display:block;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stu .nm small{display:block;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ftag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--red-soft);color:var(--red);white-space:nowrap}
.fnote{font-size:11px;color:var(--ink2);background:var(--surface2);padding:1px 6px;border-radius:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stu .mks{gap:4px}
.stu .mk{width:36px;height:38px;border-radius:11px;font-size:13px;transition:background-color .18s,border-color .18s,color .18s,transform .12s var(--ease),box-shadow .18s}
.stu .mk:active{transform:scale(.9)}
.stu .mk.on{box-shadow:0 0 0 3px rgba(242,178,91,.18)}
.stu .mk.p.on{box-shadow:0 0 0 3px rgba(74,222,154,.18)}
.stu .mk.x.on{box-shadow:0 0 0 3px rgba(255,122,107,.2)}
.more{display:inline-flex;align-items:center;justify-content:center;width:28px;height:40px;border-radius:10px;color:var(--ink3);flex:none}
.more:active{background:var(--surface2)}
@media (max-width:360px){.stu .mk{width:32px;height:36px;font-size:12px}.stu .mks{gap:3px}}

/* 速點 */
.speed{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:6px}
.spp{display:flex;gap:10px;align-items:center}
.spname{font:800 46px/1.15 var(--f-body);letter-spacing:.02em;color:var(--ink);margin-top:14px;padding:0 6px;animation:rise .32s var(--ease) both;word-break:break-all}
.spsub{min-height:1.4em}
.spmks{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin:16px 0 8px}
.spk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:100px;border-radius:24px;border:1.5px solid var(--line2);background:var(--surface);transition:transform .12s var(--ease),background-color .2s,border-color .2s}
.spk:active{transform:scale(.95)}

.spk small{font-size:12px;opacity:.85}

.spk.l{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}

.spk.x{background:var(--red-soft);border-color:var(--red);color:var(--red)}

/* 違規與備註頁 */
.fhead{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.fname{font-size:20px;display:block;line-height:1.3}
.flagrow{width:100%;display:flex;align-items:center;gap:12px;min-height:54px;padding:12px 14px;text-align:left}
.flagrow .main{flex:1;min-width:0}
.flagrow .sw{width:44px;height:26px;border-radius:13px;background:var(--surface2);border:1px solid var(--line2);position:relative;flex:none;transition:background-color .2s,border-color .2s}

.flagrow.on{color:var(--red)}
.flagrow.on .sw{background:var(--red-soft);border-color:var(--red)}
.flagrow.on .sw::after{transform:translateX(18px);background:var(--red)}

/* 應用程式外框（修正 iPhone 主畫面模式下整頁上移、日期被頂部列蓋住的問題）：
   頂部列、中間內容、底部分頁依序固定排列，只有中間內容捲動，頁面本身不再捲動 */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background-attachment:scroll;padding-bottom:0}
body::before{display:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.top{position:relative;flex:none;padding-top:env(safe-area-inset-top,0px)}
#view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-block:14px 24px}
.tabbar{position:relative;flex:none;left:auto;right:auto;bottom:auto}

<style>
/* ===== 視覺層：iOS Liquid Glass 風格 =====
   參考 Google AI Studio 版的版型（深色底、琥珀主色、到/遲/假/缺四色），
   用半透明玻璃、折射高光、彈性動效取代原本的平面卡片。
   放在 p02b 之後，同樣的選擇器會以這裡為準。 */

:root{
  color-scheme:dark;
  --bg:#06080C;
  --ink:#F5F7FB; --ink2:#B7C0CF; --ink3:#7F8AA0;
  --glass-fill:rgba(255,255,255,.07);
  --glass-fill2:rgba(255,255,255,.12);
  --glass-edge:rgba(255,255,255,.15);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.2);
  --glass-shadow:0 12px 32px rgba(0,0,0,.34);
  --blur:blur(28px) saturate(170%);
  --surface:rgba(255,255,255,.06); --surface2:rgba(255,255,255,.1);
  --line:rgba(255,255,255,.085); --line2:rgba(255,255,255,.15);
  --brand:#F6B45E; --brand-2:#FFD28F; --brand-fg:#1C1307;
  --brand-soft:rgba(246,180,94,.17);
  --red:#FF7F70; --red-soft:rgba(255,127,112,.17);
  --green:#52E0A3; --green-soft:rgba(82,224,163,.17);
  --amber:#F7C04E; --amber-soft:rgba(247,192,78,.17);
  --blue:#82AEFF; --blue-soft:rgba(130,174,255,.17);
  --r:24px; --r-s:16px; --tab-h:62px;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --gold:linear-gradient(180deg,#FFD79A 0%,#F4A444 100%);
}

/* 背景：深色底加上三團柔和色光，玻璃才有東西可以折射 */
html{background:var(--bg)}
body{background:none;background-image:none;background-attachment:scroll}
body::before{display:block;content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60% 38% at 6% 0%,rgba(246,180,94,.30),transparent 72%),
    radial-gradient(52% 36% at 100% 28%,rgba(104,140,255,.22),transparent 72%),
    radial-gradient(60% 40% at 0% 100%,rgba(82,224,163,.14),transparent 72%),
    var(--bg)}

/* 修正：內容區被置中時會縮成內容寬度，這裡改成撐滿整個螢幕寬 */
#app{align-items:stretch}
#view{width:100%;max-width:none;margin:0;padding-block:12px 28px}
#view>.wrap,#view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 頂部列 */
.top{position:relative;top:auto;flex:none;padding-top:env(safe-area-inset-top,0px);background:rgba(10,13,19,.5);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--line)}
.top .wrap{min-height:58px;padding-top:4px;padding-bottom:4px}
.brand{align-items:center;gap:10px}
.brand-mark{width:28px;height:28px;flex:none;border-radius:8px;filter:drop-shadow(0 4px 10px rgba(246,180,94,.35))}
.brand b{font:800 19px/1 var(--f-body);letter-spacing:.02em;color:var(--ink)}
.brand span{color:var(--ink3)}
.pill{height:30px;border-radius:15px;background:var(--glass-fill);border:1px solid var(--line2);box-shadow:var(--glass-hi);color:var(--ink2)}
.pill.ok{background:var(--green-soft);border-color:rgba(82,224,163,.28);color:var(--green)}
.pill.warn{background:var(--amber-soft);border-color:rgba(247,192,78,.3);color:var(--amber)}
.pill.bad{background:var(--red-soft);border-color:rgba(255,127,112,.3);color:var(--red)}
.top .ib{width:40px;height:40px;border-radius:20px;background:var(--glass-fill);border:1px solid var(--line2);box-shadow:var(--glass-hi)}

/* 底部分頁：圓角玻璃膠囊。
   iPhone Pro Max 螢幕四角半徑約 62pt，膠囊半徑 31pt；膠囊離邊緣至少約 20pt，
   四角才不會被螢幕圓角切到，而且和螢幕弧線大致同心。想更靠邊或更離邊，只改 --dock-m。 */
.tabbar{--dock-m:20px;background:transparent;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;
  padding:2px max(var(--dock-m),env(safe-area-inset-left,0px)) var(--dock-m) max(var(--dock-m),env(safe-area-inset-right,0px))}
.tabbar .dock{position:relative;max-width:560px;height:var(--tab-h);margin:0 auto;padding-inline:6px;border-radius:32px;
  background:rgba(20,25,34,.52);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--glass-edge);box-shadow:var(--glass-hi),0 10px 28px rgba(0,0,0,.38)}
.tabbar .wrap{position:relative;z-index:1;max-width:none;height:100%;margin:0;padding:0;border:0;border-radius:0;background:none;box-shadow:none}
.tab{height:50px;margin:5px 0;border-radius:26px;gap:3px;font-size:11px;font-weight:600;color:var(--ink3);isolation:isolate}
.tab::before,.tab.on::before{display:none}
/* 目前所在的分頁：白色字＋透明玻璃滑塊（不再是黃色） */
.tab.on{color:var(--ink);font-weight:700}
.tab.on .ic{filter:drop-shadow(0 1px 6px rgba(255,255,255,.28))}
/* 單一個玻璃滑塊：點擊時沿著膠囊滑到新的分頁，滑動時像果凍一樣微微拉長再回彈。
   位置由 JS 設定 --i（第幾個分頁）；寬度 = 一個分頁寬度。 */
.gpill{position:absolute;top:5px;bottom:5px;left:6px;width:calc((100% - 12px) / var(--n,4));border-radius:26px;pointer-events:none;

/* ===== 學費 ===== */
.rowic{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:12px;flex:none;background:var(--glass-fill2);border:1px solid var(--line);color:var(--brand-2)}
.stat b.money{font-size:clamp(17px,5.2vw,24px);letter-spacing:-.01em;white-space:nowrap}
.stat b.green{color:var(--green)}
.stats.mini .stat{padding:10px}
.stats.mini .stat b.money{font-size:clamp(15px,4.6vw,20px)}
.pstep{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px;margin:0 0 14px;border-radius:24px;background:var(--glass-fill);border:1px solid var(--line2);box-shadow:var(--glass-hi)}
.pstep b{font:800 17px/1.2 var(--f-body)}
.pstep .ib{width:44px;height:44px;border-radius:19px;background:var(--glass-fill)}
.stu button.nm{display:block;text-align:left;background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;min-height:46px}
.tuamt{flex:none;text-align:right;line-height:1.25}
.tuamt b{display:block;font:800 15px/1.25 var(--f-body);color:var(--ink);white-space:nowrap}
.tuamt small{display:block;font-size:11.5px;color:var(--ink3)}
.tuamt.ok b{color:var(--green)}
.tuamt.part b{color:var(--amber)}
.tub{flex:none;height:40px;min-width:60px;padding:0 12px;border-radius:15px;font-size:14px;font-weight:800;text-align:center;white-space:nowrap;transition:transform .3s var(--spring)}
.tub.go{background:rgba(247,192,78,.2);border:1px solid rgba(247,192,78,.8);color:var(--amber);box-shadow:0 0 16px rgba(247,192,78,.22),inset 0 1px 0 rgba(255,255,255,.12)}
.tub:active{transform:scale(.9)}
.cc .n.money{font-size:19px}
.tuhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.tuname{font-size:18px}
.tuacts{display:flex;gap:8px;flex-wrap:wrap}
.payl{display:flex;flex-direction:column;gap:8px}
.payrow{display:flex;align-items:center;gap:8px;padding:8px 6px 8px 14px;border-radius:18px;background:var(--glass-fill);border:1px solid var(--line);box-shadow:var(--glass-hi)}
.payrow .main{flex:1;min-width:0}
.payrow .main b{display:block;font-size:16px}
.payrow .main small{display:block;font-size:12px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcpt{display:block;width:100%;height:auto;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
/* ===== 月總表 ===== */
.stat b .of{font-style:normal;font-size:.55em;font-weight:700;color:var(--ink3);margin-left:1px}
.ledact{display:flex;gap:10px;margin:0 0 12px}
.ledact .btn{min-width:0;padding:0 10px}
.ledlg{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:0 2px 10px;font-size:12px;color:var(--ink2)}
.ledlg span{display:inline-flex;align-items:center;gap:5px}
.ledlg i{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:8px;font-style:normal;font-weight:800;font-size:12px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.ledlg i.s{font-size:11px;color:var(--ink2);padding:0 4px}
.ledc .m.p,.ledlg i.m.p{color:var(--green)}
.ledc .m.l,.ledlg i.m.l{color:var(--amber)}
.ledc .m.v,.ledlg i.m.v{color:var(--blue)}
.ledc .m.x,.ledlg i.m.x{color:var(--red)}
.ledc .m.n{color:var(--ink3)}
.ledbox{overflow:auto;max-height:min(66vh,620px);border-radius:var(--r-s);border:1px solid var(--line2);background:rgba(10,13,19,.6);box-shadow:var(--glass-hi);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.led{border-collapse:separate;border-spacing:0;min-width:100%}
.led th,.led td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-weight:inherit}
.led tbody tr:last-child>*{border-bottom:0}
.led thead th{position:sticky;top:0;z-index:2;background:#141922;height:52px;min-width:60px}
.led .ledn{position:sticky;left:0;z-index:3;background:#141922;text-align:left;min-width:104px;max-width:128px;padding:7px 10px;box-shadow:8px 0 14px -8px rgba(0,0,0,.7);border-right-color:var(--line2)}
.led thead .ledn{z-index:4}
.led tbody .ledn{height:56px}
.ledn b{display:block;font-size:14.5px;line-height:1.3;max-width:100%}
.ledn small{display:block;font-size:11px;color:var(--ink3);line-height:1.35;font-weight:600;white-space:nowrap}
.ledh{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:100%;height:100%;min-height:52px;color:inherit}
.ledh small{font-size:10.5px;color:var(--ink3);font-weight:700}
.ledh b{font-size:13px;line-height:1.2}
.ledd.today .ledh b{color:var(--brand)}
.ledd.fut{opacity:.55}
.ledh .qd{position:absolute;top:7px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--brand)}
.ledc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:100%;min-width:60px;height:56px;padding:0 2px;color:inherit}
.ledc .m{font-size:15.5px;font-weight:800;line-height:1.15}
.ledc .ledv{font-size:11px;font-weight:700;color:var(--ink2);line-height:1.15;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ledc .ledv.bad{color:var(--red)}
.ledc:active{background:var(--glass-fill2)}
/* 點格子的修改視窗 */
.ledmk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ledmk button{height:58px;padding:0;text-align:center;border-radius:18px;background:rgba(255,255,255,.055);border:1px solid var(--line2);color:var(--ink2);font-size:18px;font-weight:800;line-height:1.15;box-shadow:var(--glass-hi);transition:transform .3s var(--spring),background-color .2s,border-color .2s,color .2s,box-shadow .25s}
.ledmk button small{display:block;font-size:11px;font-weight:700;opacity:.85}
.ledmk button:active{transform:scale(.93)}
.ledmk .p.on{background:rgba(82,224,163,.2);border-color:rgba(82,224,163,.75);color:var(--green);box-shadow:0 0 16px rgba(82,224,163,.28),inset 0 1px 0 rgba(255,255,255,.12)}
.ledmk .l.on{background:rgba(247,192,78,.2);border-color:rgba(247,192,78,.8);color:var(--amber);box-shadow:0 0 16px rgba(247,192,78,.26),inset 0 1px 0 rgba(255,255,255,.12)}
.ledmk .v.on{background:rgba(130,174,255,.2);border-color:rgba(130,174,255,.8);color:var(--blue);box-shadow:0 0 16px rgba(130,174,255,.26),inset 0 1px 0 rgba(255,255,255,.12)}
.ledmk .x.on{background:rgba(255,127,112,.2);border-color:rgba(255,127,112,.8);color:var(--red);box-shadow:0 0 16px rgba(255,127,112,.26),inset 0 1px 0 rgba(255,255,255,.12)}
.ledsc{display:flex;gap:8px;align-items:center}
.ledsc .in{flex:1;min-width:0}
.ledsc .btn{height:48px;flex:none}
.ledsc .btn.on{background:rgba(255,127,112,.2);border-color:rgba(255,127,112,.75);color:var(--red)}

/* ===== 座號、違規累計、值日生、名冊工具 ===== */
.seatn{display:inline-block;min-width:20px;height:17px;padding:0 5px;margin-right:6px;border-radius:7px;background:rgba(255,255,255,.1);border:1px solid var(--line2);color:var(--ink);font:800 11.5px/15px var(--f-body);font-style:normal;text-align:center;vertical-align:1px;box-sizing:border-box}
.seatn.auto{opacity:.55}
.strk{font-size:11px;font-weight:700;padding:1px 6px;border-radius:8px;background:rgba(247,192,78,.16);border:1px solid rgba(247,192,78,.25);color:var(--amber);white-space:nowrap}
.strk.due{background:rgba(255,127,112,.18);border-color:rgba(255,127,112,.4);color:var(--red)}
.dutybar{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 12px;padding:12px 14px;text-align:left;border-radius:22px;background:rgba(255,127,112,.12);border:1px solid rgba(255,127,112,.4);color:var(--red)}
.dutybar .main{flex:1;min-width:0}
.dutybar b{display:block;font-weight:800}
.dutybar small{display:block;font-size:13px;color:var(--ink2);line-height:1.4}
.rowic.red{color:var(--red)}
.seatrows{display:grid;gap:8px;margin-top:6px}
.seatrow{display:flex;align-items:center;gap:10px}
.seatrow span{flex:1;min-width:0;font-weight:700}
.seatin{width:84px;flex:none;text-align:center}
.seatli .seatno{width:60px;height:44px;flex:none;padding:0;text-align:center;font-weight:800}
.seatli.dup .seatno{border-color:var(--red);color:var(--red)}
.seatli .end .ib:disabled{opacity:.3}
.seatwarn{display:flex;gap:8px;align-items:flex-start;margin:0 0 12px;padding:10px 12px;border-radius:16px;background:rgba(255,127,112,.12);border:1px solid rgba(255,127,112,.3);color:var(--red);font-size:13px;line-height:1.5}
.seatwarn.soft{background:rgba(255,255,255,.06);border-color:var(--line);color:var(--ink2)}
.seatwarn svg{flex:none;margin-top:2px}
.bulkta{min-height:190px;font-size:15px;line-height:1.5}
.bulkrow.skip{opacity:.62}
.bulkrow .t2.why{color:var(--ink3)}
.bulkrow .t2.warn{color:var(--red)}
/* ===== 段考：姓名按鈕、備註圓點、全班平均列、作文計分設定 ===== */
.schn{display:flex;align-items:center;gap:6px;min-height:44px;max-width:150px;padding:0;background:none;border:0;font:inherit;font-weight:700;color:inherit;text-align:left;cursor:pointer}
.schn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.schn .seatn{flex:none}
.schn .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--brand);display:inline-block}
table.tb tfoot td{font-weight:700;background:var(--surface2);border-top:1px solid var(--line2);border-bottom:0}
table.tb tfoot td:first-child{background:rgba(24,28,36,.96)}
table.tb th small{font-weight:500;opacity:.8}
.termcfg{margin-bottom:12px}
.tcgrid{display:grid;grid-template-columns:1.15fr 1fr;gap:10px}
.tcgrid .field{margin:0;min-width:0}
.tcgrid .in{min-width:0;padding-left:10px;padding-right:8px;font-size:14px}
.tcgrid .seg button{padding:0 4px;font-size:13px}
/* ===== AI：拍照辨識、訊息潤飾 ===== */
.ocrbox{margin:0 0 12px}
.ocrbox .ocrbtn{width:100%}
.ocrbox p{margin:8px 2px 0}
.ocrst{display:flex;align-items:center;gap:10px}
.spin{display:inline-block;flex:none;width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spinr .8s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.6s}}
.aibar{margin-top:10px}
.aibar .btn{min-width:0;padding:0 10px}
/* ===== 列印預覽與列印 ===== */
.ppv{display:flex;flex-direction:column;gap:16px}
.ppv figure{margin:0}
.ppv .pgw{border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.ppv img{display:block;width:100%;height:auto}
.ppv.land .pgw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ppv.land img{width:190%;max-width:none}
.ppv figcaption{margin-top:7px;text-align:center;font-size:12px;color:var(--ink3)}
/* 很長的信箱（沒有空格）不能把畫面撐出螢幕 */
#page .card p,#layer .sheet p{overflow-wrap:anywhere}
.row .main>span{overflow-wrap:anywhere}
/* ===== 日期列：只列出「這個班」的上課日，可左右滑動；換班就換一組日期 ===== */
.chip small.ctd{font-size:10px;font-weight:800;padding:2px 6px;border-radius:8px;background:rgba(246,180,94,.22);color:var(--brand-2)}
.chip.on small.ctd{background:rgba(28,19,7,.14);color:var(--brand-fg)}
.cdays{position:relative;display:flex;align-items:stretch;gap:7px;overflow-x:auto;padding:14px 16px 10px;margin:0 -16px 0;scroll-padding-inline:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cdays::-webkit-scrollbar{display:none}
.cmon{flex:none;align-self:center;padding:0 3px;font-size:12px;font-weight:800;color:var(--ink3);white-space:nowrap}
.cday{position:relative;flex:none;width:58px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 0 12px;border-radius:20px;background:var(--glass-fill);border:1px solid var(--line);box-shadow:var(--glass-hi);color:var(--ink3);transition:transform .3s var(--spring),background-color .25s,border-color .25s}
.cday small{font-size:11px;font-weight:600}
.cday b{font:800 18px/1.1 var(--f-body);color:var(--ink2)}
.cday:active{transform:scale(.92)}
.cday.today:not(.on){border-color:rgba(246,180,94,.55)}
.cday.today:not(.on) b{color:var(--brand-2)}
.cday.off{border-style:dashed;background:transparent}
.cday.on,.cday.off.on{background:var(--gold);border-color:transparent;border-style:solid;color:var(--brand-fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 22px rgba(246,160,68,.34)}
.cday.on b,.cday.on small{color:var(--brand-fg)}
.cday em{position:absolute;top:-7px;right:-3px;font-style:normal;font-size:10px;font-weight:800;line-height:1;padding:3px 6px;border-radius:9px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line2)}
.cday.on em{background:rgba(28,19,7,.82);color:#FFD28F;border-color:transparent}
.cday i{position:absolute;bottom:5px;width:4px;height:4px;border-radius:2px;background:var(--brand)}
.cday.on i{background:var(--brand-fg)}
.cdbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 14px}
.cdbar .small{min-width:0;overflow-wrap:anywhere}
.cdbar .lnk{flex:none;display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 14px;border-radius:20px;background:var(--glass-fill);border:1px solid var(--line2);box-shadow:var(--glass-hi);font-size:13px;font-weight:700;color:var(--brand-2)}
/* ===== 上課日曆（月曆，點一下切換上課／不上課） ===== */
.calcls{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.calcls::-webkit-scrollbar{display:none}
.calnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 8px}
.calnav b{font:800 17px/1.2 var(--f-body)}
.calwd,.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calwd span{text-align:center;font-size:12px;font-weight:700;color:var(--ink3);padding:4px 0}
.cald{position:relative;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;border-radius:14px;background:var(--glass-fill);border:1px solid var(--line);color:var(--ink2);font:inherit}
.cald.e{background:none;border:0;visibility:hidden}
.cald b{font:700 16px/1.1 var(--f-body)}
.cald:active{transform:scale(.93)}
.cald.reg{background:color-mix(in srgb,var(--c) 32%,transparent);border-color:color-mix(in srgb,var(--c) 72%,transparent);color:var(--ink)}
.cald.add{background:var(--c);border-color:transparent;color:#10131A}
.cald.off{background:transparent;border:1.5px dashed var(--ink3);color:var(--ink3)}
.cald.off b{text-decoration:line-through}
.cald.today{box-shadow:0 0 0 2px rgba(246,180,94,.75)}
.cald em{position:absolute;top:3px;right:3px;font-style:normal;font-size:10px;font-weight:800;line-height:1}
.cald.add b,.cald.off b{padding-right:8px}   /* 有「加／停」小字時，數字稍微往左讓開，窄螢幕也不會疊在一起 */
.ahead h1{white-space:nowrap}
@media (max-width:389px){.ahead h1{font-size:30px}.ahead .dpick{max-width:172px}}
.cald .od{display:flex;gap:3px;align-items:center;height:6px}
.cald .od i{width:6px;height:6px;border-radius:3px;background:var(--c)}
.cald .od u,.callg u{display:inline-block;width:6px;height:6px;border-radius:3px;border:1.5px solid currentColor;box-sizing:border-box;text-decoration:none}
.calsum{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;margin-top:12px}
.calsum .lnk{margin-left:auto;font-size:13px;font-weight:700;color:var(--brand-2);padding:8px 2px}
.callg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--ink3)}
.callg span{display:inline-flex;align-items:center;gap:5px}
.callg i{width:14px;height:14px;border-radius:5px;box-sizing:border-box}
.callg i.reg{background:color-mix(in srgb,var(--c) 32%,transparent);border:1px solid color-mix(in srgb,var(--c) 72%,transparent)}
.callg i.add{background:var(--c)}
.callg i.off{border:1.5px dashed var(--ink3)}
.callg i.od{width:6px;height:6px;border-radius:3px;background:var(--c)}
/* ===== 像 App 一樣不能縮放：雙指縮放、連點放大、點輸入框自動放大都關掉 ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body,*{touch-action:pan-x pan-y}
input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):not([type=hidden]),select,textarea{font-size:max(16px,1em)!important}
/* 連點時不要反白選到文字、也不要閃出灰色底：只套在可點的東西與頂部／分頁列；輸入框、照片長按儲存不受影響 */
*{-webkit-tap-highlight-color:transparent}
[data-a]:not(img),[data-a]:not(img) *,#tabbar,#tabbar *,header.top,header.top *{-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
/* ===== 全螢幕照片檢視器（掃描檔、收條、講義預覽）：雙指縮放、拖曳、連點兩下放大 ===== */
img[data-a=pvOpen]{cursor:zoom-in}
/* 注意：滿版的層不能用 position:fixed;inset:0（iPhone 主畫面模式會把視窗從 956pt 縮成 894pt，底部出現黑邊），
   所以檢視器放在 #app 裡面，用 absolute 鋪滿，跟 .page／.scrim 一樣。 */
#pvw{position:absolute;inset:0;z-index:120;background:#000;display:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#pvw.on{display:block;animation:fade .16s ease-out}
#pvw:focus{outline:none}
#pvw,#pvw *{touch-action:none}
#pvw .st{position:absolute;inset:0;overflow:hidden}
#pvw .st img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;transform-origin:50% 50%;will-change:transform;-webkit-user-drag:none}
#pvw .st img.anim{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
#pvw .pvb{position:absolute;display:grid;place-items:center;width:44px;height:44px;padding:0;border-radius:22px;color:#fff;background:rgba(36,40,48,.58);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 6px 20px rgba(0,0,0,.4);transition:opacity .15s}
#pvw .pvx{top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 14px)}
#pvw .pvl{left:calc(env(safe-area-inset-left,0px) + 12px);top:50%;margin-top:-22px}
#pvw .pvr{right:calc(env(safe-area-inset-right,0px) + 12px);top:50%;margin-top:-22px}
#pvw.zm .pvl,#pvw.zm .pvr{opacity:0;pointer-events:none}
#pvw .pvc{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);height:44px;line-height:44px;padding:0 16px;border-radius:22px;color:#fff;font-weight:700;font-size:15px;background:rgba(36,40,48,.58);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid rgba(255,255,255,.2);pointer-events:none;white-space:nowrap}
#pvw .pvh{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);padding:9px 16px;border-radius:20px;color:rgba(255,255,255,.92);font-size:13px;background:rgba(36,40,48,.58);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);pointer-events:none;white-space:nowrap;animation:pvh 3.4s ease forwards}
@keyframes pvh{0%,70%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#pvw.on,#pvw .st img.anim{animation:none;transition:none}}
#printroot{display:none}
@media print{
  html,body{background:#fff!important;height:auto!important;min-height:0!important;overflow:visible!important}
  body::before{display:none!important}
  body>*:not(#printroot){display:none!important}
  #printroot{display:block!important}

<script>
const VIEWS={},PAGES={};
const COLLAB_SQL="-- ============================================================\n-- 班務通：多人共編（Supabase → SQL Editor → New query → 貼上 → Run）\n-- 可重複執行，不會出錯，也不會動到現有資料。\n-- 做了這些事：\n--   1. 新增「共編成員」資料表 app_members\n--   2. 把資料表 app_docs 的權限，從「只有本人」改成「本人＋被加入的成員」\n--   3. 新增合併寫入函式（兩個人同時改同一份點名，不會互相蓋掉）\n--   4. 新增加入／移除成員、離開共編等函式\n--   5. 照片資料夾的權限同步改成「本人＋成員」\n-- ============================================================\n\n-- 1) 共編成員：owner（管理者）的資料可以讓 member（成員）一起讀寫\ncreate table if not exists public.app_members (\n  owner uuid not null references auth.users(id) on delete cascade,\n  member uuid not null references auth.users(id) on delete cascade,\n  created_at timestamptz not null default now(),\n  primary key (owner, member),\n  check (owner <> member)\n);\n-- 一個帳號最多加入一個共用空間\ncreate unique index if not exists app_members_one_space on public.app_members (member);\nalter table public.app_members enable row level security;\n\ndrop policy if exists \"see my memberships\" on public.app_members;\ncreate policy \"see my memberships\" on public.app_members\n  for select to authenticated\n  using (owner = (select auth.uid()) or member = (select auth.uid()));\n-- 不開放直接新增／修改／刪除，只能透過下面的函式\n\n-- 2) app_docs：本人或同一個共用空間的成員都能讀寫\ndrop policy if exists \"own rows\" on public.app_docs;\ndrop policy if exists \"workspace rows\" on public.app_docs;\ncreate policy \"workspace rows\" on public.app_docs\n  for all to authenticated\n  using (\n    owner = (select auth.uid())\n    or owner in (select m.owner from public.app_members m where m.member = (select auth.uid()))\n  )\n  with check (\n    owner = (select auth.uid())\n    or owner in (select m.owner from public.app_members m where m.member = (select auth.uid()))\n  );\n\n-- 3) 合併寫入：把「修改的部分」合併進文件，而不是整份覆蓋（規則與 App 內相同：物件逐層合併，陣列與文字數字整個取代）\ncreate or replace function public.app_jsonb_merge(a jsonb, b jsonb)\nreturns jsonb\nlanguage plpgsql\nimmutable\nas $$\ndeclare\n  r jsonb;\n  k text;\n  v jsonb;\nbegin\n  if jsonb_typeof(a) is distinct from 'object' or jsonb_typeof(b) is distinct from 'object' then\n    return b;\n  end if;\n  r := a;\n  for k, v in select key, value from jsonb_each(b) loop\n    if jsonb_typeof(v) = 'object' and jsonb_typeof(r -> k) = 'object' then\n      r := jsonb_set(r, array[k], public.app_jsonb_merge(r -> k, v), true);\n    else\n      r := jsonb_set(r, array[k], v, true);\n    end if;\n  end loop;\n  return r;\nend;\n$$;\n\ncreate or replace function public.app_patch(p_owner uuid, p_col text, p_id text, p_patch jsonb)\nreturns jsonb\nlanguage plpgsql\nsecurity invoker\nset search_path = public\nas $$\ndeclare\n  r jsonb;\nbegin\n  insert into public.app_docs as d (owner, col, id, data, updated_at)\n  values (p_owner, p_col, p_id, coalesce(p_patch, '{}'::jsonb), now())\n  on conflict (owner, col, id) do update\n    set data = public.app_jsonb_merge(d.data, excluded.data),\n        updated_at = now()\n  returning d.data into r;\n  return r;\nend;\n$$;\n\n-- 4) 共編管理\n-- 我屬於哪個共用空間？（成員 → 回傳管理者；否則我自己就是管理者）\ncreate or replace function public.app_workspace()\nreturns jsonb\nlanguage sql\nstable\nsecurity definer\nset search_path = public, auth\nas $$\n  select coalesce(\n    (select jsonb_build_object('owner', m.owner, 'role', 'member', 'owner_email', u.email)\n       from public.app_members m join auth.users u on u.id = m.owner\n      where m.member = auth.uid() limit 1),\n    jsonb_build_object('owner', auth.uid(), 'role', 'owner',\n                       'owner_email', (select email from auth.users where id = auth.uid()))\n  );\n$$;\n\ncreate or replace function public.app_members_list()\nreturns table (member uuid, email text, created_at timestamptz)\nlanguage sql\nstable\nsecurity definer\nset search_path = public, auth\nas $$\n  select m.member, u.email::text, m.created_at\n    from public.app_members m join auth.users u on u.id = m.member\n   where m.owner = auth.uid()\n   order by m.created_at;\n$$;\n\n-- 用電子郵件把已建立好的帳號加進我的共用空間\ncreate or replace function public.app_member_add(p_email text)\nreturns text\nlanguage plpgsql\nsecurity definer\nset search_path = public, auth\nas $$\ndeclare\n  me uuid := auth.uid();\n  u uuid;\nbegin\n  if me is null then raise exception 'not_logged_in'; end if;\n  if exists (select 1 from public.app_members where member = me) then raise exception 'is_member'; end if;\n  select id into u from auth.users where lower(email) = lower(trim(p_email)) limit 1;\n  if u is null then raise exception 'no_user'; end if;\n  if u = me then raise exception 'self'; end if;\n  if exists (select 1 from public.app_members where member = u) then raise exception 'already_member'; end if;\n  if exists (select 1 from public.app_members where owner = u) then raise exception 'is_owner'; end if;\n  insert into public.app_members (owner, member) values (me, u);\n  return u::text;\nend;\n$$;\n\ncreate or replace function public.app_member_remove(p_member uuid)\nreturns void\nlanguage sql\nsecurity definer\nset search_path = public\nas $$\n  delete from public.app_members where owner = auth.uid() and member = p_member;\n$$;\n\ncreate or replace function public.app_leave()\nreturns void\nlanguage sql\nsecurity definer\nset search_path = public\nas $$\n  delete from public.app_members where member = auth.uid();\n$$;\n\nrevoke all on function public.app_patch(uuid, text, text, jsonb) from public, anon;\nrevoke all on function public.app_workspace() from public, anon;\nrevoke all on function public.app_members_list() from public, anon;\nrevoke all on function public.app_member_add(text) from public, anon;\nrevoke all on function public.app_member_remove(uuid) from public, anon;\nrevoke all on function public.app_leave() from public, anon;\ngrant execute on function public.app_patch(uuid, text, text, jsonb) to authenticated;\ngrant execute on function public.app_workspace() to authenticated;\ngrant execute on function public.app_members_list() to authenticated;\ngrant execute on function public.app_member_add(text) to authenticated;\ngrant execute on function public.app_member_remove(uuid) to authenticated;\ngrant execute on function public.app_leave() to authenticated;\n\n-- 5) 照片（bucket 名稱 scans）：本人或同一共用空間的成員可讀寫管理者資料夾\ndrop policy if exists \"scans read own\" on storage.objects;\ndrop policy if exists \"scans insert own\" on storage.objects;\ndrop policy if exists \"scans delete own\" on storage.objects;\ndrop policy if exists \"scans read ws\" on storage.objects;\ndrop policy if exists \"scans insert ws\" on storage.objects;\ndrop policy if exists \"scans delete ws\" on storage.objects;\n\ncreate policy \"scans read ws\" on storage.objects for select to authenticated\n  using (bucket_id = 'scans' and (\n    (storage.foldername(name))[1] = (select auth.uid())::text\n    or (storage.foldername(name))[1] in (select m.owner::text from public.app_members m where m.member = (select auth.uid()))\n  ));\ncreate policy \"scans insert ws\" on storage.objects for insert to authenticated\n  with check (bucket_id = 'scans' and (\n    (storage.foldername(name))[1] = (select auth.uid())::text\n    or (storage.foldername(name))[1] in (select m.owner::text from public.app_members m where m.member = (select auth.uid()))\n  ));\ncreate policy \"scans delete ws\" on storage.objects for delete to authenticated\n  using (bucket_id = 'scans' and (\n    (storage.foldername(name))[1] = (select auth.uid())::text\n    or (storage.foldername(name))[1] in (select m.owner::text from public.app_members m where m.member = (select auth.uid()))\n  ));\n";
const AI_FN_SRC="// @ts-nocheck\n/* 班務通 AI 函式（Supabase Edge Function，名稱：ai）\n *   POST {SUPABASE_URL}/functions/v1/ai\n *     body: {action:'ocr', image:<base64>, mime}  → {students:[{order,name,phone,school,note}]}\n *           {action:'polish', text, tone:'warm'|'formal', kind}  → {text}\n *           {action:'status'}  → {ok:true, v}（只檢查設定，不呼叫 Gemini）\n * - Gemini 金鑰只讀密鑰 GEMINI_API_KEY（Supabase → Edge Functions → Secrets），不會出現在網頁或回應裡。\n * - 只有「已登入班務通（Supabase）」的使用者能呼叫；可再用密鑰 AI_ALLOWED_EMAILS（逗號分隔）限定帳號。\n * - 部署時保持預設的「Verify JWT」開啟即可：Supabase 閘道先擋掉沒有有效登入憑證的請求，函式內再驗證一次並取得使用者信箱。\n *   若閘道因金鑰設定拒絕 App 的登入憑證（401 Invalid JWT），才需要關閉（supabase/config.toml 的 [functions.ai] verify_jwt = false，或 CLI --no-verify-jwt），函式自己的驗證仍然有效。\n * 可選密鑰：GEMINI_MODEL（優先使用的模型）、AI_ALLOWED_EMAILS、SB_URL、SB_KEY\n */\n\nconst env = (k) => {\n  try { if (typeof Deno !== 'undefined' && Deno.env) return Deno.env.get(k) || ''; } catch (e) { /* 沒有權限就當作沒設定 */ }\n  return (typeof process !== 'undefined' && process.env && process.env[k]) || '';\n};\n\nconst SUPABASE_URL = (env('SB_URL') || env('SUPABASE_URL') || 'https://nfkzuoswgjnnxlgzonpx.supabase.co').replace(/\\/+$/, '');\nconst SUPABASE_KEY = env('SB_KEY') || 'sb_publishable_xjyXcER2x_KGtUh9EYaZXw_X6m6RJGb';\nconst VERSION = 2;                     // 函式版本（status 會回傳；改程式時加一）\nconst GEMINI_BASE = 'https://generativelanguage.googleapis.com/v1beta/models/';\nconst MODELS = ['gemini-3.8-flash', 'gemini-3.7-flash', 'gemini-flash-latest', 'gemini-2.5-flash'];\n\nconst MAX_BODY = 6 * 1024 * 1024;      // App 會先把照片縮到約 3 MB 以內；這裡再擋一次\nconst MAX_IMAGE_B64 = 5.2 * 1024 * 1024;\nconst MAX_TEXT = 4000;\nconst BUDGET_MS = 52000;               // 單次請求最多花 52 秒（Edge Function 的牆鐘上限更長，這裡讓 App 不會等太久）\nconst RATE_N = 40, RATE_MS = 10 * 60 * 1000;\nconst hits = new Map();                // userId → 時間戳（同一個執行個體內的簡易限流）\n\n/* 網頁（Firebase 網站）和這個函式不同網域，要允許跨網域呼叫。\n   用的是 Authorization 標頭裡的登入憑證、沒有 cookie，所以允許任何來源不會多出風險；沒登入的一律 401。 */\nconst CORS = {\n  'access-control-allow-origin': '*',\n  'access-control-allow-headers': 'authorization, content-type, apikey, x-client-info',\n  'access-control-allow-methods': 'POST, OPTIONS',\n  'access-control-max-age': '86400',\n};\nconst J = (status, obj) => new Response(JSON.stringify(obj), {\n  status,\n  headers: Object.assign({ 'content-type': 'application/json; charset=utf-8', 'cache-control': 'no-store' }, CORS),\n});\nconst fail = (status, code, message) => J(status, { error: { code, message } });\nclass Fail extends Error { constructor(status, code, message) { super(message); this.status = status; this.code = code; } }\n\n/* ---------- 驗證登入 ---------- */\nasync function whoami(req) {\n  const h = req.headers.get('authorization') || '';\n  const m = h.match(/^Bearer\\s+(\\S+)$/i);\n  if (!m) throw new Fail(401, 'unauthorized', '請先登入');\n  let r;\n  try {\n    r = await fetch(SUPABASE_URL + '/auth/v1/user', {\n      headers: { apikey: SUPABASE_KEY, authorization: 'Bearer ' + m[1] },\n      signal: AbortSignal.timeout(8000),\n    });\n  } catch (e) {\n    throw new Fail(503, 'auth_unavailable', '無法確認登入狀態');\n  }\n  if (r.status === 401 || r.status === 403) throw new Fail(401, 'unauthorized', '登入已過期');\n  if (!r.ok) throw new Fail(503, 'auth_unavailable', '無法確認登入狀態');\n  let u = null;\n  try { u = await r.json(); } catch (e) { /* ignore */ }\n  if (!u || !u.id) throw new Fail(401, 'unauthorized', '登入已過期');\n  const allow = String(env('AI_ALLOWED_EMAILS')).split(',').map(s => s.trim().toLowerCase()).filter(Boolean);\n  if (allow.length && allow.indexOf(String(u.email || '').toLowerCase()) < 0) throw new Fail(403, 'forbidden', '這個帳號沒有使用 AI 的權限');\n  return u;\n}\nfunction limited(uid) {\n  const now = Date.now();\n  const arr = (hits.get(uid) || []).filter(t => now - t < RATE_MS);\n  if (arr.length >= RATE_N) { hits.set(uid, arr); return true; }\n  arr.push(now); hits.set(uid, arr);\n  if (hits.size > 500) for (const [k, v] of hits) if (!v.some(t => now - t < RATE_MS)) hits.delete(k);\n  return false;\n}\n\n/* ---------- Gemini ---------- */\nfunction thinkingFor(model) {\n  return /2\\.5/.test(model) ? { thinkingBudget: 0 } : { thinkingLevel: 'low' };\n}\nfunction errMsg(txt) {\n  try { const j = JSON.parse(txt); return String((j.error && j.error.message) || ''); } catch (e) { return String(txt || '').slice(0, 200); }\n}\nfunction pickText(j) {\n  const c = j && j.candidates && j.candidates[0];\n  if (!c) {\n    const br = j && j.promptFeedback && j.promptFeedback.blockReason;\n    if (br) throw new Fail(422, 'blocked', 'AI 無法處理這份內容');\n    throw new Fail(502, 'empty', 'AI 沒有回應內容');\n  }\n  const parts = (c.content && c.content.parts) || [];\n  const t = parts.filter(p => p && typeof p.text === 'string' && !p.thought).map(p => p.text).join('');\n  if (!t.trim()) {\n    if (c.finishReason === 'SAFETY' || c.finishReason === 'PROHIBITED_CONTENT' || c.finishReason === 'RECITATION') throw new Fail(422, 'blocked', 'AI 無法處理這份內容');\n    throw new Fail(502, 'empty', 'AI 沒有回應內容');\n  }\n  return t;\n}\n/* 依序嘗試模型；模型不存在／額度滿／暫時故障就換下一個；不接受 thinking 參數就去掉再試一次 */\nasync function gemini(key, body, deadline) {\n  const list = [...new Set([env('GEMINI_MODEL'), ...MODELS].map(s => (s || '').trim()).filter(Boolean))];\n  let last = null;\n  for (const model of list) {\n    for (const think of [true, false]) {\n      const left = deadline - Date.now();\n      if (left < 4000) throw last || new Fail(504, 'timeout', 'AI 回應逾時');\n      const payload = JSON.parse(JSON.stringify(body));\n      if (think) payload.generationConfig = Object.assign({}, payload.generationConfig, { thinkingConfig: thinkingFor(model) });\n      let res;\n      try {\n        res = await fetch(GEMINI_BASE + encodeURIComponent(model) + ':generateContent', {\n          method: 'POST',\n          headers: { 'content-type': 'application/json', 'x-goog-api-key': key },\n          body: JSON.stringify(payload),\n          signal: AbortSignal.timeout(Math.min(left - 1000, 40000)),\n        });\n      } catch (e) {\n        last = new Fail(504, e && e.name === 'TimeoutError' ? 'timeout' : 'upstream', 'AI 回應逾時或連線失敗');\n        break; // 換下一個模型\n      }\n      if (res.ok) {\n        let j = null;\n        try { j = await res.json(); } catch (e) { last = new Fail(502, 'upstream', 'AI 回應格式錯誤'); break; }\n        return { text: pickText(j), model };\n      }\n      const msg = errMsg(await res.text());\n      const st = res.status;\n      if (st === 400 && think && /thinking/i.test(msg)) continue;                 // 去掉 thinking 設定再試\n      if (st === 400 && /api key|API_KEY/i.test(msg)) throw new Fail(500, 'bad_key', 'Gemini 金鑰無效');\n      if (st === 401 || st === 403) throw new Fail(500, 'bad_key', 'Gemini 金鑰無效或沒有權限');\n      if (st === 404 || (st === 400 && /model/i.test(msg) && /not found|not supported|unsupported|invalid/i.test(msg))) {\n        last = new Fail(502, 'upstream', '模型不可用：' + model); break;             // 換下一個模型\n      }\n      if (st === 429) { last = new Fail(429, 'quota', 'AI 額度暫時用完'); break; }\n      if (st >= 500) { last = new Fail(502, 'upstream', 'AI 服務暫時忙碌'); break; }\n      throw new Fail(502, 'upstream', 'AI 無法處理這個請求（' + st + '）');\n    }\n  }\n  throw last || new Fail(502, 'upstream', 'AI 暫時無法使用');\n}\n\n/* ---------- 拍照辨識名冊 ---------- */\nconst OCR_PROMPT = `你是精通台灣學校與補習班點名冊、通訊錄的 OCR 專家。\n請辨識這張照片中的學生名單（手寫或印刷的點名冊、座位表、簽到表、聯絡表、手機截圖皆可），依照片由上到下的順序，列出每一位學生：\n1. order：照片上寫的座號或序號（整數）。如果照片上沒有座號，請填 0，不要自己編號。\n2. name：學生姓名，務必是精確的繁體中文。\n3. phone：家長或學生的電話／手機（例如 0912-345-678）。照片上沒有就填空字串 \"\"。\n4. school：就讀學校、年級或班級（例如「仁愛國中 二年級」「明華110」）。沒有就填空字串 \"\"。\n5. note：備註。若某位學生的姓名或電話字跡潦草、看不清楚，請在 note 寫「字跡不清，請核對」。沒有就填空字串 \"\"。\n只列出學生資料列；標題、日期、導師姓名、合計人數等不是學生的內容請略過。看不清的字請盡力辨識，不要憑空編造。`;\nconst OCR_SYS = '你專精於繁體中文手寫與印刷名冊的 OCR 辨識，只輸出符合格式的 JSON，姓名、電話與學校務必精確。';\nconst OCR_SCHEMA = {\n  type: 'ARRAY',\n  items: {\n    type: 'OBJECT',\n    properties: {\n      order: { type: 'INTEGER', description: '座號或序號；照片上沒有就填 0' },\n      name: { type: 'STRING', description: '學生姓名（繁體中文）' },\n      phone: function clearMirror(){clearTimeout(mt);try{localStorage.removeItem(CK)}catch(e){}}

/* 待同步佇列：每筆是「整份文件」的最新狀態，同一份文件只保留最後一筆；存在 localStorage，重新開啟也不會遺失 */
const OBK='banwutong-outbox-v1';
function obRead(){try{const a=JSON.parse(localStorage.getItem(OBK)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
let OBDEFER=false;   // 批次寫入（bulkRun）時，等全部寫完再存一次佇列
function obSave(){if(OBDEFER)return;try{if(OB.length)localStorage.setItem(OBK,JSON.stringify(OB));else localStorage.removeItem(OBK)}catch(e){}}
let OB=obRead();
/* 舊版留下的佇列沒有 kind／uid：補上 */
OB.forEach(o=>{if(!o.kind)o.kind=o.data===null?'del':'put';if(!o.uid)o.uid=o.owner});
const obHas=(col,id)=>OB.some(o=>o.col===col&&o.id===id);
const obFind=(col,id)=>OB.find(o=>o.col===col&&o.id===id);
/* kind：put＝整份文件取代；patch＝只合併修改的部分（多人同時改同一份文件時不會互相蓋掉）；del＝刪除 */
function obQueue(col,id,data,part){
  const i=OB.findIndex(o=>o.col===col&&o.id===id),old=i>=0?OB[i]:null;
  let kind=data===null?'del':'put',patch=null;
  if(part!==undefined&&data!==null&&(!old||old.kind==='patch')){kind='patch';patch=old?merge(old.patch,part):part}
  const op={col,id,owner:WS(),uid:AUTH.uid,kind};
  if(kind==='patch')op.patch=patch;else if(kind==='put')op.data=data;
  if(i>=0)OB[i]=op;else OB.push(op);   // 新物件：送出中的舊版本不會被誤當成已送出
  obSave();
}
function overlayOB(){
  OB.forEach(o=>{
    if(o.owner!==WS()||!S[o.col])return;
    if(o.kind==='del')delete S[o.col][o.id];
    else if(o.kind==='patch')S[o.col][o.id]=merge(S[o.col][o.id]||{},o.patch);
    else S[o.col][o.id]=o.data;
  });
}

const isNet=e=>!!e&&(e instanceof TypeError||/Failed to fetch|NetworkError|Load failed|network/i.test(String(e.message||'')));
function fail(e){
  const m=String((e&&e.message)||'');
  let t='儲存失敗，請稍後再試';
  if((e&&e.code==='42501')||/row-level|permission denied/i.test(m))t='沒有權限，請重新登入後再試';
  else if(/JWT|expired/i.test(m))t='登入已過期，請重新登入';
  sync.err=t;toast(t,3200);
}
function guard(){if(!AUTH.uid){toast('請先登入');return true}return false}

/* 寫入：先改本機畫面、再放進佇列，連線後自動送出 */
function write(col,id,data,part){
  const wasEmpty=!OB.length;
  obQueue(col,id,data,part);
  if(data===null)delete S[col][id];else S[col][id]=data;
  mirror();render();
  if(wasEmpty&&!navigator.onLine)toast('網路未連線，變更已存在手機，連線後會自動同步',3200);
  flushSoon();
}
function put(col,id,data){if(guard())return Promise.resolve(false);write(col,id,clone(data));return Promise.resolve(true)}
function patch(col,id,part){if(guard())return Promise.resolve(false);const p=clone(part);write(col,id,merge(S[col][id]||{},p),p);return Promise.resolve(true)}
function del(col,id){if(guard())return Promise.resolve(false);write(col,id,null);return Promise.resolve(true)}

/* 送出佇列：一次一筆、依序；網路斷線就停下來，等下次觸發再試 */
const upsertRow=(col,id,data,owner)=>sync.client.from(TABLE).upsert(
  {owner:owner||WS(),col,id,data,updated_at:new Date().toISOString()},
  {onConflict:'owner,col,id'}
);
const isNoFn=e=>!!e&&(e.code==='PGRST202'||e.code==='42883'||e.status===404||/Could not find the function|function .* does not exist/i.test(String(e.message||'')));
/* 伺服器回傳合併後的文件：更新畫面（如果這份文件還有更新的待同步變更，就疊上去） */
function applyServerDoc(col,id,data){
  if(!S[col]||!data||typeof data!=='object')return;
  const o=obFind(col,id);let v=data;
  if(o){if(o.kind==='del')return;v=o.kind==='patch'?merge(data,o.patch):o.data}
  if(JSON.stringify(S[col][id])===JSON.stringify(v))return;
  S[col][id]=v;mirror();render();
}
let flT=0,flying=false;
function flushSoon(){clearTimeout(flT);flT=setTimeout(flush,0);pill()}
async function flush(){
  if(flying||!sync.client||!AUTH.uid||!OB.length||!navigator.onLine)return pill();
  if(!sync.wsOk){
    flying=true;
    let r=false;
    try{r=await wsEnsure()}finally{flying=false}
    if(!sync.wsOk)return pill();
    if(r==='changed'){await pull();subscribeRT();render()}   // 空間變了：載入新空間的資料並改訂閱新空間
  }
  flying=true;
  const uid0=AUTH.uid;
  try{
    while(OB.length&&AUTH.uid===uid0){
      const op=OB[0];
      if(op.owner!==WS()){OB.shift();obSave();continue}   // 不屬於目前這個空間的舊變更
      let q;
      if(op.kind==='del')q=sync.client.from(TABLE).delete().eq('owner',op.owner).eq('col',op.col).eq('id',op.id);
      else if(op.kind==='patch'&&!sync.noPatch)q=sync.client.rpc('app_patch',{p_owner:op.owner,p_col:op.col,p_id:op.id,p_patch:op.patch});
      else q=upsertRow(op.col,op.id,op.kind==='patch'?(S[op.col][op.id]||op.patch):op.data,op.owner);
      let error=null,res=null;
      try{({data:res,error}=await q)}catch(e){error=e}
      if(AUTH.uid!==uid0)break;
      if(error&&isNet(error))break;
      if(error&&op.kind==='patch'&&!sync.noPatch&&isNoFn(error)){sync.noPatch=true;continue}   // 還沒執行共編 SQL：改用整份上傳
      if(OB[0]===op){OB.shift();obSave()}   // 送出期間若又有新的修改，佇列裡已換成新物件，要留著下一輪再送
      if(error){
        let moved=false;
        if(error.code==='42501'||/row-level/i.test(String(error.message||''))){
          sync.wsOk=false;
          moved=(await wsEnsure())==='changed';
          if(moved){subscribeRT();render()}   // 例如被管理者移除：回到自己的空間
        }
        if(moved)toast('你已不在原本的共用空間，現在是你自己的空間',4200);else fail(error);
        await pullNow();continue;
      }
      if(op.kind==='patch'&&!sync.noPatch)applyServerDoc(op.col,op.id,res);
      sync.dead=false;sync.last=Date.now();
    }
  }finally{flying=false;pill()}
}
async function pullNow(){if(await pull()){pill();render()}}
/* 回到前景／恢復連線：先送出待同步的變更，再重新確認所在空間（可能剛被加入或移出共編）並重新讀取 */
async function foreground(){
  if(AUTH.state!=='in'||!sync.client)return;
  const uid0=AUTH.uid;
  await flush();
  if(AUTH.uid!==uid0)return;
  sync.wsOk=false;
  await pullNow();
}

/* 讀取與即時同步 */
async function fetchAll(){
  const rows=[];
  for(let from=0;;from+=1000){
    const {data,error}=await sync.client.from(TABLE).select('col,id,data').eq('owner',WS())
      .order('col').order('id').range(from,from+999);
    if(error)throw error;
    rows.push(...(data||[]));
    if(!data||data.length<1000)break;
  }
  return rows;
}
function applyRows(rows){
  COLS.forEach(c=>{S[c]={};sync.loaded[c]=true});
  rows.forEach(r=>{if(S[r.col])S[r.col][r.id]=r.data||{}});

async function pull(){
  const uid0=AUTH.uid;
  try{
    let moved=false;
    if(!sync.wsOk){
      const r=await wsEnsure();
      if(!r)throw new Error('workspace unknown');
      moved=r==='changed';
    }
    const rows=await fetchAll();
    if(AUTH.uid!==uid0)return false;
    applyRows(rows);sync.dead=false;sync.last=Date.now();

}
/* 這個帳號的資料放在哪個空間：自己的，或被管理者加入的共用空間（共編）。伺服器還沒執行共編 SQL 時，一律是自己的 */
async function resolveWs(){
  try{
    const {data,error}=await sync.client.rpc('app_workspace');
    if(error)throw error;
    const w=data||{};
    sync.collab=true;sync.noPatch=false;   // 共編 SQL 已安裝（合併寫入函式一起安裝）
    return {ws:w.owner||AUTH.uid,role:w.role==='member'?'member':'owner',email:w.owner_email||''};
  }catch(e){
    if(isNoFn(e)){sync.collab=false;return {ws:AUTH.uid,role:'owner',email:AUTH.email}}
    return null;   // 連不上伺服器：維持目前（快取）的設定
  }
}
async function wsEnsure(){
  const uid0=AUTH.uid;
  const r=await resolveWs();
  if(AUTH.uid!==uid0||!r)return false;
  const changed=r.ws!==WS();
  AUTH.ws=r.ws;AUTH.role=r.role;AUTH.wsEmail=r.email;
  if(changed){
    /* 空間換了（被加入／被移除／離開）：手機上的快取與未送出的變更都屬於舊空間，不能帶過去 */
    const dropped=OB.filter(o=>o.owner!==r.ws).length;
    OB=OB.filter(o=>o.owner===r.ws);obSave();
    COLS.forEach(c=>{S[c]={}});
    clearMirror();
    if(dropped)toast('共用空間已變更，舊空間未同步的 '+dropped+' 筆變更已捨棄',4200);
  }
  sync.wsOk=true;
  return changed?'changed':true;
}
/* 手動重新檢查空間（加入／離開共編後）；空間有變就重新載入資料 */
async function wsSwitch(){
  sync.wsOk=false;
  const r=await wsEnsure();
  if(r==='changed'){await pull();subscribeRT();pill();render()}
  return r;
}
function applyRT(p){
  const o=p.eventType==='DELETE'?p.old:p.new;
  if(!o||!S[o.col]||o.owner&&o.owner!==WS())return;
  const pend=obFind(o.col,o.id);
  if(pend){
    /* 這份文件我這邊還有沒送出的修改：別人的變更先收下，再把我的修改疊上去 */
    if(pend.kind==='patch'&&p.eventType!=='DELETE'){S[o.col][o.id]=merge(o.data||{},pend.patch);mirror();render()}
    return;
  }
  if(p.eventType==='DELETE')delete S[o.col][o.id];
  else S[o.col][o.id]=o.data||{};
  mirror();render();
}
function subscribeRT(){
  if(sync.rt){try{sync.client.removeChannel(sync.rt)}catch(e){}sync.rt=null}
  const uid0=AUTH.uid,ws0=WS();
  sync.rt=sync.client.channel('app-docs-'+ws0)
    .on('postgres_changes',{event:'*',schema:'public',table:TABLE,filter:'owner=eq.'+ws0},applyRT)
    .subscribe(st=>{
      if(AUTH.uid!==uid0)return;
      if(st==='SUBSCRIBED'){if(sync.dead)pullNow();else pill()}
      else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){sync.dead=true;pill()}
    });
}

/* ----- 上課日：每週固定時段（開課日之後）＋ 臨時調整 c.ov = {日期: 1 加課 | 0 停課；null 或沒有＝照每週固定} ----- */
const ovOf=(c,date)=>{const v=c&&c.ov?c.ov[date]:null;return v===1||v===0?v:null};
const regSlots=(c,date)=>{const wd=wdOf(date);return date>=(c.start||'0000-00-00')?(c.slots||[]).filter(s=>s.d===wd):[]};
function slotsOf(c,date){
  const o=ovOf(c,date);
  if(o===0)return [];
  const r=regSlots(c,date);
  if(r.length||o!==1)return r;
  const wd=wdOf(date),sl=c.slots||[],t=sl.find(s=>s.d===wd)||sl[0];   // 加課：沿用當天或第一個時段的時間
  return [{d:wd,s:t?t.s:'18:00',e:t?t.e:'20:00',extra:true}];
}
const isClassDay=(c,date)=>slotsOf(c,date).length>0;

  const out=[];
  activeClasses().forEach(c=>slotsOf(c,date).forEach(s=>out.push({c:c,s:s})));
  return out.sort((a,b)=>toMin(a.s.s)-toMin(b.s.s));

/* 這天這個班有沒有點名或小考紀錄（有的話，就算停課也要保留、找得到） */
const hasRecord=(cid,date)=>hasMarks(attDoc(cid,date))||list('exams').some(q=>q.cid===cid&&q.date===date);
/* 日期列要列出的日子：上課日 ＋ 有紀錄的日子 ＋ 目前選的那天。範圍以今天與選到的日期為準，所以來回點選時列表不會位移 */
function classDates(c,d){
  const t=todayS(),f=addDays(d,-14)<addDays(t,-28)?addDays(d,-14):addDays(t,-28),e=addDays(d,14)>addDays(t,56)?addDays(d,14):addDays(t,56),set={};
  for(let x=f;x<=e;x=addDays(x,1))if(isClassDay(c,x))set[x]=1;
  list('att').forEach(a=>{if(a.cid===c.id&&a.date>=f&&a.date<=e&&hasMarks(a))set[a.date]=1});
  list('exams').forEach(q=>{if(q.cid===c.id&&q.date>=f&&q.date<=e)set[q.date]=1});
  set[d]=1;
  return Object.keys(set).sort();
}
/* 離某天最近的上課日（一樣遠時取較早的）；找不到回傳 null */
function nearestClassDay(c,d){
  if(isClassDay(c,d))return d;
  for(let k=1;k<=120;k++){
    const p=addDays(d,-k);if(isClassDay(c,p))return p;
    const f=addDays(d,k);if(isClassDay(c,f))return f;
  }
  return null;
}

/* ===== 聯絡簿：今天上課內容、作業檢查、LINE 家長通知 =====
   資料存在當天的點名文件（att，鍵 = 班級_日期）裡：
     lesson:{progress,homework,exam,memo}   今天的進度、指定作業、下次考試範圍、老師的話
     hw:{學生id:'ok'|'late'|'fix'|'miss'}    作業檢查狀態（已交／補交／訂正／未繳）
   舊版「作業未繳」開關（flags.hw）視同未繳，兩邊會同步。 */
const HW_KEYS=['ok','late','fix','miss'];
const HW_LBL={ok:['已交','準時繳交'],late:['補交','補交／遲交'],fix:['訂正','已訂正'],miss:['未繳','未繳交']};
const ATT_TXT={p:'準時到課',l:'遲到',v:'請假',x:'缺席未到'};
const lessonOf=doc=>(doc&&doc.lesson)||{};
function hwOf(doc,sid){
  const v=doc&&doc.hw&&doc.hw[sid];
  if(v&&HW_LBL[v])return v;
  return (doc&&doc.flags&&doc.flags[sid]&&doc.flags[sid].hw)?'miss':'';
}
function setHw(cid,date,sid,v){
  patch('att',attKey(cid,date),{cid:cid,date:date,hw:{[sid]:v||null},flags:{[sid]:{hw:v==='miss'}}});
}
function hwCount(doc,ro){
  const r={ok:0,late:0,fix:0,miss:0,none:0};
  ro.forEach(s=>{const k=hwOf(doc,s.id);if(k)r[k]++;else r.none++});
  return r;
}
function studentHw(sid){
  const r={ok:0,late:0,fix:0,miss:0,t:0,rows:[]};
  list('att').forEach(a=>{const k=hwOf(a,sid);if(!k)return;r[k]++;r.t++;r.rows.push({date:a.date,cid:a.cid,k:k})});
  r.rows.sort((x,y)=>x.date<y.date?1:-1);
  r.rate=r.t?(r.ok+r.late+r.fix)/r.t:null;
  return r;
}
/* 上一堂（同班、日期更早、有填指定作業）：這一堂要檢查的就是它 */
function prevHomework(cid,date){
  let best=null;
  list('att').forEach(a=>{
    if(a.cid===cid&&a.date<date&&a.lesson&&a.lesson.homework&&(!best||a.date>best.date))best=a;
  });
  return best;
}
/* 和點名頁共用同一組「日期＋班級」；回傳這天可選的班級與目前班級 */
function dayPick(d){
  const pool=activeClasses();
  let cid=NAV.attCid;
  if(!pool.some(c=>c.id===cid)){
    const ss=sessionsOn(d),cand=ss.length?uniqCls(ss):pool;
    const withStu=cand.find(c=>rosterOf(c.id).length);
    cid=withStu?withStu.id:(cand.length?cand[0].id:'');
  }
  NAV.attCid=cid;
  return {ss:sessionsOn(d),pool:pool,cid:cid};
}

function studentMsg(cid,d,sid,tone){

  L.push('');
  L.push(tone==='formal'?'如有任何疑問，歡迎來電洽詢，謝謝您。':'謝謝您的配合，孩子有任何狀況都歡迎隨時跟老師說！');
  if(cn)L.push('— '+cn);

/* ----- 複製與分享 ----- */
async function copyText(t){
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(t);return true}}catch(e){}
  const ta=document.createElement('textarea');
  ta.value=t;ta.setAttribute('readonly','');
  ta.style.cssText='position:absolute;left:-9999px;top:0;opacity:0';
  document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,ta.value.length);
  let ok=false;try{ok=document.execCommand('copy')}catch(e){}
  ta.remove();return ok;
}
async function shareText(t){
  if(!navigator.share)return 'unsupported';
  try{await navigator.share({text:t});return 'shared'}
  catch(e){return e&&e.name==='AbortError'?'cancel':'unsupported'}
}
