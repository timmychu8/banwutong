<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="班務通">
<link rel="manifest" href="manifest.webmanifest">
<title>自動找原因</title>
<style>
/* 【暫時】依序載入 v0~v7，各等 9 秒，記錄 iPhone 回報的視窗高度，最後在這裡列出結果 */
*{box-sizing:border-box}
html{background:#06080C;color:#EEF2F7;font:14px/1.5 -apple-system,BlinkMacSystemFont,'PingFang TC',sans-serif}
body{margin:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 20px)}
h1{font-size:18px;margin:6px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button,a.b{font:600 14px/1 -apple-system,'PingFang TC',sans-serif;color:#EEF2F7;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:12px 14px;text-decoration:none}
button.go{background:#F2B25B;color:#1A1206;border-color:#F2B25B}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left;vertical-align:top}
.ok{color:#4ADE9A;font-weight:700}.bad{color:#FF7A6B;font-weight:700}.na{color:#72809A}
.note{color:#A7B2C2;font-size:12px;margin:8px 0}
</style>
</head>
<body>
<h1>自動找原因</h1>
<div class="row">
  <button class="go" id="go">開始自動測試</button>
  <button id="clr">清除結果</button>
  <a class="b" href="./">回班務通</a>
</div>
<p class="note">按「開始」後請不要碰螢幕，約 100 秒。會依序開啟 8 個版本，每個等 9 秒，最後自動回到這一頁顯示結果，直接截圖給我。</p>
<table id="t"></table>
<script>
(function(){
  var NAMES=[['v0','原樣（對照）'],['v1','去掉 color-scheme'],['v2','去掉毛玻璃'],['v3','去掉開場動畫'],['v4','去掉背景光暈'],['v5','外框不用 fixed'],['v6','去掉全部程式'],['v7','html/body 不鎖定']];
  var T=document.getElementById('t');
  function show(){
    var res={};try{res=JSON.parse(localStorage.getItem('bisRes')||'{}')}catch(e){}
    var run=localStorage.getItem('bisRun')==='1';
    var h='<tr><th>版本</th><th>剛開啟</th><th>9 秒後</th><th>結果</th></tr>';
    NAMES.forEach(function(n){
      var r=res[n[0]],cell;
      if(!r)cell='<td class="na">'+(run?'測試中…':'未測')+'</td><td></td><td></td>';
      else{var stay=r.inner>=screen.height;cell='<td>'+r.first+'</td><td>'+r.inner+(r.html!==r.inner?' (html '+r.html+')':'')+'</td><td class="'+(stay?'ok':'bad')+'">'+(stay?'穩定':'縮小')+'</td>'}
      h+='<tr><td>'+n[0]+' '+n[1]+'</td>'+cell+'</tr>';
    });
    T.innerHTML=h+'<tr><td colspan="4" class="note">螢幕高度 '+screen.height+'；standalone '+navigator.standalone+'</td></tr>';
  }
  document.getElementById('go').addEventListener('click',function(){
    localStorage.setItem('bisRes','{}');
    localStorage.setItem('bisQ',JSON.stringify(NAMES.slice(1).map(function(n){return n[0]})));
    localStorage.setItem('bisRun','1');
    location.href='v0.html';
  });
  document.getElementById('clr').addEventListener('click',function(){
    localStorage.removeItem('bisRes');localStorage.removeItem('bisQ');localStorage.removeItem('bisRun');show();
  });
  show();
})();
</script>
</body>
</html>
