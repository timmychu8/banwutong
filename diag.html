<!doctype html>
<html lang="zh-Hant" class="lock">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="班務通">
<link rel="manifest" href="manifest.webmanifest">
<title>版面診斷</title>
<style>
/* 暫時的診斷頁：用六種寫法各畫一條滿版色條，看哪一種能畫到螢幕最底，並印出 iPhone 回報的實際數字 */
*{box-sizing:border-box}
html{background:#06080C;color:#EEF2F7;font:13px/1.45 -apple-system,BlinkMacSystemFont,'PingFang TC',sans-serif}
html.lock,html.lock body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0}
.col{width:16.6667%;top:0;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.65) 0 1px,transparent 1px 50px),var(--c)}
.f{position:fixed}
.a{position:absolute}
#bar{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:10;display:flex;gap:6px;padding:0 8px;align-items:center}
#bar button,#bar a{font:600 12px/1 -apple-system,'PingFang TC',sans-serif;color:#EEF2F7;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:9px 10px;text-decoration:none;white-space:nowrap}
#bar button.on{background:#F2B25B;color:#1A1206;border-color:#F2B25B}
#panel{position:fixed;left:6px;right:6px;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:9;background:rgba(6,8,12,.88);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:8px 10px;pointer-events:none}
#panel pre{margin:0;font:11px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap}
</style>
</head>
<body>
<div class="col f" id="c1" style="--c:#b3261e;left:0;bottom:0"></div>
<div class="col f" id="c2" style="--c:#c77700;left:16.6667%;height:100vh"></div>
<div class="col f" id="c3" style="--c:#2e7d32;left:33.3333%;height:100lvh"></div>
<div class="col f" id="c4" style="--c:#1565c0;left:50%;height:100dvh"></div>
<div class="col a" id="c5" style="--c:#6a1b9a;left:66.6667%;height:100lvh"></div>
<div class="col" id="c6" style="--c:#00838f;position:relative;margin-left:83.3333%;height:100lvh"></div>
<div id="bar">
  <button id="m-lock" class="on">鎖定高度（同班務通）</button>
  <button id="m-free">自然捲動</button>
  <a href="./">回班務通</a>
</div>
<div id="panel"><pre id="info"></pre></div>
<script>
(function(){
  var NAMES=['fixed top0 bottom0','fixed 100vh','fixed 100lvh','fixed 100dvh','absolute 100lvh','一般流程 100lvh'];
  var COLORS=['#b3261e','#c77700','#2e7d32','#1565c0','#6a1b9a','#00838f'];
  function probe(h){var d=document.createElement('div');d.style.cssText='position:fixed;left:0;top:0;width:1px;visibility:hidden;height:'+h;document.body.appendChild(d);var v=d.offsetHeight;d.remove();return v}
  function env(){var d=document.createElement('div');d.style.cssText='position:fixed;visibility:hidden;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px) 0';document.body.appendChild(d);var cs=getComputedStyle(d),r=[cs.paddingTop,cs.paddingBottom];d.remove();return r}
  function f(n){return Math.round(n*10)/10}
  function render(){
    var vv=window.visualViewport,e=env(),L=[];
    L.push('standalone '+navigator.standalone+'   display-mode '+matchMedia('(display-mode: standalone)').matches);
    L.push('inner '+innerWidth+'×'+innerHeight+'   outer '+outerWidth+'×'+outerHeight);
    L.push('screen '+screen.width+'×'+screen.height+'   avail '+screen.availWidth+'×'+screen.availHeight);
    L.push('visualViewport '+(vv?f(vv.width)+'×'+f(vv.height)+' top '+f(vv.offsetTop)+' scale '+vv.scale:'n/a'));
    L.push('html '+document.documentElement.clientHeight+'  body '+document.body.clientHeight+'  scrollH '+document.documentElement.scrollHeight+'  scrollY '+f(scrollY));
    L.push('100vh '+probe('100vh')+'  svh '+probe('100svh')+'  lvh '+probe('100lvh')+'  dvh '+probe('100dvh')+'  100% '+probe('100%'));
    L.push('safe-area 上 '+e[0]+'  下 '+e[1]);
    L.push('模式 '+(document.documentElement.classList.contains('lock')?'鎖定高度':'自然捲動'));
    L.push('— 各色條排版底邊（css px）—');
    for(var i=0;i<6;i++){var el=document.getElementById('c'+(i+1));L.push('■ '+(i+1)+' '+NAMES[i]+' → '+f(el.getBoundingClientRect().bottom))}
    var pre=document.getElementById('info');pre.textContent='';
    var lines=L.join('\n').split('\n');
    lines.forEach(function(t,idx){
      if(t.charAt(0)==='■'){var s=document.createElement('span');s.textContent='■';s.style.color=COLORS[+t.charAt(2)-1];pre.appendChild(s);pre.appendChild(document.createTextNode(t.slice(1)+'\n'))}
      else pre.appendChild(document.createTextNode(t+'\n'));
    });
  }
  function mode(lock){
    document.documentElement.className=lock?'lock':'free';
    document.getElementById('m-lock').className=lock?'on':'';
    document.getElementById('m-free').className=lock?'':'on';
    window.scrollTo(0,0);render();
  }
  document.getElementById('m-lock').addEventListener('click',function(){mode(true)});
  document.getElementById('m-free').addEventListener('click',function(){mode(false)});
  addEventListener('resize',render);addEventListener('orientationchange',render);
  render();setTimeout(render,400);
})();
</script>
</body>
</html>
